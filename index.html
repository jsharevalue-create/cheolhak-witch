, 장사면 세금, 직원, 허가 같은 책임이 는다.","맡는 일과 책임이 는다. 학교든 첫 일터든."],["회사에서 인정받다가도","남 밑에서 인정받다가도"],["부서가 바뀌든 사람이 바뀌든 옮기자는 말이 나오든","하던 일이 바뀌든 사람이 바뀌든 옮기자는 말이 나오든"],["홧김에 사표 쓰는 거","홧김에 다 그만두는 거"],["새 일은 나가기 전에 퇴근하고 먼저 해 봐라","새 일은 지금 틈틈이 먼저 해 봐라"],["퇴근하고 작게 팔아 보면서","남는 시간에 작게 팔아 보면서"],["월급날 자동이체","돈 들어오는 날 자동이체"],["월급날 동그라미","돈 들어오는 날 동그라미"]]},"Y2026_STEM":{"0":"{화자}가 올해 들기 전에 그랬다. 큰 나무, 보석, 바다, 이슬, 이 넷은 올해 힘들다고. 니가 큰 나무다. 힘내라. 아직 안 끝났다.","1":"니 같은 화초는 올해 큰 문제 없다. 되든 안 되든 바쁘게 산다. 바쁜 게 답이다.","2":"니 같은 해는 올해 모 아니면 도다. 크게 되거나 크게 비거나. 어중간한 건 없다.","3":"니 같은 촛불은 올해 소소하다. 큰일 없고 잔일 많다. 그게 나쁜 거 아이다.","4":"니 같은 큰 산은 올해 바쁘기만 하다. 바쁜데 남는 게 적다. 그래도 움직여라. 멈추면 더 없다.","5":"니 같은 밭은 올해 갈 일이 많다. 남 일 봐주느라 바쁜 해다. 니 밭부터 챙겨라.","6":"니 같은 도끼는 올해 무난하다. 자를 건 자르고 가라. 미루면 내년에 두 배다.","7":"{화자}가 올해 들기 전에 그랬다. 큰 나무, 보석, 바다, 이슬, 이 넷은 올해 조심하라고. 니가 보석이다. 올해 기대가 너무 부푼다. 내년에 실망이 따라온다. 기대를 낮춰라. 그게 약이다.","8":"{화자}가 올해 들기 전에 그랬다. 큰 나무, 보석, 바다, 이슬, 이 넷은 올해 조심하라고. 니가 바다다. 올해 불안불안하다. 근데 내년에 자리 잡는다. 올해는 버티는 해다.","9":"{화자}가 올해 들기 전에 그랬다. 큰 나무, 보석, 바다, 이슬, 이 넷은 올해 조심하라고. 니가 이슬이다. 미안하지만 내년까지 쪼매 더 힘들다. 겨울이 아직 안 끝났다. 버텨라."},"YEAR_GUNG":"올해 손님은 니 **{gung_mean}** 쪽을 건드린다. {kind_mean} 근데 손님은 간다. 운 때문에 생긴 탈은 그해만 탈이다.","YEAR_INTRO":"그라고 **올해 {yy}년.** 해마다 오는 기운은 손님이다. 10년 시즌은 니 거고, 손님은 왔다 가는 기라. 같은 손님이 와도 집마다 노는 게 다르다.","YEAR_QUIET":"올해 손님은 니 팔자를 크게 안 건드린다. 조용히 지나간다. 손님이 조용하면 니가 벌여야 된다.","YEAR_RX":["올해는 이래 살아라","올해 손님은 {ten_plain}이다. {act}"],"YEAR_TEN":{"비견":"올해 손님은 **니 같은 놈**이다. 경쟁이 붙고 사람이 는다. 고민거리가 하나 생긴다.","겁재":"올해 손님은 **니 몫 가져가는 놈**이다. 친구, 형제, 동업자가 같이 하자, 빌려 달라 카는 해다. 돈 새는 거 조심해라. 믿는 사람한테 뺏긴다.","식신":"올해 손님은 **먹고 만들고 놀자는 놈**이다. 살 붙고 새로 배우는 해다. 나쁘지 않다.","상관":"올해 손님은 **참던 게 터지는 놈**이다. 말로 사고 치기 좋은 해다. 윗사람하고 붙지 마라.","편재":"올해 손님은 **큰돈 들고 온 놈**이다. 판이 커진다. 대신 이 손님 있을 때 뭐 사지 마라. 충동이다.","정재":"올해 손님은 **꼬박꼬박 챙기는 놈**이다. 자리 잡고 안정된다. 답답해도 참아라. 쌓이는 해다.","편관":"올해 손님은 **빡센 놈**이다. 책임, 압박, 몸 고생. 버티는 해다. 대신 이 손님 가고 나면 니가 세진다.","정관":"올해 손님은 **울타리 씌우는 놈**이다. 자리, 이름, 소속이 생긴다. 니 맘대로는 못 한다.","편인":"올해 손님은 **엉뚱한 놈**이다. 엉뚱한 공부, 특이한 인연. 혼자 파고드는 해다.","정인":"올해 손님은 **받쳐 주는 놈**이다. 문서, 자격, 도움이 온다. 뭐 살 거면 이런 해에 사라."},"YOUNG_WORD":[["짝하고 자식 사이가 니 손을 거쳐야 굴러간다. 자식 문제로 부부가 부딪치고, 니 노후 계획이 자식 일로 자꾸 바뀐다.","짝하고 아랫사람 사이에서 니가 늘 중간에 선다. 곁에 둔 사람하고 니가 챙기는 사람이 부딪치고, 니 앞날 계획이 그 일로 자꾸 바뀐다."],["자식 일은 짝하고 먼저 한목소리를 내라. 니 노후 몫은 따로 떼어 둬라.","아랫사람 일은 곁에 둔 사람하고 먼저 말을 맞춰라. 니 앞날 몫은 따로 떼어 둬라."],["짝하고 자식 사이에서 니가 끼인다","짝하고 아랫사람 사이에서 니가 끼인다"],["일하고 자식이 서로 끌어당긴다","일하고 아랫사람이 서로 끌어당긴다"],["일에 몰두하면 자식이나 아랫사람 일이 터지고","일에 몰두하면 아랫사람이나 후배 일이 터지고"],["자식하고는 정해진 시간을 지켜라","니 쉬는 시간은 정해 놓고 지켜라"],["부모도 챙겨야 하고 자식도 챙겨야 한다.","부모도 챙겨야 하고 동생이나 아랫사람도 챙겨야 한다."],["자식과 말년","아랫사람과 앞날"],["새는 구멍은 **자식과 아랫사람**이다.","새는 구멍은 **아랫사람과 후배**다."],["니 노후 몫은 먼저 떼고 챙겨라.","니 앞날 몫은 먼저 떼고 챙겨라."],["자식 덕 볼 준비를 해라","아랫사람 덕 볼 준비를 해라"],["자식이나 아랫사람이 니 편이 된다","후배나 아랫사람이 니 편이 된다"]]},"V":{"ARRIVE_HEAD":["근데 없다고 평생 없는 게 아이다.","근데 팔자에 없는 것도 운으로는 들어온다.","하나 더. 없는 기운도 들어오는 때가 있다."],"ARRIVE_NEXT":"**{y1}년부터 10년**({a1}세부터)은 {el} 기운이 들어온다. {what}. 처음 2~3년은 어색하고, 손에 익으면 그게 니 무기가 된다.","ARRIVE_NONE":"앞으로 10년짜리로는 {el} 기운이 안 들어온다. 해마다 잠깐씩 오는 해만 챙겨라.","ARRIVE_NOW":"**지금 10년이 바로 그때다({y1}년에서 {y2}년).** {el} 기운이 들어와 있다. {what}. 어색해도 이게 니 무기가 되는 10년이다.","ARRIVE_PAST":"**{y1}년부터 {y2}년까지**({a1}세에서 {a2}세) 10년 동안 {el} 기운이 들어와 있었다. 그때 {what}. 돌아보면 그 10년에 니가 달라진 게 있다.","ARRIVE_SHORT":{"비겁":"사람이 붙는다.","식상":"할 말이 생긴다.","재성":"돈이 돈다.","관성":"자리가 생긴다.","인성":"도움이 온다."},"ARRIVE_WHAT":{"비겁":"내 편, 동료가 생긴다. 혼자 하던 걸 같이 하게 된다","식상":"말하고 만드는 힘이 생긴다. 안 하던 표현을 하게 된다","재성":"돈이 손에 잡히기 시작한다. 벌이 판이 달라진다","관성":"자리, 소속, 책임이 생긴다. 이름이 붙는다","인성":"배움, 자격, 도와줄 사람이 생긴다. 받쳐 주는 게 생긴다"},"ARRIVE_WHAT_PAST":{"비겁":"내 편, 동료가 생겼을 기라. 혼자 하던 걸 같이 하게 됐고","식상":"말하고 만드는 힘이 붙었을 기라. 안 하던 표현을 했고","재성":"돈이 손에 잡히기 시작했을 기라. 벌이 판이 달라졌고","관성":"자리, 소속, 책임이 생겼을 기라. 이름이 붙었고","인성":"배움, 자격, 도와줄 사람이 생겼을 기라. 받쳐 주는 게 생겼고"},"ARRIVE_YEARS":"잠깐씩 들어오는 해는 **{yrs}년**이다. 그해엔 {what_short} 대신 익숙하지 않아서 얼떨떨하다. 그해엔 큰 결정 하나만 조심해라.","BODY":{"over":["니 팔자에 제일 많은 기운이 또 들어와서 넘친다. 과로가 제일 무섭다. 일을 줄여라","많은 게 또 쌓이는 해라 몸이 먼저 무겁다. 일정 하나를 빼라","넘치는 해다. 잠 모자라면 바로 티 난다. 밤을 지켜라"],"new":"없던 기운이 들어와서 몸이 적응하느라 피곤하다. *"},"MONEY_REAL_NOJAE":{"student":"지금은 돈 기운 없다고 걱정할 때가 아이다. 문제는 첫 월급부터다. **받는 날 반은 딴 통장으로 빼라.** 돈 기운 없는 사람은 손에 있으면 쓴다.","jobseeker":"취업 전이라 더 불안하제. 돈 기운 없는 사람은 버는 재주보다 지키는 장치가 먼저다. **첫 월급 날짜에 자동이체부터 걸어라.**","employee":"월급은 꼬박꼬박 들어오는데 안 모이제. 돈 기운이 없어서 그렇다. **월급날 알아서 빠져나가게 해 놔라.** 니 손 거치면 샌다.","public":"월급 끊길 일은 없는데 목돈이 안 된다. 돈 기운 없는 사람은 안전한 자리가 복이다. **투자하자는 말은 한 번 더 거르고, 연금이나 적금처럼 묶이는 쪽**으로 가라.","self":"매출은 도는데 남는 게 없제. 돈 기운 없는 사장은 **장부하고 통장을 남한테 맡겨라.** 세무사든 믿는 가족이든. 돈 쥐는 사람이 따로 있어야 남는다.","homemaker":"살림은 알뜰한데 니 몫으로 모이는 게 없다. **니 이름 통장 하나를 따로 둬라.** 거기 들어간 건 없는 돈이다 치고.","retired":"퇴직금이며 연금은 굴리지 말고 지켜라. 돈 기운 없는 사람이 늦게 판 벌이면 다 나간다. **솔깃한 얘기일수록 가족한테 먼저 보여라.**","preretire":"퇴직이 코앞이다. 돈 기운 없는 사람이 퇴직금 들고 가게 차리면 제일 위험하다. **퇴직금은 1년 동안 손대지 마라.** 그동안 뭘 할지부터 정해라.","unknown":"돈 기운 없는 사람은 버는 재주보다 지키는 장치가 먼저다. **들어오는 날 알아서 빠져나가게 해 놔라.**"},"MOST_BAND":{"비겁":{"young":"또래한테 지는 걸 못 참는 나이다. 그 힘을 경쟁 붙는 일에 써라.","mid":"동업 얘기가 자꾸 들어온다. 명의는 니 걸로.","old":"사람 모이는 자리 한가운데 서는 나이다."},"식상":{"young":"하고 싶은 게 너무 많아서 하나를 못 끝낸다. 1년에 하나만 끝까지 가라.","mid":"니가 만든 게 니 이름이 되는 때다.","old":"손에서 놓지 마라. 뭘 만들고 있을 때 제일 건강하다."},"재성":{"young":"돈 냄새를 일찍 맡는다. 대신 한탕 하자는 말은 다 거절해라.","mid":"판 키우고 싶어지는 때다. 두 판을 한꺼번에 벌이지 마라.","old":"굴리던 걸 정리하고 지키는 나이다."},"관성":{"young":"어딜 가도 일이 맡겨진다. 거절하는 법부터 배워라.","mid":"책임이 제일 무거운 때다. 니 몸도 일정표에 넣어라.","old":"직함 내려놓는 게 제일 어려운 사람이다. 미리 연습해라."},"인성":{"young":"배우는 게 밥이 되는 사람이다. 공부를 미루지 마라.","mid":"생각은 끝났는데 몸이 안 나간다. 결정은 사흘 안에 해라.","old":"가르치고 넘겨주는 자리가 제일 맞는 나이다."}},"NEXT_INTRO_VAR":["다음 10년은 {ny}년에 열린다. {narr}","{ny}년, 문이 하나 바뀐다. {narr}","지금 10년이 끝나면 {ny}년부터 새 판이다. {narr}"],"PAST_CHILD":{"비겁":"형제나 또래 사이에서 치이던 때다. 뭘 나눠 가져야 했고, 니 몫 챙기느라 억척스러웠을 기라.","식상":"말 많고 궁금한 거 많던 아다. 이것저것 만지고 저지르다 혼났을 기라.","재성":"집안 형편이나 아버지 일이 니 어린 시절을 흔들었다. 돈 얘기가 어린 귀에도 들어오던 때다.","관성":"규칙 많은 집이었거나 어른 눈치를 일찍 배운 아다. 착하단 소리 듣느라 욕봤제.","인성":"엄마나 할매 품이 컸던 때다. 받는 게 많았고, 그래서 떼도 많이 썼을 기라."},"PAST_CHILD_GUNG":{"년":"집안 어른 쪽","월":"부모나 이사 쪽","일":"니 몸 쪽","시":"동생이나 친구 쪽"},"PAST_CHILD_REL":"그 10년엔 {where}이 흔들렸다. 그 무렵 집에 무슨 일이 있었을 기라.","PAST_FRAME_VAR":["**{y1}년부터 {y2}년까지** ({age1}세에서 {age2}세). {narr}","{age1}세부터 {age2}세까지, **{y1}년에서 {y2}년**이다. {narr}","**{y1}년**에 새 10년이 열렸다({age1}세에서 {age2}세). {narr}"],"PAST_GUNG_VAR":["그 10년엔 니 **{gung_mean}** 쪽이 흔들렸다.","그 10년엔 **{gung_mean}** 쪽이 들썩였다.","그때 흔들린 건 **{gung_mean}** 쪽이다."],"PAST_QUIET_VAR":["그 10년은 니 팔자하고 부딪치지도 붙지도 않았다. 살던 대로 산 10년이다. 지루했으면 그래서다.","그 10년은 크게 들썩인 데가 없다. 조용히 쌓은 때다.","그때는 팔자가 조용했다. 큰일보다 버릇이 굳은 10년이다."],"PAST_TEEN":{"비겁":"친구가 전부였던 때다. 무리 안에서 서열 싸움하고 친구 따라 움직였제.","식상":"말대꾸하고 반항하고 하고 싶은 게 많던 때다. 선생님하고 부딪쳤거나 딴짓하다 재주를 찾았거나.","재성":"용돈이며 알바며 일찍 돈맛을 봤거나, 집안 사정에 신경 쓰던 때다.","관성":"시험하고 규칙에 눌려서 버틴 때다. 모범생 소리 들었거나, 그게 답답해 미칠 것 같았거나.","인성":"공부 붙들고 있던 때다. 책, 학원, 자격. 받는 건 많은데 몸은 잘 안 움직였다."},"RULE_23_YOUNG":"하나 알아 둬라. 시즌 바뀌기 2~3년 전({y3}년에서 {y1}년, {a3}세에서 {a1}세)에 니가 빠져 있던 거, **그게 지금 10년의 씨앗이다.** 그때 좋아하던 걸 잊지 마라.","THEME":{"비겁":{"일":"경쟁자가 붙는 해다. 같이 하자는 제안은 한 번 더 따져라","돈":"나갈 돈이 생긴다. 빌려주는 건 주는 셈 쳐라","사람":"친구·동료가 몰린다. 사람은 많은데 정작 니 편은 적다"},"식상":{"일":"새로 벌이고 싶어지는 해다. 윗사람하고 부딪히기 쉽다","돈":"벌 궁리가 느는 만큼 쓰는 것도 는다","사람":"말이 많아진다. 한마디가 사람을 붙이기도 떼기도 한다"},"재성":{"일":"해 놓은 게 돈으로 바뀌는 해다. 벌여 놓은 게 있으면 거둬라","돈":"들어오고 나가는 판이 커진다. 큰 거 사는 건 참아라","사람":"챙길 사람이 는다. 밥값 낼 일이 많아진다"},"관성":{"일":"책임·직함이 는다. 무겁지만 그게 니 값이다","돈":"고정으로 나가는 돈(세금·보험·회비)이 는다","사람":"윗사람 눈치 볼 일이 는다. 선을 지키면 인정받는다"},"인성":{"일":"배우고 자격 따기 좋은 해다. 문서·계약이 니 편이다","돈":"큰 거 살 때 머리가 맑다. 사는 쪽이 이득이다","사람":"도와주는 사람이 온다. 받을 줄도 알아야 한다"}},"YEAR_HEAD":["올해를 하나씩 짚어 보자.","올해 뭐가 우째 움직이노? 하나씩 간다.","그래서 올해 니 살림이 우째 되냐면 이렇다."]},"B3":{"BR_REL3":{"합":"이 사람하고는 싫든 좋든 떨어지기 어렵다. 붙어 사는 인연이다.","충":"이 사람하고는 떨어져 살았거나 부딪치며 지냈을 기라. 떨어져 있는 게 서로 사는 길이다.","약":"크게 싸우진 않아도 속 긁는 일이 잦은 사이다.","none":""},"CARE_FULL":"**{who}**한테는 시키지 않아도 알아서 챙긴다.","CARE_HALF":"{who}한테는 할 도리는 한다. 딱 거기까지다.","CARE_HEAD":"니가 누굴 챙기는 사람인지도 나온다.","CARE_NONE":"{who}한테는 마음은 있는데 손이 잘 안 간다. 해 주면서도 아깝다 싶은 기라. 그걸 알고 나면 덜 미안하다.","CARE_WHO":{"아버지":"아버지","엄마":"엄마","배우자":"짝","자식":"자식"},"CHILD":{"비견":"친구 같은 자식이다. 니를 닮았다. 말년에 니 옆에서 같이 늙어 갈 사람이 있다.","겁재":"니하고 겨루는 자식이다. 고집이 니 못지않다. 이기려 들지 말고 판을 넘겨줘라.","식신":"니가 먹이고 키우는 자식이다. 챙겨 줄수록 잘 큰다. 말년이 넉넉하다.","상관":"할 말 다 하는 자식이다. 고분고분 안 듣는다. 그게 그 아 재주다.","편재":"통 큰 자식이다. 멀리 나가서 크게 논다. 니 말년 살림에 보탬이 된다.","정재":"알뜰한 자식이다. 말년 돈 관리는 그 아한테 맡겨도 된다.","편관":"니 속을 태우는 자식이다. 걱정거리 같아도 결국 니를 바로 세운다.","정관":"반듯한 자식이다. 니 이름을 세워 준다.","편인":"생각 많은 자식이다. 남하고 다른 길을 간다. 억지로 틀에 넣지 마라.","정인":"니를 받쳐주는 자식이다. 말년에 기댈 데가 있다. 자식이 부모 노릇을 하는 기라."},"CHILD_HEAD":"그라고 자식이다. 태어난 시 아랫글자가 자식 자리고, 같은 자리가 니 말년이다.","CHILD_UNKNOWN":"태어난 시를 모르니 자식 자리는 비워 둔다. 모르는 걸 지어내진 않는다. 시를 알게 되면 그때 다시 온나.","CLOSE12":["누구 탓할 거 없다. 다 자기 자리에 앉아 있는 기라.","사람은 못 바꿔도 거리는 바꿀 수 있다. 가까이 둘 사람, 쪼매 떨어뜨릴 사람. 그거 아는 게 이 편 쓸모다."],"CLOSE13":["운하고 맞짱 뜨지 마라. 받아서 넘기는 놈이 오래 간다. 드라마는 이어지기만 하면 대박 나는 기라.","힘든 건 지나간다. 니 방식대로 버티면 버틴 만큼 단단해진다. 포기만 하지 마라. 니 시즌은 아직 안 끝났다."],"COPE":{"식상":{"sign":"니는 무너질 때 몸이 먼저 간다. 자주 아프고, 쓰던 물건이 자꾸 고장 나고, 아무것도 하기 싫어서 방에만 있게 된다. 이게 신호다.","do":"**몸부터 지켜라.** 검진 받고, 일 줄이고, 잠 늘려라. 니는 몸만 멀쩡하면 다시 선다."},"재성":{"sign":"니는 무너질 때 돈이 먼저 샌다. 갑자기 큰 걸 사고 싶어지고, 돈 된다는 얘기에 귀가 솔깃해진다. 이게 신호다.","do":"**번 건 현금으로 빼놔라.** 그해엔 큰 거 사지 마라. 굴리는 사람은 멈출 줄 알아야 산다."},"관성":{"sign":"니는 무너질 때 자리가 먼저 흔들린다. 하는 일 주변에서 자꾸 부딪치고, 니 이름이 엉뚱하게 오르내린다. 이게 신호다.","do":"**본업을 지켜라.** 흔들린다고 딴 걸 벌이면 새는 구멍만 는다. 바닥 찍으면 거기서 다시 선다."},"인성":{"sign":"니는 무너질 때 머리가 먼저 흐려진다. 생각이 많아지고, 사람을 의심하고, 계약서 앞에서 망설인다. 이게 신호다.","do":"**그해엔 도장을 미뤄라.** 생각 대신 몸을 움직여라. 걷고 땀 내라. 니는 머리가 맑아야 사는 사람이다."},"비겁":{"sign":"니는 무너질 때 사람이 먼저 떨어져 나간다. 친구가 멀어지고 형제하고 돈 문제가 생긴다. 이게 신호다.","do":"**멀어지는 사람 잡지 말고, 동업하지 말고, 돈은 니 명의로 둬라.** 사람은 다시 오는데 돈은 한 번 새면 안 온다."}},"COPE_KIN_SEAT":"그라고 그해엔 **엄마하고 {who}**하고 쪼매 거리를 둬라. 흔들리는 데가 바로 엄마하고 일 자리거든. 액땜은 굿이 아니라 거리다.","COPE_KIN_YOUNG":"그해엔 가까운 사람하고 부딪치지 말고 한 발 물러서라. 이기는 게 아니라 지나가는 게 목표다.","DO":{"work":{"강":"요즘은 **배운 걸 밖에 내놔라.** 일이 막힐 땐 공부를 더 할 게 아니라 아는 걸 팔아야 된다.","왕":"요즘은 **직접 뛰어라.** 가만히 있으면 힘이 니를 갉아먹는다. 작게라도 니 판을 벌여 둬라.","쇠":"요즘은 **일을 줄여라.** 풀리는 해에 쓸 힘을 지금 채워 둬야 된다.","약":"요즘은 **사람을 세워라.** 혼자 버티면 부러진다. 니 편 하나, 대신 말해 줄 사람 하나."}},"DO_LOVE":{"bigeop":{"free":"그때까지는 **고집부터 내려놔라.** 니는 짝을 이기려 드는 버릇이 있거든. 이기지 말고 챙겨라.","dating":"그때까지는 **그 사람을 이기려 들지 마라.** 챙기는 쪽으로 가라.","married":"그때까지는 **옆 사람을 이기려 들지 마라.** 오늘 한 번 져 줘라.","reunion":"그때까지는 **고집부터 내려놔라.** 다시 만나도 이기려 들면 똑같이 끝난다."},"siksang":{"free":"그때까지는 **말수를 줄여라.** 니는 말로 짝을 긁는 버릇이 있거든. 말 대신 행동으로 보여라.","dating":"그때까지는 **말수를 줄여라.** 말 대신 안아 줘라.","married":"그때까지는 **말수를 줄여라.** 옆 사람을 말로 긁지 말고 안아 줘라.","reunion":"그때까지는 **말수부터 줄여라.** 헤어진 이유가 말이었을 공산이 크다."},"nostar":{"free":"니 팔자엔 짝 기운이 없다. **없는 건 복이다.** 안 매이거든. 대신 사람 들어오는 해엔 니가 먼저 손을 내밀어라. 기다리면 안 온다.","dating":"니 팔자엔 짝 기운이 없어서 확신이 늦게 온다. **그 사람한테 니가 먼저 표현해라.** 기다리면 식는다.","married":"니 팔자엔 짝 기운이 없어서 옆 사람을 당연하게 여긴다. **니가 먼저 말 걸고 챙겨라.** 기다리면 식는다.","reunion":"니 팔자엔 짝 기운이 없어서 매달릴수록 멀어진다. **문 열리는 해에만 움직여라.**"},"many":{"free":"니는 자꾸 **비교하는 버릇**이 있다. 기준을 딱 하나만 정해라. 그거 하나만 맞으면 나머지는 눈감아라.","dating":"니는 그 사람을 자꾸 **딴 사람하고 잰다.** 기준 하나만 맞으면 나머지는 눈감아라.","married":"니는 옆 사람을 자꾸 **딴 사람하고 잰다.** 비교를 멈춰라. 그게 싸움 불씨다.","reunion":"니는 새 사람하고 옛 사람을 자꾸 **잰다.** 기준 하나만 정해라."},"none":{"free":"그때까지는 **좋은 해를 기다리고, 흔들리는 해엔 큰 결정 하지 마라.** 짝 일은 해를 골라 움직이는 사람이 이긴다.","dating":"그때까지는 **좋은 해에 약속하고, 흔들리는 해엔 큰 말 아껴라.**","married":"그때까지는 **좋은 해엔 같이 벌이고, 흔들리는 해엔 거리를 둬라.** 부부 일도 해를 골라 움직이는 사람이 이긴다.","reunion":"그때까지는 **문 열리는 해까지 기다려라.** 흔들리는 해에 붙으면 또 갈라진다."}},"DX_HEAD":{"work":"**일 얘기부터 하자.** 요새 와 이런지, 언제 풀리는지.","money":"**돈 얘기다.** 요새 와 이런지, 언제 들어오는지.","love":"**짝 얘기다.** 요새 와 이런지, 언제 풀리는지."},"DX_MONTH":"달로 보면 좋은 달은 {good}이다.{bad} (달은 절기로 바뀐다. 양력 그달 4일에서 8일쯤부터 그 달로 친다.)","DX_MONTH_BAD":" 조심할 달은 {bad}이다.","DX_MONTH_NONE":"올해, 내년 안에 달로 짚을 만한 건 없다. 해 단위로만 봐라.","DX_NATAL_LABEL":"","DX_NATAL_LOVE":"니는 짝하고 {other} 쪽이 {kind}. 그래서 짝 문제가 **늘 비슷한 모양으로 되풀이된다.** 사람이 바뀌어도 그렇다. 운이 아니라 팔자 모양이다.","DX_NATAL_LOVE_NONE":"니 팔자는 짝 쪽이 원래 깔끔하다. 요새 짝 일이 꼬이는 건 **운 때문이다.** 운은 지나간다.","DX_NATAL_WORK":"니는 일하고 {other} 쪽이 {kind}. 그래서 일이 **늘 한 번씩 같은 데서 걸린다.** 운 탓이 아니라 니 팔자 모양이 그런 기라. 알고 있으면 덜 넘어진다.","DX_NATAL_WORK_NONE":"니 팔자는 일 쪽이 원래 깔끔하다. 요새 일이 꼬이는 건 니 탓이 아니라 **운이 들어와서 그런 기라.** 운은 지나간다.","DX_WHEN_DW":"{y2}년까지 10년은 ","DX_WHEN_YR":"올해는 ","EL_NAME":{"0":"나무","1":"불","2":"흙","3":"쇠","4":"물"},"EL_PERSON":{"0":"곧고 앞으로 뻗는 사람, 계획 세워서 밀고 가는","1":"밝고 표현 잘하는 사람, 분위기 살리는","2":"듬직하고 믿음직한 사람, 말보다 행동인","3":"맺고 끊는 게 분명한 사람, 결단 빠른","4":"유연하고 생각 깊은 사람, 잘 들어 주는"},"END_HEAD":"마지막으로, 니 인생 마지막 시즌은 **{y1}년, {a1}세부터**다.","END_PREP":"지금부터 준비해도 안 늦다. 인생에 늦은 거는 없다.","END_WANT":{"재성":"끝에 이루고 싶은 목표가 기다린다. 니는 끝까지 뭘 이루려고 사는 사람이다. 목표 없이 떠도는 게 제일 괴롭다.","식상":"끝에 여유가 기다린다. 결국 니가 원하는 건 좀 놀고, 좀 다니고, 좀 먹는 거다. 그거 부끄러워할 거 없다.","관성":"끝에 이름과 자식이 기다린다. 니가 없어도 니 이름이 남고 자식이 잘되는 거. 그게 니가 끝내 원하는 기라.","인성":"끝에 공부가 기다린다. 니는 늙어서도 뭘 배우고 있을 사람이다. 그게 니 낙이다.","비겁":"끝까지 고민이 따라온다. 니는 끝까지 「이게 맞나」 묻는 사람이거든. 그러니 지금 정해 둬라. 니 인생에서 제일 중요한 게 뭔지."},"FATHER":{"비견":"니 아버지는 니하고 똑 닮은 사람이다. 고집도 말버릇도. 그래서 편하면서도 자주 부딪쳤을 기라. 니한테 남은 거는 이거다. 니는 결국 아버지를 닮아 간다. 떨어져 살아도 말버릇이며 고집이며 어느새 아버지 하던 대로 하고 있을 기라.","겁재":"니 아버지는 지기 싫어하는 사람이다. 밖에선 사람 좋은데 판만 벌어지면 눈빛이 달라진다. 집안 돈이 아버지 손에서 새기도 했을 기라. 니한테 남은 거는 이거다. 아버지한테 받은 건 악바리 승부욕이다. 쓸 데가 있으면 무기고, 쓸 데가 없으면 괜히 성질만 난다. 싸울 판을 골라라.","식신":"니 아버지는 사람 좋고 여유 있는 사람이다. 먹이고 챙기는 걸 좋아한다. 대신 큰돈 버는 쪽은 아니었을 기라. 니한테 남은 거는 이거다. 아버지한테 받은 건 여유다. 급할 게 없고 먹고 노는 맛을 안다. 남들이 한량이라 캐도 그게 니 속도다.","상관":"니 아버지는 말이 세고 자기 생각이 분명한 사람이다. 윗사람 안 가리고 할 말 하는 사람이라, 일하는 데가 순탄치는 않았을 기라. 니한테 남은 거는 이거다. 아버지한테 받은 건 밀어붙이는 힘이다. 말이 세고 판을 뒤집을 줄 안다. 그 힘을 윗사람 들이받는 데 쓰지 말고 새 판 짜는 데 써라.","편재":"니 아버지는 통 큰 사람이다. 밖으로 돌고 판을 크게 벌인다. 집에 붙어 있는 시간은 적었을 기라. 니한테 남은 거는 이거다. 아버지한테 받은 건 통이다. 꿈이 크고 판을 크게 본다. 쪼매 벌어 쪼매 쓰는 건 니 체질이 아니다. 대신 크게 잃을 각오도 해야 된다.","정재":"니 아버지는 성실하고 알뜰한 사람이다. 꼬박꼬박 벌어서 집을 지킨 사람이다. 니한테 남은 거는 이거다. 아버지한테 받은 건 거북이 걸음이다. 꾸준히, 차곡차곡. 빠르진 않아도 안 무너진다.","편관":"니 아버지는 엄하고 무서운 사람이다. 말보다 불호령이 먼저였을 수도 있다. 대신 책임감 하나는 셌다. 니한테 남은 거는 이거다. 아버지한테 받은 건 센 자리 좋아하는 성질이다. 순한 일 하면 답답해 죽는다. 책임 무거운 자리로 가라.","정관":"니 아버지는 반듯한 사람이다. 규칙 지키고 체면 챙기는 사람이라 바른말을 많이 들었을 기라. 니한테 남은 거는 이거다. 아버지한테 받은 건 바른 생활이다. 정해진 대로, 규칙대로. 재미는 없어도 사람들이 니를 믿는다. 그게 니 밑천이다.","편인":"니 아버지는 좀 별난 사람이다. 혼자 파고드는 게 있고 속을 잘 안 보인다. 가까이 다가가기 어려웠을 기라. 니한테 남은 거는 이거다. 아버지한테 받은 건 남 안 하는 쪽 파고드는 끼다. 대신 게으름도 같이 따라왔다. 마감을 정해 놓고 해라.","정인":"니 아버지는 뒤를 받쳐 주는 사람이다. 공부하라 카고 뒷바라지를 했다. 엄마 같은 아버지였을 기라. 니한테 남은 거는 이거다. 아버지한테 받은 건 공부 체질이다. 배우는 게 편하고 가르치는 게 자연스럽다. 머리로 먹고사는 사람이다."},"FATHER_HEAD":"먼저 아버지다. 팔자 표에서 태어난 달 윗글자가 아버지 자리다. 거기 앉은 기운을 보면 아버지가 어떤 사람인지 나온다.","FLOW_DW":"{y1}년부터 {y2}년까지 10년은 그 {role} 통째로 밀어준다. 한 해가 아니라 한 시즌이 그렇단 말이다.","FLOW_FULL_YEAR":"니는 따로 기다릴 해는 없다. 대신 **{yy}년**처럼 기운이 넘치는 해엔 쪼매 덜어내라.","FLOW_GOAL":"니가 {how} 거는 결국 **{what}을 키우려고** 그러는 기라. 그게 니가 움직이는 진짜 이유다.","FLOW_GOAL2":"니 힘은 결국 **{what}** 쪽으로 모인다. 거기가 니 한창이다.","FLOW_HEAD":"이제 니 흐름이다. 사람마다 일이 시작되는 때, 한창인 때, 정리되는 때가 따로 있거든.","FLOW_HOW":{"비겁":"사람 모으고 부대끼는","식상":"뭘 만들어 내놓는","재성":"돈 굴리는","관성":"자리 지키는","인성":"배우고 쌓는"},"FLOW_SHAPE":{"생":"니는 **시작은 잘하는 사람**이다. 근데 벌여 놓고 매듭을 못 짓는 버릇이 있제?","왕":"니는 **한창일 때 제일 잘하는 사람**이다. 대충 하는 것 같아도 해 놓으면 잘한다. 대신 시작도 정리도 누가 옆에서 해 줘야 움직인다.","고":"니는 **정리는 잘하는데 시작을 못 하는 사람**이다. 생각만 하다 날 새는 거, 맞제?","생왕":"니는 벌이고 달리는 건 되는데 **마무리가 약하다.** 늘 바쁜데 매듭이 안 지어진다.","생고":"니는 시작하고 접는 건 하는데 **한창 달리는 때가 따로 와야 한다.**","왕고":"니는 하던 걸 잘 마무리한다. 대신 **새로 시작하는 게 제일 어렵다.**","생왕고":"니는 벌이고 달리고 접는 걸 **혼자 다 하는 사람**이다. 대신 한쪽으로 너무 쏠리니 몰빵은 하지 마라."},"FLOW_WHAT":{"비겁":"니 자신","식상":"니 재주","재성":"니 살림","관성":"니 자리와 이름","인성":"니 배움과 문서"},"FLOW_YEAR":{"생":"**{yy}년**엔 새로 시작할 일이 생긴다. 그해에 벌인 게 앞으로 니 판이 된다.","왕":"**{yy}년**엔 바빠진다. 하던 게 제대로 굴러간다.","고":"**{yy}년**엔 지금 붙잡고 있는 일이 매듭지어진다. 좋게든 나쁘게든. 억지로 끌지 마라."},"GLOSS":{"甲":"갑, 큰 나무","乙":"을, 풀과 꽃","丙":"병, 한낮의 해","丁":"정, 촛불","戊":"무, 큰 산","己":"기, 논밭","庚":"경, 바위와 쇠","辛":"신, 보석","壬":"임, 큰 바다","癸":"계, 이슬비","子":"자, 한겨울 밤 물","丑":"축, 언 땅","寅":"인, 이른 봄 나무","卯":"묘, 한봄 나무","辰":"진, 봄비 머금은 땅","巳":"사, 초여름 불","午":"오, 한여름 낮 불","未":"미, 한여름 마른 땅","申":"신, 초가을 쇠","酉":"유, 한가을 쇠","戌":"술, 늦가을 마른 땅","亥":"해, 초겨울 물"},"GOBI":"니 고비는 무기가 정면으로 맞는 해다. 앞으로는 **{yy}년**이 그렇다.","GOBI_DW":" {y1}년부터 {y2}년까지 10년도 그 자리가 계속 흔들린다. 그 시즌엔 판을 키우지 마라.","GOBI_DW_NOW":" 그라고 {y2}년까지는 지금 시즌 자체가 그 자리를 흔든다. 판을 키우지 마라.","GOBI_NOW":"니 고비는 무기가 정면으로 맞는 해인데, 그게 **바로 올해**다. 요즘 유난히 버거웠으면 그래서다.","GUARD_TAG":" 다행히 니는 그 자리가 둘이라 버틴다. 한 대 맞아도 안 넘어간다.","GY_HEAD":"니 무기부터 보자. 니는 **{plain}** 쪽으로 먹고사는 사람이다.","GY_MEAN":{"비겁":"니 몸 하나로 서는 사람이거든. 사람 모으고 직접 뛰는 게 니 무기다.","식상":"손이든 입이든 뭘 만들어 내놓는 게 니 무기거든. 그래서 몸이 무너지면 다 무너진다.","재성":"돈이든 사람이든 판을 굴리는 게 니 무기거든.","관성":"자리 지키고 책임지는 게 니 무기거든. 조직에서 이름 걸고 하는 일이 맞다.","인성":"배워서 넘기는 게 니 무기거든. 아는 거, 자격, 문서가 니 밑천이다."},"GY_OFF":"근데 이 무기는 칼집에 들어 있다. 니가 꺼내 써야 남들이 알아본다.","GY_ON":"이 무기는 밖으로 훤히 드러나 있다. 남들도 니가 뭘 잘하는지 안다.","HOLD_INTRO":["힘들 때 버티는 법은 사람마다 다르다. 남 따라 버티면 더 다친다. 니 방식을 보자.","누구는 쉬어야 살고 누구는 뛰어야 산다. 니는 어느 쪽이고? 그것부터 보자."],"INNER":{"yang":"니 속엔 **또 다른 사람**이 하나 산다. 겉으로는 세 보이는데 속은 여리거든. 욕쟁이 할매가 뒤돌아서 눈물 훔치는 거랑 같다. 여린 데 들킬까 봐 더 세게 말하는 기라.","yin":"니 속엔 **또 다른 사람**이 하나 산다. 겉으로는 여려 보이는데 속에 센 놈이 산다. 얕보고 건드렸다간 상대가 식겁한다."},"INSEONG":{"use":{"식상":"배운 게 쓰이는 팔자다. 가르치고 풀어내는 쪽이 맞거든. 처음엔 겁나도 자꾸 하면 길이 난다. **힘들 땐 눈 딱 감고 저질러라.** 니는 저질러도 사고 칠 사람이 아니다.","재성":"배운 게 쓰이는 팔자다. 계산기 두드려서 확실한 것만 하는 사람이거든. 힘들 땐 판을 줄이고 **확실한 거 하나만** 해라.","both":"배운 게 쓰이는 팔자다. 아는 걸 팔 줄 아는 사람이거든. 힘들 땐 니가 아는 걸 남한테 가르쳐라. 그게 돈이 된다.","none":"배운 건 많은데 꺼낼 데가 없다. 이런 사람이 박사까지 하고 노는 기라. 자격증 고마 따라. 지금 있는 걸로 **딱 하나만 밖에 내놔라.**"},"lean":{"식상":"니는 배운 걸 쥐고 쓰기보다 기대는 쪽이다. 부끄러운 거 아니다. 평생 기댈 데가 있다는 소리거든. 대신 기댄 채로라도 **입은 열어라.** 니 말이 니 살길이다.","재성":"니는 쥐고 쓰기보다 기대는 쪽이다. 기댈 데가 있다는 건 복이다. 대신 돈 계산만은 니가 직접 해라.","both":"니는 쥐고 쓰기보다 기대는 쪽이다. 힘들 땐 기대라. 대신 기댄 사람한테 뭘 돌려줄지는 정해 둬라.","none":"니는 기대는 쪽이다. 힘들 때 니를 살리는 건 사람이거든. **도와달라는 말을 먼저 해라.** 니는 그 말 해도 되는 팔자다."}},"KIND3_MEAN":{"충":"원래 부딪치게 돼 있다","형":"밀어붙이다 대가를 치르게 돼 있다","파":"깨졌다 붙었다 하게 돼 있다","해":"속을 긁게 돼 있다"},"KIN_OF_SEAT":{"년":"집안 어른","월":"엄마·일터","일":"짝·니 몸","시":"자식"},"KIN_SEAT_BR":{"년":"집안 어른","월":"엄마","일":"짝","시":"자식"},"KIN_SEAT_BR_FREE":{"일":"니 곁에 있는 사람"},"KIN_SEAT_STEM":{"년":"집안 어른","월":"아버지","시":"자식"},"LEAK":{"살":"그라고 니 돈은 **억울하게 새는 길**이 하나 있다. 뺏기고, 물어내고, 엉뚱한 데 쓴다. 번 건 숨겨라. 동업하지 마라. 쪼매 이기적으로 살아도 된다.","관":"그라고 니 돈은 남 좋은 데로 잘 흘러간다. 가족, 일, 체면 세우는 데. 잘 쓴 돈이긴 한데 **니 몫은 따로 떼어 숨겨라.**","tight":"그라고 니는 돈 안 쓰는 사람이다. 모으는 건 잘하는데, 쓸 데 안 쓰면 사람이 떠난다. **커피값은 니가 내라.**"},"LOVE_ACT":{"bind":{"free":"**만나면 붙잡아라.** 대신 도장은 한 계절 더 보고 찍어라.","dating":"**약속 얘기 나오면 받아라.** 대신 도장은 한 계절 더 보고 찍어라.","married":"**둘이 같이 뭘 시작해라.** 이사든 계획이든.","reunion":"* 을 잘 안 쓰는 사람이라 모이긴 모인다. 커피값은 니가 내라. 사람이 남는다."},"MONEY_PEOPLE":" 근데 니 돈은 사람한테서 샌다. 지인 돈거래, 보증, 동업. 이 세 개만 안 해도 반은 지킨다.","MONEY_PYEONIN":" 그라고 니는 남들 안 사는 걸 사는 사람이다. 주식이며 코인이며 그런 건 하지 마라. 들여다보다 속이 먼저 탄다.","MONEY_SAVE":{"seat":"모으는 법은 이거다. 월급날 자동이체로 먼저 떼라. 니 돈은 더 버는 게 아니라 안 새게 하는 게 버는 기라.","steady":"모으는 법은 이거다. 자동이체 적금. 금액보다 **안 깨는 게** 니 무기다.","flow":"모으는 법은 이거다. **들어온 날 반은 딴 통장으로.** 들쭉날쭉한 돈은 좋은 달에 떼 놔야 나쁜 달을 버틴다.","both":"모으는 법은 이거다. 월급은 생활비, **부업 돈은 통째로 모아라.** 섞으면 다 샌다."},"MONEY_SAVE_BIZ":{"seat":"모으는 법은 이거다. 들어온 돈은 일단 사업 통장에 두고, 니 생활비는 월급처럼 정해서 니한테 줘라.","steady":"모으는 법은 이거다. 사업 통장하고 생활 통장을 갈라라. **정기로 들어오는 돈의 일부는 손대지 마라.**","flow":"모으는 법은 이거다. **들어온 날 반은 딴 통장으로.** 들쭉날쭉한 돈은 좋은 달에 떼 놔야 나쁜 달을 버틴다.","both":"모으는 법은 이거다. 고정 수입은 생활비로 쓰고, **큰 건으로 들어온 돈은 통째로 모아라.**"},"MONEY_SEASON_TYPE":{"비겁":"share","재성":"harvest","식상":"seed","인성":"bound","관성":"duty"},"MONEY_SHAPE":{"seat":"니 돈은 **자리에서 나오는 돈**이다. 월급이든 연금이든 자리값으로 받는 돈이거든. 한 방 노리면 부러진다. 자리 지키는 게 돈 지키는 기라.","steady":"니 돈은 **따박따박 들어오는 돈**이다. 월급이든 적금이든 정해진 날 들어오는 돈이 맞는다. 한 방은 니 돈이 아니다.","flow":"니 돈은 **굴려서 버는 돈**이다. 장사든 영업이든 건당 일이든 움직여서 버는 돈이라 들쭉날쭉한데 한 번씩 크게 들어온다.","both":"니 돈은 **월급하고 굴리는 돈 둘 다 되는** 모양이다. 본업 벌이에 부업 하나 붙이는 게 맞다."},"MONEY_SHAPE_BIZ":{"seat":"니 돈은 **이름값에서 나오는 돈**이다. 팔자에 돈 기운이 따로 없어서, 돈이 니 실력하고 신용을 타고 들어온다. 단골, 소개, 거래처가 니 돈줄이다.","steady":"니 돈은 **따박따박 들어오는 돈**이 맞다. 장사를 해도 단골 장사, 일을 해도 정기 계약이 니한테 맞는다. 한 방 큰 건은 니 돈이 아니다.","flow":"니 돈은 **굴려서 버는 돈**이다. 건마다 들쭉날쭉한데 한 번씩 크게 들어온다. 사업 체질 돈이다.","both":"니 돈은 **고정하고 큰 건 둘 다 되는** 모양이다. 고정 거래처로 바닥을 깔고 큰 건으로 키워라."},"MONEY_SRC":{"skill":" 그라고 니 재주가 돈이 된다. 손기술이든 말솜씨든 그걸로 번 돈이 제일 오래간다.","given":" 그라고 니 돈은 니 재주보다 자리에서 나온다. 직장 자리든 가게 자리든 단골이든 그 판을 지키는 게 먼저다.","seat":""},"MOTHER":{"비견":"니 엄마는 친구 같은 사람이다. 니하고 닮아서 편한데, 닮아서 또 자주 부딪친다.","겁재":"니 엄마는 억척스러운 사람이다. 지지 말라꼬 키웠다. 그 덕에 니는 판에서 안 물러선다.","식신":"니 엄마는 먹이고 챙기는 사람이다. 배곯을 일은 없었제? 니가 사람 챙기는 게 다 거기서 배운 기라.","상관":"니 엄마는 말이 센 사람이다. 잔소리든 칭찬이든 억수로 세게 했다. 니 말솜씨가 엄마한테서 왔다.","편재":"니 엄마는 바깥일로 바빴던 사람이다. 옆에 오래 있진 못했어도 세상 넓은 거는 보여줬다.","정재":"니 엄마는 살림 야무진 사람이다. 아껴 쓰고 모으는 걸 보고 컸다. 니 돈 감각이 거기서 왔다.","편관":"니 엄마는 엄하게 키운 사람이다. 매서웠제. 그게 상처로 남았으면 이제 고마 내려놔라. 니를 버티게 한 것도 그거다.","정관":"니 엄마는 규칙을 가르친 사람이다. 해도 되는 거, 하면 안 되는 거. 니가 선을 지키는 사람이 된 게 그래서다.","편인":"니 엄마는 남들 엄마하고 좀 다른 사람이다. 니가 옆길로 잘 새는 것도, 남 안 보는 걸 보는 것도 그 덕이다.","정인":"니 엄마는 받쳐 주는 사람이다. 늘 니 편이었다. 그 받침이 있어서 니가 지금까지 버틴다."},"MOTHER_HEAD":"다음은 엄마다. 태어난 달 아랫글자가 엄마 자리다. 거기 앉은 기운이 니 엄마가 어떤 사람인지, 니가 어떤 집에서 컸는지를 말해 준다.","PEAK2_INTRO":"일이 제일 잘 풀리는 때를 보자. 스무 살부터 해마다 다 재 보고, 10년 시즌 중에 제일 높은 시즌 하나, 그 안에서 제일 높은 해 하나를 골랐다.","PEAK2_LEFT":" 제일 높은 해까지는 {n}년 남았다.","PEAK2_LOW":"반대로 제일 낮은 시즌은 {y1}년부터 {y2}년까지({a1}세에서 {a2}세)다. 그때는 판을 키우기보다 정비하고 충전하는 10년으로 써라.","PEAK2_NOW":{"before":"지금부터 {n}년 남았다. 정점은 갑자기 오는 게 아니라 그 전 2~3년에 깔아 둔 게 터지는 기라. {y3}년부터 {y1}년 사이에 뭘 깔지 지금 정해라.","in":"**지금이 바로 그 시즌이다.** 미루지 마라. 이 10년에 벌인 게 남은 인생을 먹여 살린다.{left}","after":"이 시즌은 지나갔다. 그때 니가 붙잡고 있던 일이 니 일복 붙는 자리다. 남은 것 중에서는 **{y1}년부터 {y2}년까지**가 제일 낫고, 그 안에서 {yy}년이 제일 높다.","after_none":"이 시즌은 지나갔다. 이제는 쌓은 걸 넘겨주는 자리에서 빛나는 기라. 가르치고, 봐주고, 물려줘라."},"PEAK2_SEASON":"**니 커리어 정점 시즌은 {y1}년부터 {y2}년까지, {a1}세에서 {a2}세다.** {plain}. 니 인생에서 일복이 제일 두터운 10년이 이때다.","PEAK2_SEASON_PAST":"**니 커리어 정점 시즌은 {y1}년부터 {y2}년까지, {a1}세에서 {a2}세였다.** {plain}이었다. 니 인생에서 일복이 제일 두터운 10년이 그때였다.","PEAK2_YEAR":"그 안에서도 **제일 높은 해는 {yy}년, {age}세 때**다. 그해는 {kind} {how}","PEAK2_YEAR_PAST":"그 안에서도 **제일 높은 해는 {yy}년, {age}세 때**였다. 그해는 {kind} {how}","PEAK_ACT":{"재성":" 이 해엔 단가를 올리고 큰 건을 잡아라.","관성":" 이 해에 맡겨지는 자리는 받아라.","식상":" 이 해엔 니 걸 세상에 내놔라.","인성":" 자격이나 계약은 이 해에 마무리해라.","비겁":" 같이 할 사람은 이 해에 모아라."},"PEAK_BADGE":["최전성기","대호기","호기","상승기","상승기"],"PEAK_BASIS":"이건 별자리니 숫자니 안 섞고 사주로만 잰 거다.","PEAK_CLOSE":["정점은 운이 주는 게 아니다. 운 올 때 니가 어디 서 있느냐가 만드는 기라.","좋은 해에 놀면 그냥 좋은 해로 끝난다. 그해에 일 벌인 사람한테만 정점이다."],"PEAK_DEC":"10년씩 묶어 보면 니 일복이 제일 두터운 때는 **{d}대**다.","PEAK_HOW":{"wl":["하던 데서 니를 붙잡고 밀어준다.","하던 데서 니를 붙잡고 밀어줬다."],"gy":["니 무기가 겉으로 드러난다.","니 무기가 겉으로 드러났다."],"fl":["니 흐름이 한창일 때다.","니 흐름이 한창이었다."],"dw":["10년 흐름까지 받쳐 준다.","10년 흐름까지 받쳐 줬다."]},"PEAK_INTRO":"일이 제일 잘 풀리는 해, **커리어 정점기**다. 스무 살부터 예순아홉까지 } 10년이다.** {event}.","SC_WEAK_NOTE":" 근데 니는 들어와도 혼자 다 못 담는다. 크게 벌이지 말고 지켜라.","SEAT_INTRO":["사람은 자리로 찾는 기라. 누가 니 인생에 어떤 사람인지는 팔자 표 **자리**에 다 적혀 있거든. 자리부터 보자.","엄마는 엄마 자리에, 아버지는 아버지 자리에 앉아 있다. 그 자리에 **어떤 기운이 앉았나** 보면 그 사람이 보이거든."],"SEAT_PLAIN":{"년":"집안","월":"일","일":"짝","시":"자식"},"STEM_REL3":{"합":"아버지하고는 싫든 좋든 붙어 가는 사이다.","극":"아버지 기대가 무거웠을 기라. 그 무게가 니를 단단하게 만들었다.","none":""},"SURFACE":{"same":"그라고 니는 **겉과 속이 같은 사람**이다. 생각한 대로 산다. 대신 좋고 싫은 게 너무 분명해서, 맞는 사람한텐 최고고 안 맞는 사람한텐 버겁다.","fire_water":"그라고 니는 **몸은 여름에 있는데 생각은 겨울에 가 있는 사람**이다. 기분이 오르락내리락하는 게 그래서다. 니 탓 아니다. 기분 따라 큰 결정만 하지 마라.","water_fire":"그라고 니는 **몸은 겨울에 있는데 생각은 여름에 가 있는 사람**이다. 속은 차분한데 머리는 뜨겁다. 기분 따라 큰 결정만 하지 마라."},"TAL_DOSIK":"하나 짚고 가자. 니는 생각은 많은데 손이 안 나가는 모양이다. 그래서 「내가 뭘 해야 될지 모르겠다」는 소리를 달고 살았을 기라. 처방은 이거다. **생각이 반쯤 섰으면 일단 내놔라.** 다 완성하고 내놓으려면 평생 못 내놓는다.","TAL_DREAM":"마흔 넘어서 「이제 와서 뭘 하노」 싶어도, **못다 이룬 꿈이 곧 니 재주**다. 젊을 때 하고 싶었는데 먹고사느라 접어 둔 거 있제? 그게 위에 말한 쪽 일이면 지금 다시 꺼내도 안 늦다. 본업은 지키고 옆에서 작게 시작해라. 해 보면 몸이 먼저 신이 난다.","TAL_GY":{"비견":"니한테 맞는 일은 **니가 대장인 일**이다. 작은 가게라도 니 이름 걸고 니가 정하는 판. 동업은 하지 마라. 사공이 둘이면 배가 산으로 간다.","겁재":"니한테 맞는 일은 **니가 대장인 일**이다. 승부 걸린 판에서 니가 산다. 동업은 하지 마라. 사공이 둘이면 배가 산으로 간다.","식신":"니한테 맞는 일은 **말하고 가르치고 챙기는 일**이다. 상담이든 강의든 장사든 손으로 만드는 일이든 다 된다. 니는 사람하고 잘 섞이거든. 그게 밑천이다.","상관":"니한테 맞는 일은 말하고 가르치고 만드는 일인데, **남 입맛에 맞추지 말고 니 입맛대로 밀어라.** 손님 비위 맞추려 들면 니 재주가 죽는다. 니가 좋아서 만든 게 언젠가 알아주는 사람을 만난다.","편재":"니한테 맞는 일은 **판을 크게 굴리는 일**이다. 장사를 해도 크게, 영업을 해도 크게. 쪼매 아끼는 일은 니 몸에 안 맞는다.","정재":"니한테 맞는 일은 **꾸준히 쌓는 일**이다. 관리든 회계든 장부 살림이든 매일 같은 걸 틀림없이 해내는 데서 니가 빛난다.","편관":"니한테 맞는 일은 **책임 무거운 자리**다. 사람 부리고, 규칙 세우고, 급한 불 끄는 일. 편한 자리에선 오히려 시든다.","정관":"니한테 맞는 일은 **이름 걸린 자리**다. 조직이든 기관이든 자격이 있는 일. 줄 서서 올라가는 게 니 길이다.","편인":"니한테 맞는 일은 **남이 안 보는 걸 보는 일**이다. 특수한 기술이든 연구든 파고드는 전문 분야. 남들 다 하는 거 따라 하면 니가 제일 못한다.","정인":"니한테 맞는 일은 **배워서 넘기는 일**이다. 가르치고, 자격 따고, 문서로 인정받는 일. 시험이 니 편이다."},"TAL_KING":"그라고 니 팔자는 **제일 버거운 모양**이다. 고집 세고, 혼자 파고들고, 참던 게 터지는 기운만 있고 남 맞춰 주는 기운이 없거든. 어느 시대든 이런 사람을 편하게 안 봤다. 그래서 가는 데마다 튕겨 나왔을 기라. 근데 잘 들어라. 법만 안 어기면 니 고집이 맞다. 남 눈치 보고 맞추는 순간 니가 시든다. 니 길로 끝까지 가면 꽃 피는 날이 반드시 온다.","TAL_STRUCT":{"jeong":"니는 **정해진 길에서 크는 사람**이다. 학교든 회사든 줄 서 있는 데서 편했제? 남들이 안정만 찾는다 캐도 신경 쓰지 마라. 줄 선 데서 한 칸씩 올라가는 게 니 방식이다.","pyeon":"니는 **구르는 돌**이다. 정해진 길보다 니 길을 가야 사는 사람이거든. 어디 소속돼도 오래 못 붙어 있었거나, 붙어 있어도 속이 끓었을 기라. 할 일은 하나다. 니가 주인인 판을 찾아라. 남 밑에서 참는 게 니 병이다.","mix":"니는 **조직에서도 되고 니 판에서도 되는 사람**이다. 회사에서 인정받다가도 한 번씩 뛰쳐나가고 싶었제? 본업은 지키고, 니 판은 옆에 작게 하나 둬라."},"TAL_WHY":"사람마다 남 맞춰 주는 기운이 센 사람이 있고 니 맘대로 하는 기운이 센 사람이 있거든. 국숫집 둘을 생각해 봐라. 하나는 손님한테 간 어떠냐 물어 가며 맞추고, 하나는 지 입에 맞는 간으로 끝까지 민다. 둘 다 장사는 된다. 가는 길이 다를 뿐이다.","THEME_WORK":{"관성":{"biz":"책임질 계약이며 허가 일이 는다. 무겁지만 그게 니 값이다","free":"책임질 계약이 는다. 무겁지만 그게 니 값이다","seek":"붙을 자리나 자격이 생긴다. 무거워도 받아라","young":"소속이나 맡을 역할이 생긴다","home":"집안에서 맡을 일이 는다","retired":"맡아 달라는 일이 생긴다","any":"맡을 책임이 는다"},"식상":{"biz":"새로 벌이고 싶어지는 해다. 손님이나 거래처하고 말로 부딪치기 쉽다","free":"새로 벌이고 싶어지는 해다. 일 주는 쪽하고 말로 부딪치기 쉽다","seek":"뭐라도 벌이고 싶어지는 해다. 작게 시작해 봐라","young":"하고 싶은 게 생기는 해다. 윗사람하고 부딪치기 쉽다","home":"뭐라도 배우고 벌이고 싶어진다","retired":"하고 싶던 걸 꺼내기 좋은 해다","any":"새로 벌이고 싶어지는 해다. 윗사람이나 거래처하고 부딪치기 쉽다"}},"TWIST_LIFE":"하나 더 있다. 니 팔자엔 니 무기를 방해하는 기운이 하나 끼어 있거든. 잘 나가다 꼭 한 번씩 엇나가는 게 이거 때문이다. 없애려 하지 말고 **긴장감으로 써라.** 방해하는 놈이 있어야 니가 안 늘어진다.","TWIST_ON":"하나 더 있다. 니 팔자엔 니 무기를 방해하는 기운이 하나 끼어 있거든. 잘 나가다 꼭 한 번씩 엇나가는 게 이거 때문이다. 근데 **{y1}년부터 {y2}년까지는 이놈이 묶인다.** 그때 니 무기가 제일 또렷해진다. 당겨진 고무줄이 멀리 튀는 거랑 같다. 방해한 게 헛게 아니었던 기라.","WEIGHT":{"아버지":["그라고 니 팔자 전체로 보면 아버지 쪽 인연은 옅다. 아버지가 어떤 사람이든 니 큰 결정에 깊이 끼어들진 않는다.","니 팔자 전체로 보면 아버지 쪽 인연은 딱 보통이다.","그라고 니 팔자 전체로 보면 아버지 쪽 인연이 짙다. 좋든 싫든 니 큰 결정마다 아버지 생각이 따라 들어온다."],"엄마":["그라고 니 팔자 전체로 보면 엄마 쪽 인연은 옅다. 덜 사랑해서가 아니라 애틋함이 남들보다 옅게 짜인 기라. 서운할 것도 미안할 것도 없다.","니 팔자 전체로 보면 엄마 쪽 인연은 딱 보통이다.","그라고 니 팔자 전체로 보면 엄마 쪽 인연이 짙다. 나이 먹어도 엄마 목소리가 니 머릿속에 산다."],"자식":["니 팔자 전체로 보면 자식 쪽 인연은 옅다. 자식이 없다는 소리가 아니라 자식 일로 니 인생이 휘둘리진 않는다는 소리다.","니 팔자 전체로 보면 자식 쪽 인연은 딱 보통이다.","니 팔자 전체로 보면 자식 쪽 인연이 짙다. 자식 일이 니 인생에서 차지하는 몫이 크다."]},"WORK_ACT":{"rise":{"salary":"**옮기지 말고 지금 자리를 키워라.**","biz":"**가게 옮기지 말고 지금 판을 키워라.**","free":"**붙은 일감 놓치지 말고 키워라.   var sq=p.daeun.seq, step=p.daeun.fwd?1:9;

    if(!(c.start_age<=age && (age<c.start_age+10 || c.i===sq.length))) e.push('현재 시즌이 나이를 안 담는다');
  }
  // 열두 편이 다 있고 비어 있지 않은가
  if(isTeen(p)?r.chapters.length!==(p.ctx.viewer==='parent'?B2.TEEN_ORDER_P:B2.TEEN_ORDER).length:(r.chapters.length!==16 && r.chapters.length!==17)) e.push('편 수 '+r.chapters.length);   // 아이 메뉴는 12편
  r.chapters.forEach(function(c){
    if(!c.paras.length) e.push(c.no+'편 비어 있음');
    if(c.chars<150) e.push(c.no+'편 너무 짧음('+c.chars+'자)');

  });
  return e;
}

function seasons(p){
  var gy=X.gyeok(p), fl=X.flow(p), by=p.birth_year, top=(p.now-by+1<55)?64:69, out=[];
  p.daeun.seq.forEach(function(s){
    var ys=[]; for(var y=s.start_year;y<s.start_year+10;y++){ var a=y-by+1; if(a>=20&&a<=top) ys.push(y); }
    if(ys.length<3) return;
    var v=ys.map(function(y){ return X.yearScore(p,y,gy,fl)[0]+X.ageW(y-by+1); }), bi=0;
    for(var i=1;i<v.length;i++) if(v[i]>v[bi]) bi=i;
    out.push({y1:ys[0],y2:ys[ys.length-1],a1:ys[0]-by+1,a2:ys[ys.length-1]-by+1,avg:v.reduce(function(a,b){return a+b;},0)/v.length,peak:ys[bi],
      label:SEASON[X.GROUP[X.ten(s.stem,p.me)]]});
  });
  return out;
}

    {t:'sting',s:mo>=2?'엄마 말, 아직도 마음에 걸려 있죠? 그거 예민한 거 아니에요.':fa>=2?'아빠한테 인정받고 싶었던 마음, 아직 남아 있죠?':'가족한테 기대는 게 서툴죠? 혼자 크느라 그래요.'},

    {t:'p',s:fa===0?'아빠 자리는 비어 있어요. 멀게 느껴졌거나, 바빴거나. 그래서 돈 감각을 혼자 익혔을 거예요.':fa>=2?'아빠 자리가 커요. 영향을 많이 받았어요. 좋은 건 가져가고, 무거운 건 내려놓으세요.':'아빠는 적당한 거리에 있던 사람이에요. 필요할 때 손 내밀면 받아 줘요.'},

  // 10 지나온 길

  var r10=[{t:'p',s:'지나온 것 몇 개 짚어 볼게요. 맞으면 끄덕이고, 아니면 넘기세요. 당신 삶은 당신이 제일 잘 알아요.'}];
  if(prevS) r10.push({t:'p',s:'<b>'+prevS.a1+'~'+prevS.a2+'세는 '+prevS.label+'이었어요.</b> 그때 내 뜻보다 남의 뜻이나 상황에 맞춰 정한 게 하나쯤 있지 않나요? 있었다면 그게 지금 버릇의 시작이에요. 당신 탓 아니에요. 그땐 그게 맞는 길이었어요.'});
  if(curS) r10.push({t:'p',s:'<b>'+curS.y1+'년부터 판이 바뀌었어요.</b> 지금 시즌은 '+curS.label+'이에요. 그 무렵부터 일이나 마음의 방향이 달라졌다고 느끼지 않았나요?'});
  if(pastTop) r10.push({t:'p',s:'<b>'+pastTop.yy+'년쯤, '+pastTop.age+'세 무렵</b>에 일에서 「아, 이게 내 일이다」 싶은 순간이 없었나요? 칭찬을 받았든 큰일을 맡았든. 기운이 제일 받쳐 준 해였거든요.'});
  r10.push({t:'p',s:'이건 맞히기 놀이가 아니에요. 기운이 어떤 해에 어떻게 움직였는지 알면, 비슷한 해가 올 때 미리 채비할 수 있어서 짚는 거예요.'});
  A('10','지나온 길, 맞나 틀리나 봐 보세요','맞으면 끄덕이고, 아니면 넘기세요',r10);

  // 11 해마다
  A('11','앞으로 해마다','해마다 이름 하나, 마음가짐 한 줄',[
    {t:'p',s:'해마다 이름은 하나예요. 일·돈·짝 장에서 한 말도 다 이 이름 안에 들어 있어요.'},
    {t:'yr',rows:T.map(function(r){ return {k:String(r.yy),nm:r.name+'.',s:'일 · '+r.wv[0]+' / 돈 · '+r.mv[0]+' / 사람 · '+r.lv,mind:'마음가짐 · '+MIND[r.name]}; })}]);

  // 12 무너질 때
  A('12','무너질 것 같을 때','무너지기 전 신호, 다시 서는 법',[
    {t:'sting',s:'혼자 다 끌어안고 버티는 거, 멋있는 거 아니에요. 그냥 아픈 거예요.'},
    {t:'p',s:'당신은 '+M.fall+' 그게 신호예요. 06에서 말한 마음이 늘어날 때랑 같은 신호예요.'},
    {t:'p',s:'그때는 이 순서로 하세요. '+M.fallDo},
    {t:'p',s:'이런 버릇이 있다는 건 정해진 운명이 아니라, 알고 다스리라고 있는 거예요. 버릇은 알면 반은 고친 거고요.'+(T.filter(function(r){return r.w==='clash'||r.l==='clash';})[0]?' '+T.filter(function(r){return r.w==='clash'||r.l==='clash';})[0].yy+'년엔 흔들림이 와요. 그해엔 큰 결정은 미루고, 가까운 사람과 먼저 말을 맞추세요.':'')},
    {t:'p',s:'막다른 데까지 안 가도 돼요. 신호가 왔을 때 멈추면, 당신은 다시 서요.'}]);

  // 13 마무리
  var ans=(ch[1].paras.filter(function(x){return x.t==='p'&&x.s.indexOf('<b>')>=0;})[0]||{s:''}).s;
  var first=jl[0]?jl[0].name:'배울 것';
  A('13','당신 팔자의 주인은 당신이에요','처음 물은 것의 답, 할 일 셋, 연표 한 장',[
    {t:'p',s:'당신이 물은 것, '+askLabel+'. 마지막으로 한 번 더 말할게요. '+ans},
    {t:'h3',s:'할 일 셋'},
    {t:'p',s:'하나, 答의 이번 주 숙제부터 하세요.<br>둘, 06에서 말한 신호가 오면 30초 멈추세요.<br>셋, 02의 다리 셋 중 하나('+first+')를 골라 올해 첫걸음을 떼세요.'},
    {t:'h3',s:'당신 연표 한 장'},
    {t:'table',head:['해','이름','일','돈','사람','마음가짐'],rows:T.map(function(r){ return [String(r.yy),r.name,r.wv[0],r.mv[0],r.lv,MIND[r.name]]; })},
    {t:'sting',s:'마지막으로 언니가 한마디 할게요. 운은 바람이고, 그 바람 속에서 어디로 갈지는 당신이 정해요.'},
    {t:'p',s:'제 말 중에 당신 삶이랑 안 맞는 건 버리세요. 당신 삶은 당신이 제일 잘 알아요. 좋은 소식 생기면 또 오세요. 그땐 제가 축하해 드릴게요.'}]);

  return {chapters:ch,pillars:GJ.fmtPillars(p.P,inp.tu),me:me[0],age:age};
}
return {read:read};
})();

<script>
(function(){
"use strict";
var $=function(s){ return document.querySelector(s); }, NOW=new Date(), NOWY=NOW.getFullYear();
var OPT={sex:[['f','여자'],['m','남자']],love:[['single','혼자예요'],['dating','연애 중'],['married','결혼했어요'],['reunion','헤어진 사람 있어요']],
 worry:[['move','회사를 옮길까'],['switch','직업을 바꿀까'],['biz','사업을 해 볼까'],['close','하던 걸 접을까'],['meet','새 인연은 언제'],['marry','결혼은 언제'],['reunion','헤어진 사람 다시 만날까'],['love','부부 사이'],['buy','집이든 큰 거든 살까'],['rest','좀 쉴까']],
 cal:[['solar','양력'],['lunar','음력']],
 jk:[['employee','회사 다녀요'],['public','공무원·교사'],['self','장사·사업'],['freelance','프리랜서'],['jobseeker','일 찾는 중'],['homemaker','살림'],['rest','쉬는 중'],['retired','은퇴']]};
document.querySelectorAll('.seg').forEach(function(box){ var n=box.dataset.name;
  box.innerHTML=OPT[n].map(function(o){ return '<label><input type="radio" name="'+n+'" value="'+o[0]+'"><span>'+o[1]+'</span></label>'; }).join(''); });
document.querySelector('input[name=cal][value=solar]').checked=true;
var SIJI=['자','축','축','인','인','묘','묘','진','진','사','사','오','오','미','미','신','신','유','유','술','술','해','해','자'];
var hs='<option value="">시 고르기</option>'; for(var i=0;i<24;i++) hs+='<option value="'+i+'">'+String(i).padStart(2,'0')+'시대 · '+SIJI[i]+'시</option>'; $('#h').innerHTML=hs;
var val=function(n){ var r=document.querySelector('input[name='+n+']:checked'); return r?r.value:null; };
function loveOpts(){ var lv=val('love'); document.querySelectorAll('input[name=worry]').forEach(function(i){
  var hide=lv==='married'?['meet','marry','reunion'].indexOf(i.value)>=0:(i.value==='love'||(lv==='dating'&&['meet','reunion'].indexOf(i.value)>=0));
  i.parentNode.hidden=hide; if(hide&&i.checked) i.checked=false; }); }
function solar(){
  var y=+$('#y').value, m=+$('#m').value, d=+$('#d').value;
  if(val('cal')==='lunar'&&y&&m&&d){ var s=M2.lunarToSolar(y,m,d,$('#leap').checked); if(Array.isArray(s)) return {y:s[0],m:s[1],d:s[2],raw:[y,m,d],lunar:true}; return {err:(s&&s.error?s.error+'. ':'그런 음력 날짜는 없어요. ')+'윤달 표시를 확인해 주세요.',raw:[y,m,d]}; }
  return {y:y,m:m,d:d,raw:[y,m,d]};
}
function note(){ var f=solar(); $('#lunarNote').innerHTML=f.lunar?'음력 '+f.raw.join('.')+' → 양력 <b>'+f.y+'.'+f.m+'.'+f.d+'</b>':''; }
document.addEventListener('change',function(e){
  var fs=e.target.closest('fieldset,.fld'); if(fs) fs.classList.remove('bad');
  if(e.target.name==='love') loveOpts();
  if(e.target.name==='cal'){ $('#leapwrap').hidden=e.target.value!=='lunar'; note(); }
  if(e.target.id==='unk') $('#h').disabled=e.target.checked;
  if(e.target.id==='leap') note();
});
document.addEventListener('input',function(e){ if(['y','m','d'].indexOf(e.target.id)>=0){ e.target.value=e.target.value.replace(/[^0-9]/g,''); note(); } });
function bad(id,msg){ document.querySelectorAll('.bad').forEach(function(b){ b.classList.remove('bad'); }); var b=$(id); b.classList.add('bad'); $('#err').textContent=msg; b.scrollIntoView({block:'center',behavior:'smooth'}); var f=b.querySelector('input,select'); if(f) f.focus({preventScroll:true}); }
var esc=function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
var rich=function(s){ return esc(s).replace(/&lt;(\/?)(b|br)&gt;/g,'<$1$2>'); };   // 엔진이 쓰는 <b>·<br>만 살린다
function para(x){
  if(x.t==='sting') return '<p class="sting">'+rich(x.s)+'</p>';
  if(x.t==='h3') return '<h3>'+rich(x.s)+'</h3>';
  if(x.t==='rank') return '<div class="rank">'+x.rows.map(function(r){ return '<div><span class="mk">'+r[0]+'</span><span><b>'+esc(r[1])+'.</b> '+rich(r[2])+'</span></div>'; }).join('')+'</div>';
  if(x.t==='yr') return '<div class="yr">'+x.rows.map(function(r){ return '<div class="y"><span class="yy">'+esc(r.k)+'</span><div class="yb"><span class="nm">'+rich(r.nm)+'</span> '+rich(r.s)+(r.mind?'<div class="mind">'+rich(r.mind)+'</div>':'')+'</div></div>'; }).join('')+'</div>';
  if(x.t==='bars') return '<div class="bars">'+x.rows.map(function(r){ return '<div class="bar'+(r.top?' top':'')+(r.now?' now':'')+'"><span class="lab"><b>'+esc(r.lab)+'</b><br>'+esc(r.sub)+'</span><div class="track"><div class="fill" style="width:'+r.w+'%"></div><span class="bl">'+(r.top?'★ 정점 · ':'')+esc(r.label)+'</span></div></div>'; }).join('')+'</div>';
  if(x.t==='table') return '<div class="tbl"><table><thead><tr>'+x.head.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr></thead><tbody>'+x.rows.map(function(r){ return '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>';
  return '<p>'+rich(x.s)+'</p>';
}
function render(r){

  h+='<nav class="toc" aria-label="목차">'+C.map(function(c){ return '<a href="#c'+c.no+'"><span class="n">'+c.no+'</span><span class="t">'+esc(c.title)+(c.free?'<span class="badge">무료</span>':'')+(c.sub?'<span class="d">'+esc(c.sub)+'</span>':'')+'</span></a>'; }).join('')+'</nav>';

    if(c.no==='01') h+='<div class="part">일 · 철학마녀 간판</div>';

  });

  $('#again').onclick=function(){ R.hidden=true; $('#formView').hidden=false; window.scrollTo(0,0); };
}
$('#go').onclick=function(){
  $('#err').textContent='';
  var f=solar(), unk=$('#unk').checked, hv=$('#h').value, sex=val('sex'), love=val('love'), worry=val('worry'), jk=val('jk');
  var man=f.y?NOWY-f.y-((NOW.getMonth()+1<f.m||(NOW.getMonth()+1===f.m&&NOW.getDate()<f.d))?1:0):0;

    [!(f.raw[0]>=1900&&f.raw[0]<=NOWY),'#f-date','태어난 해를 네 자리로 넣어 주세요. 예: 1995'],[!(f.raw[1]>=1&&f.raw[1]<=12),'#f-date','태어난 달은 1부터 12 사이로 넣어 주세요.'],
    [!(f.raw[2]>=1&&f.raw[2]<=31),'#f-date','태어난 날은 1부터 31 사이로 넣어 주세요.'],[!!f.err,'#f-date',f.err],
    [!f.lunar&&!f.err&&f.d>new Date(f.y,f.m,0).getDate(),'#f-date',f.y+'년 '+f.m+'월은 '+new Date(f.y,f.m,0).getDate()+'일까지예요.'],
    [man<19,'#f-date','철학마녀는 만 19세 이상만 볼 수 있어요.'],[!unk&&hv==='','#f-hour','태어난 시를 골라 주세요. 모르면 「몰라요」를 눌러 주세요.'],[!jk,'#f-jk','지금 일을 골라 주세요.']];
  var hit=C.filter(function(c){ return c[0]; })[0]; if(hit){ bad(hit[1],hit[2]); return; }

  catch(ex){ $('#err').textContent='계산이 안 맞아서 이 팔자는 내보내지 않을게요. 날짜를 다시 확인해 주세요.'; if(window.console) console.error(ex); }
};

})();
