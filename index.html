면 잘 풀리는지.","BRANCH_HEAD":"니 팔자 아랫줄 넉 자를 보자. 윗줄이 생각이면 아랫줄은 **살림**이다. 실제로 사는 모양이 여기 있다.","BRANCH_MIX":"니 아랫줄은 세 가지가 고르게 섞였다. 시작하는 기운 {a}, 한창인 기운 {b}, 마무리하는 기운 {c}. 한쪽으로 안 쏠렸단 소리다. 상황 따라 딴 사람이 되는 기라. 일관성 없다 소리 듣는 이유고, 어디 가도 적응하는 힘이기도 하다.","BRANCH_MOST":{"생지":{"scene":"니는 **밖으로 나가는 쪽**이다. 모임에 가도 바로 안 앉는다. 문 앞에서 한 바퀴 둘러보고 누가 있나 본 다음에 자리를 고른다. 분위기 별로면 커피 핑계 대고 슬쩍 빠진다.","why":"니 아랫줄 넉 자 중 {n}자가 계절이 막 바뀌는 때 글자거든. 초봄, 초여름 같은 때. 이런 글자는 마음이 늘 다음 계절에 먼저 가 있다.","so":"그래서 **시작이 좋고 끝이 아쉽다.** 말하고 행동이 어긋난다는 소리 듣는 거, 마음이 먼저 앞질러 갔다 돌아와서 그렇다.","term":"한마디로 계속 움직여야 사는 사람이다."},"왕지":{"scene":"니는 **안 변하는 쪽**이다. 남이 뭐라 캐도 생각이 잘 안 바뀐다. 겉과 속이 같아서 숨기는 게 없다. 좋게 말하면 안 휘둘리고, 나쁘게 말하면 고집이다.","why":"니 아랫줄 넉 자 중 {n}자가 계절이 한창일 때 글자거든. 한여름, 한겨울 같은 때. 딴 게 안 섞인 순한 기운이다.","so":"그래서 **잘 안 바뀐다.** 좋을 땐 버티는 힘이고, 나쁠 땐 눌러앉는 힘이다.","term":"한마디로 사람 눈에 잘 띄는 사람이다."},"고지":{"scene":"니는 **되돌아보는 쪽**이다. 지난 일을 오래 붙잡는다. 큰일엔 통이 큰데 작은 일에 목숨 건다. 몇십만 원은 시원하게 긁으면서 배달비 삼천 원엔 앱 세 개를 비교하는 사람, 그게 니다.","why":"니 아랫줄 넉 자 중 {n}자가 계절이 끝나는 때 글자거든. 늦봄, 늦가을 같은 때. 지난 계절을 창고에 쟁여 두는 기운이다.","so":"그래서 **지난 걸 오래 붙잡고, 대신 마무리는 확실하다.** 옛날이 좋았다는 말, 니 입에서 자주 나올 기라.","term":"한마디로 혼자 파고들고 되새기는 사람이다."}},"BRANCH_OFF":"근데 이 성질은 **속에만 있다.** 남들 눈엔 잘 안 보이고 니 혼자 속으로 그렇다.","BRANCH_ON":"이 성질은 **밖으로 훤히 드러나 있다.** 남들도 니를 그래 본다.","BREAK_BLOCK":"막는 법은 이거다. {block}","BREAK_CUR":"지금 10년은 니 {gung_mean} 쪽하고 사이가 나쁘다. {kind_mean} 이건 **10년짜리다.** 이번 시즌 내내 그쪽이 흔들린다.","BREAK_CUR2":"그라고 지금 10년({y1}년부터 {y2}년까지)은 니 {seat} 쪽을 계속 흔든다. {kind_mean} 이번 10년 내내 {seat} 쪽은 크게 벌이지 말고 지켜라.","BREAK_INTRO":"잘되다가 무너지는 데는 이유가 있다. 니 팔자 안에 **서로 사이 나쁜 짝**이 있거든. 어려운 말 할 거 없다. 어디가 우째 흔들리는지만 보면 된다.","BREAK_INTRO2":"잘되다가 무너지는 사람은 늘 같은 데서 무너진다. 니 팔자 안에서 서로 부딪치는 두 판을 보면 니 이야기가 보인다.","BREAK_JAHYUNG_NOTE":"(같은 기운이 둘이면 전부 이래 보는 건 이 집 방식이다. 딴 집은 넷만 친다. 밝혀 두고 간다.)","BREAK_NATAL":"니 팔자엔 {a_mean} 쪽하고 {b_mean} 쪽이 사이가 나쁘다. {kind_mean} 이건 운에서 온 게 아니라 **팔자에 박혀 있는 거라 평생 간다.** 그래서 늘 같은 데서 넘어지는 기라.","BREAK_NATAL_NONE":"니 팔자는 안에서 서로 싸우는 게 없다. 깔끔하단 소리다. 그라모 니가 무너지는 건 니 탓이 아니라 **그해 들어온 손님 때문이다.** 그건 지나간다.","BREAK_NONE2":"니 팔자는 안에서 서로 싸우는 판이 없다. 그라모 니는 언제 무너지노? **밖에서 들어온 기운이 니 일 자리나 짝 자리를 들이받을 때다.** 니 탓이 아니라 그해 운 탓이니, 그해만 조심하면 된다.","BREAK_NONE_ITEM":{"월":"{yy}년(일이 흔들리는 해)","일":"{yy}년(집과 짝이 흔들리는 해)"},"BREAK_NONE_NONE":"앞 10년 안엔 그런 해도 크게 안 보인다. 무너질 일은 니가 무리할 때뿐이다.","BREAK_NONE_WHEN":"앞으로 그런 해는 {items}이다. 그해엔 새로 벌이지 말고 지키는 쪽으로 가라.","BREAK_STORY":"**{title}.** {scene} {flavor} 이건 운에서 온 게 아니라 팔자에 박힌 거라, 사는 동안 몇 번이고 되풀이된다.","BREAK_SYMPTOM":"무너지기 전에 신호가 온다. 세 가지다. 하나, 몸이 먼저 흔들린다. 둘, 자주 쓰는 물건이 자꾸 고장 난다. 셋, 사람 만나기 싫고 집에만 있게 된다. **이 셋 중 둘이 겹치면 멈춰라.** 밀어붙일 때가 아이다.","BREAK_WHEN":"앞으로 이게 터지기 쉬운 해는 **{yrs}년**이다. 그해엔 큰 결정을 미루고 {block_short}","BREAK_WHEN_NONE":"앞 10년 안엔 이게 크게 터질 해가 안 보인다. 대신 버릇은 남아 있으니 평소에 막아라.","BREAK_YEAR":"올해 {yy}년도 니 {gung_mean} 쪽을 건드린다. {kind_mean} 이건 **1년짜리다.** 지나가긴 하는데 지나가는 동안은 확실히 탈이다.","BREAK_YEAR2":"올해 {yy}년도 니 {seat} 쪽을 건드린다. {kind_mean} 올해만 넘기면 된다.","CHEON_SHORT":{"비견":"니 길을 니가 정하는 고집","겁재":"악바리 승부욕","식신":"여유와 풍류","상관":"밀어붙이는 힘","편재":"큰 스케일","정재":"거북이 같은 꾸준함","편관":"센 데서 버티는 힘","정관":"바른 생활","편인":"창작하는 끼","정인":"공부 체질"},"CLOSE2":["이게 니다. 좋고 나쁜 거 없다. 쓰임이 있을 뿐이다. 어디 쓰이는 놈인지는 뒤에서 한다.","팔자가 좋다 나쁘다, 그런 건 바보들 얘기다. 니가 뭐 하는 놈이냐, 그게 전부다."],"CLOSE4":"10년 시즌은 니 거고 올해는 손님이다. 손님한테 안방 내주지 마라. 니 시즌대로 살아라.","CLOSE5":"앞일은 잘 안 맞는다. 니가 알았으니까. 알면 고민하고 고민하면 바꾼다. 그래서 {화자}는 앞일은 손님 순서까지만 말한다. 그 손님 우째 대접할지는 니 몫이다.","CLOSE6":["돈은 좇으면 도망가고 자리 잡으면 온다. 니 돈은 {path}에서 온다. 거기서 벌어라.","니 돈 그릇은 이만하다. 그릇보다 많이 담으면 넘친다. 넘친 건 남한테 간다."],"CLOSE7":"되는 데 가서 열심히 하고 안 되는 데 가서 대충 해라. 거꾸로 살면 넘어지고 또 넘어진다.","CLOSE8":["궁합은 글자가 아니라 자리다. 니 짝 자리에 앉을 수 있는 사람인지, 그것만 봐라.","니 옆에 누가 있다는 게 덕이다. 옆집 ⟪짝⟫하고 비교하는 사람은 덕이 없는 사람이다."],"CLOSE9":"바닥을 쳐야 올라간다. 막다른 데 가야 살길이 열리는 기라. 니가 지금 막다른 데 있으면, 거기가 열리는 자리다.","DECADE":{"재성":{"plain":"돈하고 일이 크게 움직이는 10년이다","life":"벌이가 늘든 판이 커지든, 들어오고 나가는 돈의 크기가 달라진다. 이사, 일 바꾸기, 사업 같은 큰 움직임도 이때 많다.","so":"그래서 움직이는 쪽이 맞다. 옮기든 차리든 넓히든 이 10년 안에 하는 게 좋다."},"식상":{"plain":"하고 싶은 걸 꺼내서 해 보는 10년이다","life":"새 일, 새 기술, 부업, 하고 싶은 말이 생긴다. 대신 윗사람이나 조직 규칙하고 자주 부딪친다.","so":"그래서 작게 시작해서 키우는 쪽이 맞다. 처음부터 크게 걸면 덜 익은 채로 내놓게 된다."},"관성":{"plain":"책임이 무거워지고 자리가 굳는 10년이다","life":"직장이면 맡는 일과 직급이 늘고, 장사면 세금, 직원, 허가 같은 책임이 는다. 바쁘고 눌리는데 이름은 선다.","so":"그래서 새로 벌이기보다 지금 자리를 키우는 쪽이 이득이다. 옮기더라도 하던 일로 더 나은 자리로 가라."},"인성":{"plain":"배우고 실력을 쌓는 10년이다","life":"공부, 자격, 집, 계약 같은 서류 일이 많고 도와주는 사람이 생긴다. 대신 몸이 무겁고 실행이 늦다.","so":"그래서 달리기보다 실력과 자격을 쌓는 쪽이 맞다. 집 같은 큰 걸 사기엔 좋은 10년이다."},"비겁":{"plain":"사람이 몰리고 경쟁이 붙는 10년이다","life":"친구, 동료, 동업 얘기가 많아지고 돈이 사람 따라 나간다. 혼자 하던 걸 같이 하게 된다.","so":"그래서 큰 결정보다 니 편을 만들고 실력을 다지는 쪽이 맞다. 동업하고 보증은 피해라."}},"DECADE_PAST":{"재성":"돈하고 일이 크게 움직인 10년","식상":"하고 싶은 걸 꺼내서 해 본 10년","관성":"책임이 무거워지고 자리가 굳은 10년","인성":"배우고 실력을 쌓은 10년","비겁":"사람이 몰리고 경쟁이 붙은 10년"},"DECADE_RX":["이번 10년엔 이래 살아라","{y1}년부터 {y2}년까지는 {plain}. {so}"],"EL_D":{"목":"나무다","화":"불이다","토":"흙이다","금":"쇠다","수":"물이다"},"EL_I":{"목":"나무가","화":"불이","토":"흙이","금":"쇠가","수":"물이"},"EL_N":{"목":"나무","화":"불","토":"흙","금":"쇠","수":"물"},"FILL":{"비겁":["니 편을 만들어라","니 편이 없으니 사람을 만들어 둬야 된다. 모임 하나, 믿을 친구 하나를 정해서 꾸준히 챙겨라. 일은 혼자 다 하지 말고 나눠 맡겨라."],"식상":["니 생각을 밖으로 꺼내라","표현할 길이 없으니 길을 만들어야 된다. 글이든 말이든 일주일에 한 번 니 생각을 밖으로 꺼내라. 일기든 블로그든 모임 발표든 다 된다."],"재성":["돈이 니 손을 덜 거치게 해라","돈 그릇이 없으니 장치를 만들어야 된다. 월급날 자동이체, 돈 관리 맡길 사람, 가계부 앱. 돈이 니 손을 덜 거칠수록 남는다."],"관성":["니 규칙을 니가 정해라","울타리가 없으니 규칙을 만들어야 된다. 일어나는 시간, 마감, 약속을 니가 정해서 남한테 알려 둬라. 지킬 수밖에 없게."],"인성":["물어볼 사람을 정해라","받쳐 줄 데가 없으니 배울 데를 정해야 된다. 선생 하나, 선배 하나를 정해 놓고 막힐 때 묻는 버릇을 들여라. 도와준다 카면 됐다 카지 말고 받아라."]},"FITJ_FIX_HEAD":"더 잘 되려면 이래 해라.","FITJ_HARD_HEAD":"어려웠던 게 있었다면 이래서다.","FITJ_HEAD":{"biz":"니 지금 {job} 한다 캤제. 장사는 니 이름 걸고 하는 사업이다. 사업운이 있나부터 보자.","free":"니 지금 {job} 한다 캤제. 프리랜서도 니 이름 걸고 하는 사업이다. 사업운이 있나부터 보자.","salary":"니 지금 {job} 일 한다 캤제. 회사 체질이 맞나부터 보자."},"FITJ_LUCK":{"biz":"운으로 보면 가까이는 **{yy}년**이 사업에 힘이 붙는 해다. 그해는 {name}다. 그때 크게 움직이고, 그 전까지는 위에 말한 걸 고쳐 둬라.","salary":"운으로 보면 가까이는 **{yy}년**이 회사에서 힘이 붙는 해다. 그해는 {name}다. 그때 손 들고, 그 전까지는 위에 말한 걸 고쳐 둬라."},"FITJ_LUCK_NONE":{"biz":"운으로 보면 앞 5년 안엔 크게 밀어주는 해가 안 보인다. 운 기다리지 말고 위에 말한 걸 고쳐서 버티는 힘을 키워라.","salary":"운으로 보면 앞 5년 안엔 크게 밀어주는 해가 안 보인다. 자리 지키면서 위에 말한 걸 고쳐 둬라."},"FITJ_MONEY":{"순환":" 돈 모양도 좋다. 니가 만든 걸 돈으로 바꾸는 길이 뚫려 있다.","만들되못담음":" 대신 재주는 있는데 돈 담는 그릇이 약하다.","담되안만듦":" 대신 돈 그릇은 있는데 니 걸 내놓고 알리는 힘이 약하다.","둘다없음":" 대신 팔자엔 만드는 힘도 돈 그릇도 약하다. 운에서 들어올 때 벌어 둬야 된다."},"FITJ_OTHER":{"seek":{"jeong":"지금 일 찾는 중이라 캤제. 니는 정해진 길에서 크는 사람이라 **조직이나 자격 쪽으로 찾는 게 맞다.** 들어갈 데를 먼저 정하고 거기 맞춰 준비해라.","pyeon":"지금 일 찾는 중이라 캤제. 니는 니 판에서 크는 사람이라 **회사만 찾지 말고 작게라도 니 일을 해 봐라.** 그게 오히려 길이 된다.","mix":"지금 일 찾는 중이라 캤제. 니는 어디 가도 되는 사람이다. **조건 좋은 데 먼저 들어가고, 니 일은 옆에서 키워라.**"},"young":{"jeong":"지금 공부하는 중이면, 니는 자격이나 시험으로 길을 여는 사람이다. **딸 수 있는 건 일찍 따 둬라.**","pyeon":"지금 공부하는 중이면, 니는 시험보다 해 본 걸로 길을 여는 사람이다. **알바든 프로젝트든 일찍 부딪쳐 봐라.**","mix":"지금 공부하는 중이면, 니는 둘 다 되는 사람이다. **자격 하나, 해 본 일 하나**를 같이 챙겨라."},"home":{"jeong":"지금 살림하는 중이면, 다시 나갈 때 니는 **정해진 시간에 하는 일**이 맞다. 시간제, 자격 쓰는 일.","pyeon":"지금 살림하는 중이면, 니는 **집에서 니 이름으로 하는 일**이 맞다. 손재주든 말재주든 작게 팔아 봐라.","mix":"지금 살림하는 중이면, **배운 걸로 작게 시작해서** 되는 쪽으로 키워라."},"retired":{"jeong":"은퇴했다 캤제. 니는 **해 온 일을 가르치거나 봐주는 자리**가 맞다. 소일이라도 정해진 날 나가는 게 좋다.","pyeon":"은퇴했다 캤제. 니는 **하고 싶던 걸 니 식으로 해 볼 때**다. 큰돈 걸지 말고 작게.","mix":"은퇴했다 캤제. **해 온 일 반, 하고 싶던 일 반**으로 지내라."}},"FITJ_R":{"bigeop":["니 같은 기운이 많아서 번 돈이 사람 따라 나갔다. 동업, 외상, 아는 사람이라고 깎아 준 거.","돈 받는 규칙을 정해라. 선금, 계약서, 아는 사람도 정가. 동업은 하지 마라."],"nojae":["일은 많이 했는데 돈이 안 남았다. 싸게 받고, 돈 관리를 안 해서다.","가격부터 올려라. 들어온 돈은 그날 바로 딴 통장으로 떼고, 장부는 남한테 맡겨라."],"nosik":["일감이든 손님이든 끊기면 버틸 게 없었다. 니 걸 먼저 내놓고 알리는 힘이 약해서다.","니가 한 일을 보여 줄 데를 만들어라. 포트폴리오든 후기든 SNS든, 한 달에 한 번은 꼭 올려라."],"jeong":["들쭉날쭉한 수입이 제일 힘들었을 기라. 니는 고정이 있어야 마음이 놓이는 사람이거든.","매달 고정으로 들어오는 판을 하나 만들어라. 정기 계약, 단골, 월 단위 일감 같은 거."],"gwan":["일을 다 떠안고 거절을 못 해서 몸이 먼저 지쳤다.","받을 일하고 거절할 일을 기준으로 갈라라. 단가 낮은 일부터 끊어라."],"in":["준비만 하다 시작이 늦었다. 완벽해야 내놓는 버릇 때문이다.","반만 돼도 내놔라. 내놓고 고치는 게 니한테는 더 빠르다."],"none":["판은 맞는데 아직 알려지지 않아서 그렇다.","니 이름이 알려질 데를 하나 정해서 꾸준히 써라."],"s_pyeon":["회사가 답답했을 기라. 시키는 대로만 하는 게 니 체질이 아니거든.","회사 안에서 니가 정할 수 있는 일을 맡아라. 새 일, 기획, 혼자 책임지는 일."],"s_gwan":["책임은 늘어나는데 인정은 늦게 왔을 기라.","니가 한 일은 니 입으로 말하고 기록으로 남겨라. 말 안 하면 모른다."],"s_sik":["윗사람하고 부딪쳤을 기라. 니 생각이 분명해서 그렇다.","할 말은 하되 글로, 대안까지 붙여서 해라. 그라모 반발이 아니라 제안이 된다."],"s_bigeop":["동료하고 견주고 경쟁하느라 지쳤을 기라.","옆 사람 말고 작년의 니하고 견줘라. 니 편 하나는 꼭 만들어라."],"s_in":["기회가 왔는데 준비가 덜 됐다고 미뤘을 기라.","기회 오면 일단 손 들어라. 준비는 하면서 한다."],"s_nogwan":["어디에 속해 있어도 붕 뜬 느낌이었을 기라. 울타리 기운이 없어서 그렇다.","회사 말고 니 기준을 하나 세워라. 몇 년 안에 뭘 할지 적어 두면 덜 흔들린다."],"s_none":["크게 어긋난 건 없다. 운 따라 오르내린 거다.","좋은 해에 움직이고 나쁜 해엔 지켜라. 그것만 해도 남들보다 앞선다."]},"FITJ_SIDE":{"jeong":" 그라고 {job2}도 같이 한다 캤제. 니는 고정이 있어야 편한 사람이라, 본업은 지키고 그쪽은 정해진 시간에만 해라. 부업이 본업을 넘보면 둘 다 흔들린다.","pyeon":" 그라고 {job2}도 같이 한다 캤제. 니는 니 판 체질이라 그쪽이 니 진짜 길일 수 있다. 그쪽 벌이가 본업 반을 넘으면 그때가 옮겨 갈 때다.","mix":" 그라고 {job2}도 같이 한다 캤제. 둘 다 되는 사람이라 같이 가도 된다. 대신 시간하고 돈은 장부로 갈라 둬라."},"FITJ_VERDICT":{"biz":{"pyeon":"**니는 사업 체질이다.** 남 밑보다 니 판에서 크는 사람이라 지금 길이 맞다.","mix":"**니는 사업도 되고 조직도 되는 사람이다.** 지금 길이 틀린 건 아니다. 대신 혼자 다 하려 들면 지친다.","jeong":"**니는 원래 정해진 길에서 크는 사람이다.** 사업이 안 된다는 게 아니라, 판을 크게 벌이는 사업보다 고정 거래처, 단골, 정기 계약처럼 꼬박꼬박 들어오는 구조로 짜야 된다."},"salary":{"jeong":"**니는 회사 체질이다.** 조직 안에서 한 칸씩 올라가는 게 니 길이다.","mix":"**니는 회사도 되고 니 판도 되는 사람이다.** 지금은 회사에서 실력을 쌓고, 니 판은 옆에 작게 키워 둬라.","pyeon":"**니는 원래 니 판 체질이다.** 회사가 답답한 게 당연하다. 당장 나오란 소리는 아니고, 회사 다니면서 니 이름 걸 일을 옆에 하나 키워 둬라."}},"GENDER_WORD":{"f":{"⟪짝⟫":"남편","⟪관가족⟫":"남편"},"m":{"⟪짝⟫":"아내","⟪관가족⟫":"자식"}},"GIFT_ARRIVE":"그라고 **없는 {el} 기운이 운에서 오는 해**가 있다. {years}년이다. 없던 손님이 집에 오는 기라. 좋은 게 아니라 얼떨떨하다. 그해에 갑자기 {grp_mean} 일이 생기는데 니가 다룰 줄 모른다. 처방은 하나다. 그해엔 큰 결정 하지 마라. 적응만 해라.","GIFT_INTRO":"마지막이다. 없는 기운 얘기.","GIFT_INTRO2":"마지막이다. 니 팔자에 없는 거, 넘치는 거, 그라고 니한테 맞춘 처방.","GIFT_MISSING":"니 팔자엔 **{el}({elh}) 기운이 없다.** 니한텐 {grp_mean}이 없단 말이다. {life} 근데 이걸 흠으로 알지 마라. **팔자에 없는 건 복이다.** 없으니 안 잃고 안 매인다. 남들 그것 때문에 무너질 때 니는 안 무너진다.","GIFT_MISSING2":"니 팔자엔 **{elname} 기운이 없다.** 니한테 이건 {grp_mean}이 없다는 뜻이다. {life} 근데 없는 건 흠이 아니라 복이다. 없으니 그것 때문에 무너질 일도 없다.","GIFT_NOCHASE":"그라고 **없는 걸 좇지 마라.** 없는 걸 채우려 들면 있는 것까지 흔들린다. 있는 걸 키워라. 니 팔자에서 제일 많은 게 {most}({mosth}) {mn}자다. 그게 니 무기다. 없는 건 믿을 사람 하나하고 도구로 메워라. 동업 말고 맡기는 기라.","GIFT_NONE":"니 팔자엔 다섯 기운이 다 있다. 없는 게 없다. 그라모 처방은 반대다. **많은 게 또 오면 넘친다.** 니한테 제일 많은 {el}({elh})이 {n}개인데, 이게 운에서 또 오는 해가 {years}년이다. 그해엔 넘쳐서 딴 데까지 망가진다. 그해엔 덜어내라.","GIFT_NONE2":"니 팔자엔 다섯 기운이 다 있다. 없는 게 없으니 집착도 없다. 대신 조심할 건 넘치는 쪽이다. 니한테 제일 많은 건 {elname}, {n}개다.","GRP_LIFE":{"비겁":"그래서 니는 혼자 다 하려 들고, 친구가 적고, 시키는 걸 못 한다.","식상":"그래서 니는 만드는 것보다 말이 앞서고 표현에 목마르다.","재성":"그래서 니는 돈에 집착하고 돈 얘기에 예민하다.","관성":"그래서 니는 소속에 집착하고, 막상 들어가면 답답해한다.","인성":"그래서 니는 배움에 집착하고 받는 걸 못 한다."},"GRP_MEAN":{"비겁":"내 편이나 경쟁자","식상":"만들어 내놓는 힘","재성":"돈 굴리는 기운","관성":"자리나 울타리","인성":"받침이나 배움"},"HIDDEN_ITEM":"{yy}년엔 속에 숨은 {plain}이 나온다. {mean}.","HIDDEN_MEAN":{"비견":"고집이 세지고 혼자 하려 든다. 옆 사람하고 기 싸움 붙기 쉽다","겁재":"경쟁심이 올라온다. 돈을 나눠 쓰거나 빌려 달라는 사람이 생긴다","식신":"먹고 쉬고 놀고 싶어진다. 집에 사람이 모이고 손으로 뭘 만든다","상관":"참던 말이 터진다. 옆 사람한테 한마디 하고 싶어지는 해다. 말 한 번 삼켜라","편재":"큰돈이 눈에 들어온다. 판 벌이고 싶어지고 씀씀이가 커진다","정재":"살림하고 저축을 챙기게 된다. 집안 돈 계산이 꼼꼼해진다","편관":"압박이 들어온다. 옆 사람이나 일 때문에 몰리는 느낌이 든다","정관":"체면하고 자리를 챙기게 된다. 결혼이나 약속 같은 정식 얘기가 나오기 쉽다","편인":"혼자 있고 싶어진다. 생각이 많아지고 엉뚱한 공부에 빠진다","정인":"기대고 싶어진다. 누가 챙겨 주거나 집안 어른 도움이 들어온다"},"HIDDEN_NOTE":"니 짝 자리 속엔 겉으로 안 보이는 기운이 {k}개 숨어 있다. 평소엔 조용하다가 **그 기운이 들어오는 해에 밖으로 튀어나온다.** 니 속마음으로 나오기도 하고 옆 사람 얼굴로 나오기도 한다.","HIDDEN_YEAR":"앞으로 10년 중엔 이렇다. {items}","ILJI_GENDER":{"상관":{"f":"니 남편 쪽이 시끄럽다는 소리다.","m":"자식 얘기가 같이 걸린다."},"편재":{"f":"니 옆자리에 돈이 앉아 있다.","m":"니 아내가 그런 사람이다."},"정재":{"f":"니 옆자리가 살림 자리다.","m":"니 아내가 그런 사람이다."},"편관":{"f":"니 남편이 그런 사람이다.","m":"니 옆자리가 무겁다."},"정관":{"f":"니 남편이 그런 사람이다.","m":"니 옆자리가 반듯하다."}},"ILJI_STATUS":{"single":"니가 끌리는 사람이 대개 이쪽이다.","dating":"지금 만나는 그 사람이 이쪽이면 제자리에 앉은 기라.","reunion":"헤어진 그 사람이 이쪽이었으면, 못 잊는 게 그래서다.","divorced":"갈라선 그 사람이 이쪽이었을 기라. 다음 사람 볼 때도 이 자리부터 봐라.","unknown":"니 옆자리에 앉을 사람이 이쪽이다."},"ILJI_TEN":{"비견":"니 짝 자리엔 **친구 같은 사람**이 앉아 있다. 대등하고 어깨 견주고, 그래서 자주 부딪친다. 니를 떠받드는 사람은 니 짝이 아니다.","겁재":"니 짝 자리엔 **니 안의 또 다른 니 같은 사람**이 앉아 있다. 겉과 속이 다르고 니 걸 나눠 가진다. 돈 얘기가 자꾸 나오는 사이다.","식신":"니 짝 자리엔 **먹이고 챙기는 사람**이 앉아 있다. 편하고 넉넉하다. 대신 살 붙고 늘어진다. 편한 게 다는 아이다.","상관":"니 짝 자리엔 **말 많고 재주 많은 사람**이 앉아 있다. 재밌는데 니 자리를 흔든다.","편재":"니 짝 자리엔 **판 벌이는 사람**이 앉아 있다. 통 크고 잘 돌아다닌다. 짝이 돈 얘기를 몰고 온다.","정재":"니 짝 자리엔 **꼬박꼬박 챙기는 사람**이 앉아 있다. 성실하고 안정적이다. 답답해도 든든하다.","편관":"니 짝 자리엔 **센 사람**이 앉아 있다. 니를 누르고 밀어붙인다. 대신 이 사람 옆에서 니가 세진다.","정관":"니 짝 자리엔 **울타리 같은 사람**이 앉아 있다. 반듯하고 소속감 주는데, 니 맘대로는 못 한다. 답답한 게 아니라 잡아 주는 기라.","편인":"니 짝 자리엔 **엉뚱한 사람**이 앉아 있다. 특이하고 혼자 파고드는 사람. 니를 이해 못 하는 게 아니라 다르게 이해하는 기라. 끈기는 딸린다.","정인":"니 짝 자리엔 **엄마 같은 사람**이 앉아 있다. 받쳐 주고 챙겨 주고. 편한데 니가 어리광 부리게 된다. 받는 걸 당연하게 알면 잃는다."},"INDEOK":{"gwan_no_in":"인복 얘기 하나 하자. 니는 자리 기운은 있는데 받쳐 주는 기운이 없다. 그래서 조직에서도, ⟪관가족⟫한테서도 **받는 게 없다고 느낀다.** 맞제? 근데 돈 기운까지 있으면 니는 받는 사람이 아니라 주는 사람이다. 니 자리를 니가 먹여 살리는 기라. 그게 덕이다.","in_yes":"인복 얘기 하나 하자. 니는 받쳐 주는 기운이 있다. 엄마든 선배든 문서든, 누가 늘 밑에서 받쳐 준다. 근데 니는 그걸 당연하게 안다. 그래서 고마운 줄 모르고 **인복 없다고 징징댄다.** 받은 거부터 세어 봐라.","none":"인복 얘기 하나 하자. 인복 없다 카지 마라. 니 옆에 누가 있다는 게 덕이다. 덕은 받는 게 아니라 베푸는 기라. 맛집이 손님 찾아다니더나? 맛있으면 **알아서 줄 선다.**"},"JOB_AGE":{"old":"니 나이엔 새 이름 좇을 때가 아이다. 위 열둘 중에 **오래 이어져 온 이름**하고 지금 이름 쪽에서 골라라. 앞으로의 이름은 니 밑에 올 사람들 몫이다.","mid":"니 나이엔 **지금 이름** 쪽이 맞는다. 앞으로의 이름은 지금 일에 하나 얹는 식으로 가라. 갈아타는 게 아니라 얹는 기라.","young":"니 나이엔 지금 이름하고 앞으로의 이름을 같이 봐라. **아직 갈아타도 되는 나이다.**"},"JOB_AGE_SENIOR":"니 나이엔 새로 배워서 뛰어드는 것보다 **지금까지 한 일을 남한테 넘기는 자리**가 맞다. 가르치고, 봐주고, 관리하는 쪽. 위 이름들 중에 오래 이어져 온 쪽을 봐라.","JOB_CURRENT":"니 지금 {job} 한다 캤제.","JOB_G":{"식상":"뭘 만들어 내놓는 일이다. 니가 만든 게 남 손에 가야 밥이 된다. 시키는 것만 하는 자리에선 시든다.","재성":"굴리는 일이다. 사람, 돈, 물건을 돌려서 남기는 거. 정해진 월급만 받는 자리는 답답하다.","관성":"자리 지키는 일이다. 조직 안에서 책임지고 인정받는 거. 혼자 판 벌이면 무너진다.","인성":"배워서 넘기는 일이다. 문서, 자격, 가르치는 일. 몸 쓰는 일보다 머리 쓰는 일.","비겁":"사람하고 부대끼는 일이다. 팀, 현장, 동업. 혼자 방에서 하는 일은 금방 질린다."},"JOB_INTRO":"{화자}는 사주 볼 때 직업을 1번으로 친다. 팔자가 좋다 나쁘다는 의미 없다. 니가 뭐 하는 놈이냐, 그게 전부다. 니 간판은 **{plain} 기운**이다. {elname} 기운으로 먹고사는 사람이다.","JOB_LIST":"옛날 같으면 {trad}. 지금은 {now}. 앞으로는 {future}. 이래서 열둘이다.","JOB_NOW":"제일 중요한 건 이거다. **지금 하는 일하고 맞나.** 같은 운이 와도 하는 일 따라 좋고 나쁜 게 뒤집힌다. 니가 지금 {grp_plain} 쪽 일을 하고 있으면 운이 도와주고, 딴 일 하면서 이 생각만 하고 있으면 그게 병이다.","JOB_PICK":"이 중에 딱 하나만 짚으면 **{name}**이다. {one}. 안 해 봤으면 하고 싶어서 근질근질했을 거고, 해 봤으면 알 기라.","JOB_SANGGWAN":"말로 사람 움직이는 사람한테 하나 더. 남들이 잘 팔린다는 메뉴 말고 **니가 먹어도 맛있는 메뉴**를 팔아라. 니 재주는 니가 좋아하는 데서만 나온다.","KEEP":["니 무기를 써라","니 팔자에서 제일 센 건 {elname}이다. 없는 걸 채우려 애쓰는 것보다 이걸 쓰는 쪽이 백 배 낫다. 남들이 니한테 자꾸 맡기는 일, 그게 이 기운이 쓰이는 데다."],"KIND_FLAVOR":{"충":"이 둘은 한 번 터지면 크게 갈린다. 이사, 일 바뀜, 이별처럼 판이 통째로 바뀐다.","형":"이 둘은 잘하려고 밀어붙이다 탈이 난다. 되긴 되는데 몸이나 사람을 잃는다.","파해":"이 둘은 크게 안 터지고 속을 긁는다. 뒷말, 서운함이 쌓이다가 어느 날 한꺼번에 무너진다."},"KIND_MEAN":{"충":"**통째로 갈린다.** 이사, 일 바뀜, 이별, 갈라서는 일. 정면으로 들이받는 기운이라 자리가 바뀐다.","자형":"**제 힘에 제가 걸려 넘어진다.** 같은 기운이 둘이라 넘치는데, 넘친 게 밖이 아니라 니 발목으로 간다. 잘하려다 더 그르치는 그거다.","삼형":"**밀어붙여서 되긴 되는데 대가를 치른다.** 힘이 한쪽으로 몰려서 그렇다. 빡센데 결과는 나온다.","상형":"**예의 없는 일로 부딪친다.** 말 한마디, 태도 하나로 틀어진다. 일이 틀어지는 게 아니라 사람이 틀어지는 기라. 말조심이 약이다.","파":"**깨지진 않는데 금이 간다.** 뒷말, 질투, 재수 없는 일. 크게 안 터져서 넘기는데 은근히 오래 간다. 금 간 그릇 계속 쓰는 거랑 같다.","해":"**나는 안 맞는데 내 편이 맞는다.** 니가 손잡은 쪽을 옆에서 때린다. 직접 아픈 게 아니라 말도 못 하고, 그래서 더 거슬린다.","합":"**붙어서 안 떨어진다.** 묶이고 못 떠나는 대신 안정된다. 좋기만 한 건 아이다. 묶이면 못 움직인다."},"KIND_SHORT":{"충":"앞에서 말한 **통째로 갈리는** 그 일이다.","자형":"앞에서 말한 **제 발목 잡는** 그 버릇이다.","삼형":"앞에서 말한 **되긴 되는데 대가 치르는** 그 일이다.","상형":"앞에서 말한 **말 한마디로 틀어지는** 그 일이다.","파":"앞에서 말한 **금 간 그릇** 그 일이다.","해":"앞에서 말한 **내 편이 대신 맞는** 그 일이다.","합":"앞에서 말한 **붙어서 안 떨어지는** 그 일이다."},"LOVE_FIRST":{"reunion":"헤어졌는데 미련 남았다꼬? 그라모 이 편은 그 사람하고 다시 붙는 해가 있나다.","single":"혼자라꼬? 그라모 이 편은 어떤 사람이 올 건가다.","dating":"만나는 사람 있다꼬? 그라모 이 편은 그 사람이 니 짝 자리에 맞는 사람인가다.","married":"결혼했다꼬? 그라모 이 편은 옆에 있는 그 사람이 와 그런 사람인가다.","divorced":"갈라섰다꼬? 그라모 이 편은 와 그 사람이었고, 다음은 어떤 사람인가다.","unknown":"니 짝 얘기다."},"MARRIED_WORD":[["사람이 바뀌어도 그렇다.","몇 년을 같이 살아도 그렇다."]],"MISSING_G":{"비겁":"그라고 니 팔자엔 **니 편 들어줄 기운이 없다.** 그래서 니는 혼자 다 하려 든다. 시키는 걸 못 하고 맡기는 걸 못 한다. 없는 놈이 더 집착하는 법이다.","식상":"그라고 니 팔자엔 **만들어 내놓는 기운이 없다.** 근데 웃긴 게, 없으면 반대로 간다. 이런 사람이 말이 더 많다. 표현에 목말라서. 니 말 많은 거, 그거다.","재성":"그라고 니 팔자엔 **돈 기운이 없다.** 그래서 돈에 집착한다. 근데 이거 하나는 알아 둬라. 팔자에 없는 건 복이다. 없으니 잃을 것도 없다. 돈 얘기는 뒤에서 제대로 한다.","관성":"그라고 니 팔자엔 **니를 잡아 주는 울타리가 없다.** 그래서 소속에 집착한다. 어디 들어가고 싶고 인정받고 싶고. 근데 막상 들어가면 답답해서 못 견딘다. 혼자 일하는 사람이 명함 갖고 싶어 하는 거랑 같다.","인성":"그라고 니 팔자엔 **받쳐 주는 기운이 없다.** 그래서 배움에 집착한다. 자격증, 공부, 책. 근데 정작 받는 건 서툴다. 도와준다 캐도 됐다 카고 혼자 버틴다. 니가 피곤한 게 그래서다."},"MISSING_G_NONE":"그라고 다섯 기운이 다 있다. 없는 게 없으니 집착도 없다. 대신 딱 한 군데 미치지도 못한다. 뭘 해도 어중간하다는 소리 듣는 게 그래서다. 흠이 아니다. 고를 게 많은 기라.","MONEY_BIGEOP":"그라고 니 팔자엔 **니 같은 놈**이 {n}자다. 돈 고민이 평생 따라다니는 모양이다. 벌면 나눠지고 동업하면 샌다. 니 돈은 니 명의로, 니 통장에. 이거 하나만 지켜도 반은 막는다.","MONEY_CASE":{"순환":"니 팔자엔 **뭘 만드는 기운**이 {sik}자, **돈 기운**이 {jae}자, 둘 다 있다. 만들어서 담는 모양이다. 니가 만든 걸 돈으로 바꾸는 길이 뚫려 있단 말이다. 돈이 안 벌리면 만드는 걸 안 하고 있는 기라.","만들되못담음":"니 팔자엔 뭘 만드는 기운은 {sik}자인데 **돈 기운이 없다.** 만드는데 담을 그릇이 없는 기라. 재주는 많은데 돈이 안 남는 게 그래서다. 근데 잘 들어라. 팔자에 없는 건 복이다. 없으니 안 잃는다. 돈에 집착하면 그때 잃는다.","담되안만듦":"니 팔자엔 돈 기운은 {jae}자인데 **뭘 만드는 기운이 없다.** 그릇은 있는데 채울 게 없는 기라. 그래서 니 돈은 니가 만든 게 아니라 들어오는 돈이다. 월급, 가족, 아는 사람. 만들려고 애쓰지 마라. 니는 받아서 굴리는 사람이다.","둘다없음":"니 팔자엔 뭘 만드는 기운도 **돈 기운도 없다.** 그라모 돈이 없나? 아이다. 없는 건 복이다. 니는 돈 때문에 안 무너진다. 대신 니 돈은 손으로 오는 게 아니라 자리나 배움을 타고 온다. 돈 좇지 말고 자리를 잡아라."},"MONEY_FROM":{"월":"니 돈줄은 **일터**다. 월급이든 거래처든 손님이든, 일하는 데서 돈이 나온다. 일을 지키는 게 곧 돈을 지키는 기라.","일":"니 돈줄은 **니 살림과 짝**이다. 짝을 만나고 나서 돈이 붙거나, 둘이 같이 꾸리는 살림에서 돈이 모인다. 짝하고 사이가 좋을 때 돈도 좋다.","년":"니 돈줄은 **집안**이다. 부모나 집안에서 물려받거나 도움 받는 돈이 있다. 대신 그 돈은 집안 일에 다시 묶이기 쉽다.","시":"니 돈줄은 **늦게 열린다.** 젊을 때보다 마흔 넘어서, 말년으로 갈수록 돈이 붙는다. 자식이나 아랫사람 덕도 본다.","none":"니 팔자엔 돈 자리가 따로 없다. 그라모 니 돈은 어디서 오노? **니 재주나 니 자리를 타고 온다.** 돈을 좇으면 도망가고, 재주를 키우고 자리를 잡으면 따라온다."},"MONEY_FROM2":{"월":"일터","일":"살림과 짝","년":"집안","시":"말년"},"MONEY_FROM_MORE":" 그라고 {where} 쪽에서도 돈이 들어온다.","MONEY_KIND":{"편":"니 돈은 **통 큰 돈**이다. 월급으로는 성에 안 찬다. 만 원 아끼려고 걸어가면서 큰 계약엔 그 자리서 도장 찍는 사람. 크게 벌고 크게 쓴다. 남는 게 없으면 그래서다.","정":"니 돈은 **꼬박꼬박 버는 돈**이다. 월급, 자동이체. 한탕은 니 체질 아이다. 지루하게 쌓는 게 니 돈 버는 법이다. 남 대박 얘기에 흔들리면 잃는다.","혼":"니 돈은 통 큰 돈도 있고 꼬박꼬박 버는 돈도 있다. 꼬박꼬박도 하고 판도 벌인다. 둘 다 하니 바쁜데, 하나로 못 정해서 **둘 다 어중간할 때가 있다.**"},"MONEY_OUT":{"년":"새는 구멍은 형제와 집안이다. 집안에 일 생기면 니 돈이 먼저 나간다. 집안 돈하고 니 돈은 통장부터 갈라 둬라.","월":"새는 구멍은 동료와 동업자다. 같이 하자는 일, 같이 벌이자는 판에서 돈이 샌다. 일로 만난 사람하고 돈 섞지 마라.","일":"새는 구멍은 니 곁이다. 짝이나 제일 가까운 사람한테 쓰는 돈이 크다. 아까워하진 말되 한도는 정해 둬라.","시":"새는 구멍은 자식과 아랫사람이다. 챙겨 주는 돈이 생각보다 크다. 니 노후 몫은 먼저 떼고 챙겨라.","none":"크게 새는 구멍은 없다. 니가 판만 안 벌이면 돈은 모인다."},"MONEY_PATH":{"순환":"니가 만든 것","만들되못담음":"니 재주를 담아 줄 사람","담되안만듦":"남이 주는 것","둘다없음":"자리와 배움"},"MONEY_POS":{"stem_only":"돈 기운이 윗줄에만 있다. 윗줄은 생각이다. 돈 벌고 싶은 마음은 억수로 큰데 손에 쥔 건 적다. **생각이 앞서는 사람이다.**","branch_only":"돈 기운이 아랫줄에만 있다. 아랫줄은 살림이다. 돈 생각 안 해도 **돈이 붙어 있는 쪽**이다. 대신 굴릴 궁리를 안 한다.","both":"돈 기운이 윗줄에도 아랫줄에도 있다. 벌 궁리도 하고 실제로 쥔다. **판 벌여도 되는 사람이다.**"},"MONEY_PROXY":"돈 기운 없는 사람 처방은 하나다. **돈 관리할 사람을 옆에 둬라.** 없는 걸 니가 채우려 들면 부러진다. 돈 그릇 있는 사람 옆에 서라.","MONEY_STORY_HEAD":"니 돈 이야기를 하자. 돈도 자리가 있거든. 어느 자리에서 들어와서 어느 자리로 새는지 보면 니 돈 길이 보인다.","MONEY_TIMING":"집이든 큰 거든 사고팔 때는 이거 하나만 기억해라. **머리 맑은 해에 사고, 주머니 두둑한 해에 판다.** 머리 맑을 땐 잘 고르고, 주머니 두둑할 땐 아무거나 사거든. 뭘 벌이는 해에도 사지 마라. 똑같이 들뜬다. 니한텐 {buy}이 사는 해고 {sell}이 파는 해다.","MONEY_TIMING_NONE":"집이든 큰 거든 **머리 맑은 해에 사고, 주머니 두둑한 해에 판다.** 앞 6년 안엔 {what} 해가 없으니 그건 그때 다시 보자.","MOST":{"비겁":"니 팔자엔 **니랑 똑같은 놈**이 제일 많다({n}자). 한 반에 니랑 같은 과목 잘하는 애가 여럿인 기라. 남한테는 안 진다. 대신 평생 고민은 돈이다. 여럿이 나눠 먹으니까 벌어도 새고 벌어도 나눠진다.","식상":"니 팔자엔 **뭘 만들어 내놓는 기운**이 제일 많다({n}자). 가만있으면 좀이 쑤시는 사람이다. 말이든 손이든 뭘 내놔야 산다. 대신 평생 고민은 윗사람하고 조직이다. 니한텐 ⟪관가족⟫까지. 니가 내놓는 게 자꾸 그쪽 규칙하고 부딪친다.","재성":"니 팔자엔 **돈하고 사람 굴리는 기운**이 제일 많다({n}자). 어디 가도 이게 돈 되나부터 본다. 대신 평생 고민은 공부, 문서, 엄마 쪽이다. 굴리느라 배우는 걸 미루고, 그게 나중에 발목 잡는다.","관성":"니 팔자엔 **니를 누르는 기운**이 제일 많다({n}자). 어디 가도 결국 니한테 일이 맡겨진다. 대신 평생 고민은 니 자신이다. 남 기대에 맞추다 보니 정작 니가 뭘 원하는지를 모른다.","인성":"니 팔자엔 **받쳐 주는 기운**이 제일 많다({n}자). 책 사고 강의 듣는 게 편한 사람이다. 배우는 게 밥이다. 대신 평생 고민은 몸이 안 나가는 거다. 생각은 끝났는데 발이 안 떨어진다."},"NEW_ARRIVE":"하나 더. **{yy}년엔 니 팔자에 없던 {el} 기운이 온다.** 없던 손님이 오는 기라. 좋은 게 아니라 얼떨떨하다. 평생 운전 안 하던 사람한테 갑자기 차가 생긴 거랑 같다. 좋은데 무섭고 어디로 몰지 모른다. 적응할 시간을 줘라. 그해엔 큰 결정 하지 마라.","NEXT_G":{"재성":"**돈하고 일이 크게 움직이는 10년이다.** 벌이가 늘든 판이 커지든, 들어오고 나가는 돈의 크기가 달라진다. 이사, 일 바꾸기, 사업 같은 큰 움직임도 이때 많다. 그래서 움직이는 쪽이 맞다. 옮기든 차리든 넓히든 이 10년 안에 하는 게 좋다.","식상":"**하고 싶은 걸 꺼내서 해 보는 10년이다.** 새 일, 새 기술, 부업, 하고 싶은 말이 생긴다. 대신 윗사람이나 조직 규칙하고 자주 부딪친다. 그래서 작게 시작해서 키우는 쪽이 맞다. 처음부터 크게 걸면 덜 익은 채로 내놓게 된다.","관성":"**책임이 무거워지고 자리가 굳는 10년이다.** 직장이면 맡는 일과 직급이 늘고, 장사면 세금, 직원, 허가 같은 책임이 는다. 바쁘고 눌리는데 이름은 선다. 그래서 새로 벌이기보다 지금 자리를 키우는 쪽이 이득이다. 옮기더라도 하던 일로 더 나은 자리로 가라.","인성":"**배우고 실력을 쌓는 10년이다.** 공부, 자격, 집, 계약 같은 서류 일이 많고 도와주는 사람이 생긴다. 대신 몸이 무겁고 실행이 늦다. 그래서 달리기보다 실력과 자격을 쌓는 쪽이 맞다. 집 같은 큰 걸 사기엔 좋은 10년이다.","비겁":"**사람이 몰리고 경쟁이 붙는 10년이다.** 친구, 동료, 동업 얘기가 많아지고 돈이 사람 따라 나간다. 혼자 하던 걸 같이 하게 된다. 그래서 큰 결정보다 니 편을 만들고 실력을 다지는 쪽이 맞다. 동업하고 보증은 피해라."},"NEXT_INTRO":"다음 시즌은 **{ny}년**에 열린다. {narr}","NEXT_NONE":"니 시즌은 여기까지 보인다. 다음 시즌 얘기는 그때 다시 온나.","NOW_G":{"재성":"돈하고 일이 크게 움직이는 10년이다. 벌이가 늘든 판이 커지든, 들어오고 나가는 돈의 크기가 달라진다. 이사, 일 바꾸기, 사업 같은 큰 움직임도 이때 많다. 그래서 움직이는 쪽이 맞다. 옮기든 차리든 넓히든 이 10년 안에 하는 게 좋다.","식상":"하고 싶은 걸 꺼내서 해 보는 10년이다. 새 일, 새 기술, 부업, 하고 싶은 말이 생긴다. 대신 윗사람이나 조직 규칙하고 자주 부딪친다. 그래서 작게 시작해서 키우는 쪽이 맞다. 처음부터 크게 걸면 덜 익은 채로 내놓게 된다.","관성":"책임이 무거워지고 자리가 굳는 10년이다. 직장이면 맡는 일과 직급이 늘고, 장사면 세금, 직원, 허가 같은 책임이 는다. 바쁘고 눌리는데 이름은 선다. 그래서 새로 벌이기보다 지금 자리를 키우는 쪽이 이득이다. 옮기더라도 하던 일로 더 나은 자리로 가라.","인성":"배우고 실력을 쌓는 10년이다. 공부, 자격, 집, 계약 같은 서류 일이 많고 도와주는 사람이 생긴다. 대신 몸이 무겁고 실행이 늦다. 그래서 달리기보다 실력과 자격을 쌓는 쪽이 맞다. 집 같은 큰 걸 사기엔 좋은 10년이다.","비겁":"사람이 몰리고 경쟁이 붙는 10년이다. 친구, 동료, 동업 얘기가 많아지고 돈이 사람 따라 나간다. 혼자 하던 걸 같이 하게 된다. 그래서 큰 결정보다 니 편을 만들고 실력을 다지는 쪽이 맞다. 동업하고 보증은 피해라."},"NOW_GUNG":"그라고 이번 10년은 니 **{gung_mean}** 쪽을 건드린다. {kind_mean} 이 10년 동안 바뀌는 데가 여기다.","NOW_QUIET":"그라고 이 10년은 니 팔자를 크게 안 건드린다. 살던 대로 간다. 답답하면 니가 움직여야 된다.","OH_EXC":{"목":["나무가 많으면 자꾸 뻗으려고만 한다","일을 벌이고 넓히는데 마무리가 약하다","금","쇠는 가지를 쳐 준다. 벌인 것 중에 안 되는 걸 잘라 내는 힘이다"],"화":["불이 많으면 뜨겁게 타오른다","말하고 움직이는 속도가 앞서서 사람하고 부딪치고 몸이 먼저 지친다","수","물은 불을 식혀 준다. 한 박자 쉬고 생각하는 힘이다"],"토":["흙이 많으면 굳는다","자기 기준이 세지고 고집이 생기고, 새로 뭘 키우는 힘이 줄어든다","목","나무는 굳은 흙을 뚫어 준다. 새로 배우고 새 사람 만나는 힘이다"],"금":["쇠가 많으면 날카롭고 차갑다","맞다 틀리다를 따지느라 사람이 멀어진다","화","불은 쇠를 녹여 쓸모 있는 모양으로 만든다. 사람 앞에 서서 부딪쳐 보는 힘이다"],"수":["물이 많으면 넘치고 흩어진다","생각과 걱정이 많아 방향 없이 흘러간다","토","흙은 둑이 되어 물길을 잡아 준다. 마감, 규칙, 정해진 틀이다"]},"OH_EXC_HAS":" 니 팔자엔 그게 있어서 넘쳐도 선은 지킨다.","OH_EXC_NONE":" 근데 니 팔자엔 그게 없다. 그래서 한번 넘치면 브레이크가 없다. {ri} 들어오는 해에 균형이 잡힌다.","OH_EXC_TPL":"제일 많은 건 {named} {phys}. 사는 데서는 {life}. 이걸 잡아 주는 게 {rnamed} {rphys}.{has}","OH_FLOW_ALL":"그라고 니 팔자는 다섯 기운이 빙 돌아 이어진다. 시작에서 열매까지 막히는 데가 없다. 대신 어디 한 군데 크게 몰리지도 않아서, 니가 힘줄 데를 골라야 된다.","OH_FLOW_BROKEN":"그라고 기운이 이어지는 길을 보면 {links}이 끊겨 있다. 니가 자꾸 같은 데서 막히는 자리가 바로 거기다.","OH_HAS":{"봄":" 니 팔자엔 그 불이 있다. 벌인 게 꽃까지는 핀다.","여름":" 니 팔자엔 그 물이 있다. 달아올라도 한 번 식혀 갈 줄 안다.","가을":" 니 팔자엔 그 불이 있다. 단단한 니 기준이 쓸모 있는 실력으로 다듬어진다.","겨울":" 니 팔자엔 그 불이 있다. 얼어붙지 않고 움직일 힘이 있다."},"OH_HEAD":"니 기운이 우째 짜였는지 보자. 글자가 있냐 없냐보다, 니가 태어난 계절에 맞는지, 기운이 끊기지 않고 이어지는지가 더 중요하거든.","OH_LINK":{"0":"나무에서 불로 가는 길, 그러니까 하고 싶은 걸 밖으로 드러내는 길","1":"불에서 흙으로 가는 길, 드러낸 걸 쌓아서 신용이나 자리로 붙드는 길","2":"흙에서 쇠로 가는 길, 쌓은 걸 결과물로 딱 굳히는 길","3":"쇠에서 물로 가는 길, 거둔 걸 여유나 지혜로 돌리는 길","4":"물에서 나무로 가는 길, 생각을 새 시작으로 옮기는 길"},"OH_NEED":{"봄":"화","여름":"수","가을":"화","겨울":"화"},"OH_NONE":{"봄":" 근데 니 팔자엔 그 불이 없다. 시작은 많은데 꽃까지 못 가고 흐지부지되기 쉽다. 불 기운이 들어오는 해에 일이 피는 게 그래서다.","여름":" 근데 니 팔자엔 그 물이 없다. 한번 달아오르면 식힐 줄을 몰라 몸이 먼저 지친다. 물 기운이 들어오는 해에 숨이 트이는 게 그래서다.","가을":" 근데 니 팔자엔 그 불이 없다. 단단하긴 한데 쓰임을 못 찾고 고집으로 굳기 쉽다. 불 기운이 들어오는 해에 니가 빛을 보는 게 그래서다.","겨울":" 근데 니 팔자엔 그 불이 없다. 움츠러들고 시작이 늦다. 불 기운이 들어오는 해에 몸이 풀리고 일이 움직이는 게 그래서다."},"OH_SEASON":{"봄":"니는 봄에 태어났다. 봄은 나무 기운이 막 올라오는 때라, 햇볕 같은 불이 있어야 꽃이 피고 열매로 간다.","여름":"니는 여름에 태어났다. 여름 땅은 뜨겁고 메말라서, 물이 있어야 타지 않고 버틴다.","가을":"니는 가을에 태어났다. 가을은 쇠 기운이 단단해지는 때라, 불이 있어야 그 쇠를 다듬어 쓸모 있는 모양을 만든다.","겨울":"니는 겨울에 태어났다. 겨울 땅은 얼어 있어서, 불이 있어야 녹아서 뭘 키울 수 있다."},"ORDER":{"true":"니 10년 시즌은 **계절 순서대로** 간다. 순리대로 가는 사람이다. 무리하면 진다.","false":"니 10년 시즌은 **계절을 거꾸로** 간다. 도전하고 뒤집는 사람이다. 순리대로만 살면 답답해서 병난다. 거꾸로 가는 게 나쁜 거 아이다. 니 길이 그쪽인 기라."},"OVER":{"비겁":["사람을 가려라","니 같은 기운이 넘치니 같이 하자는 사람이 늘 붙는다. 같이 하자는 말은 반은 거절해라. 동업하고 보증은 아예 하지 마라."],"식상":["벌인 걸 줄여라","만들어 내놓는 기운이 넘치니 늘 일을 벌인다. 벌인 것 중 하나는 접어라. 하나를 끝까지 하는 게 열 개 벌이는 것보다 낫다."],"재성":["판은 한 번에 하나만 벌여라","돈 굴리는 기운이 넘치니 욕심이 앞선다. 한 판이 끝나기 전에 다음 판에 손대지 마라."],"관성":["책임 하나를 내려놔라","누르는 기운이 넘치니 늘 무거운 걸 지고 산다. 니가 안 해도 되는 일 하나를 남한테 넘겨라. 거절도 일이다."],"인성":["생각했으면 사흘 안에 시작해라","받쳐 주는 기운이 넘치니 생각만 하다 날 샌다. 정한 건 사흘 안에 손대라. 완벽하게 준비되는 날은 안 온다."]},"PAIR_STORY":{"월,일":{"title":"일하고 집이 서로 발목을 잡는다","scene":"일이 잘 풀리면 집이 비고, 집을 챙기면 일이 밀린다. 바쁠 때 짝이 서운해하고, 짝 챙기다 보면 일에서 기회를 놓친다. 둘 다 잘하려다 둘 다 지치는 게 니 모양이다.","block":"일하는 시간하고 집 시간을 달력에 갈라 놔라. 큰일 앞두고는 짝한테 먼저 말해 두고 시작해라."},"년,월":{"title":"집안 일이 니 일을 흔든다","scene":"니 일이 좀 풀릴 만하면 집안에 일이 터진다. 부모 일, 형제 일, 집안 돈 문제. 니가 나서서 수습하다 보면 니 일이 밀린다.","block":"집안 일은 니 혼자 다 떠안지 마라. 형제하고 나눠라. 돈은 니 몫하고 집안 몫을 통장부터 갈라 둬라."},"년,일":{"title":"집안하고 니 짝이 부딪친다","scene":"부모나 집안 어른하고 니 짝 사이에 니가 끼어 있다. 이쪽 편 들면 저쪽이 서운하고, 명절마다 속이 시끄럽다.","block":"집안 얘기는 니가 직접 전하지 말고 니 선에서 걸러라. 짝 편을 먼저 들어 주는 게 결국 집안도 지킨다."},"월,시":{"title":"일하고 자식이 서로 끌어당긴다","scene":"일에 몰두하면 자식이나 아랫사람 일이 터지고, 그쪽 챙기면 일이 밀린다. 니가 키운 사람이 니 일을 흔들기도 한다.","block":"아랫사람한테 맡길 거는 확실히 맡기고, 자식하고는 정해진 시간을 지켜라."},"일,시":{"title":"짝하고 자식 사이에서 니가 끼인다","scene":"짝하고 자식 사이가 니 손을 거쳐야 굴러간다. 자식 문제로 부부가 부딪치고, 니 노후 계획이 자식 일로 자꾸 바뀐다.","block":"자식 일은 짝하고 먼저 한목소리를 내라. 니 노후 몫은 따로 떼어 둬라."},"년,시":{"title":"윗대하고 아랫대 사이에 니가 낀다","scene":"부모도 챙겨야 하고 자식도 챙겨야 한다. 위아래로 돈이 나가고 니 몫이 안 남는다.","block":"위아래로 나가는 돈에 한도를 정해라. 니 몫을 먼저 떼고 남는 걸로 챙겨라."}},"PARENT_AMT":{"0":"부모한테 크게 받을 팔자는 아니다. 니 돈은 니가 만드는 쪽이다. 서운해할 거 없다. 받을 게 적은 만큼 짐도 적다.","1":"부모 덕은 **조금 있다.** 목돈이 필요할 때 보탬이 되는 정도다. 이사나 결혼 같은 큰일에 한 번 손 벌릴 데가 있다는 소리다.","2":"부모 덕이 **꽤 있다.** 전세금이나 집 마련처럼 큰돈에 실제로 보탬이 되는 정도다.","3":"부모 덕이 **큰 편이다.** 집이나 땅 같은 재산이 니 쪽으로 넘어올 수 있는 팔자다."},"PARENT_HEAD":"부모한테 받을 게 있나도 보자. 태어난 해하고 태어난 달 자리가 집안과 부모 자리다. 거기 돈 기운이나 받쳐 주는 기운이 앉아 있으면 받을 게 있는 기라.","PARENT_KIND":{"in":" 받는 모양은 현금보다 집이나 서류다. 명의, 증여, 보증 같은 걸로 온다.","jae":" 받는 모양은 현금이다. 사업 밑천이나 목돈으로 온다.","both":" 현금도 집이나 서류도 둘 다 올 수 있다."},"PARENT_SHARE":" 근데 그 자리에 형제 기운도 같이 앉아 있다. 형제하고 나눠 가질 몫이니 미리 말을 맞춰 둬라.","PARENT_WHEN":" 시기로 보면 {yrs}년에 부모 쪽 돈이나 문서가 움직이기 쉽다.","PARENT_WHEN_DW":" 시기로 보면 지금 10년({y1}년부터 {y2}년까지) 안에 그런 일이 생기기 쉽다.","PARENT_WHEN_NONE":" 앞 10년 안엔 크게 움직이는 해가 안 보인다. 받을 게 있어도 늦게 온다.","PAST_AGAIN_EV":{"good":"앞 10년에 잡은 게 이때 더 커졌을 기라. 자리든 돈이든 한 단계 올라섰다.","hard":"앞 10년 고생이 이때도 이어졌을 기라. 같은 데서 또 넘어지는 느낌이었제."},"PAST_CMP":{"better":"앞 10년보다 확실히 나았다.","worse":"앞 10년보다 버거웠다.","same":"앞 10년하고 비슷한 결로 갔다."},"PAST_EV":{"재성":{"good":"돈이 붙던 때다. 벌이가 늘었거나, 장사나 투자로 재미를 봤거나, 큰 걸 하나 장만했을 기라.","hard":"돈 때문에 애먹은 때다. 벌려고 판을 키웠다가 손해를 봤거나, 들어온 만큼 나갔을 기라. 아버지나 집안 돈 문제가 걸렸을 수도 있다."},"식상":{"good":"니 재주가 빛을 본 때다. 새 일을 시작했거나 니가 만든 게 인정받았을 기라. 자식이 생긴 때일 수도 있다.","hard":"참던 게 터진 때다. 윗사람하고 부딪쳐서 그만뒀거나, 벌인 일이 생각만큼 안 됐을 기라."},"관성":{"good":"자리가 생긴 때다. 소속이 생기거나 맡는 일이 커지거나, 결혼처럼 이름이 붙는 일이 있었을 기라.","hard":"눌리고 버틴 때다. 일이 버겁고 윗사람 등쌀에 시달렸거나, 몸이 고생했을 기라."},"인성":{"good":"배우고 도움 받은 때다. 자격을 땄거나, 집이나 계약 같은 서류가 들어왔거나, 끌어 주는 사람을 만났을 기라.","hard":"생각만 많고 몸이 안 나간 때다. 공부는 했는데 써먹을 데가 없었거나, 기회를 미루다 놓쳤을 기라."},"비겁":{"good":"사람 덕을 본 때다. 친구나 동료하고 같이 해서 일이 됐고, 니 편이 생겼을 기라.","hard":"사람 때문에 손해 본 때다. 동업이나 빌려준 돈이 탈 났거나, 형제나 친구하고 돈 문제로 틀어졌을 기라."}},"PAST_EV_OLD":{"관성":{"good":"책임 자리를 맡은 때다. 직함이 오르거나 맡는 일이 커졌을 기라.","hard":"눌리고 버틴 때다. 일이 버겁고 윗사람 등쌀에 시달렸거나, 몸이 고생했을 기라."},"식상":{"good":"니 손재주, 말재주가 다시 빛을 본 때다. 배운 걸 남한테 가르치거나 새 일을 벌였을 기라.","hard":"참던 게 터진 때다. 윗사람하고 부딪쳐서 그만뒀거나, 벌인 일이 생각만큼 안 됐을 기라."}},"PAST_EV_YOUNG":{"식상":{"good":"니 재주가 빛을 본 때다. 공부든 알바든 니가 해 놓은 게 인정받았을 기라.","hard":"하고 싶은 게 많아서 부딪친 때다. 학교나 첫 일터 규칙이 답답했을 기라."},"관성":{"good":"소속이 생긴 때다. 학교나 첫 직장에 자리를 잡았을 기라.","hard":"규칙하고 시험에 눌린 때다. 버티느라 욕봤을 기라."},"재성":{"good":"일찍 돈맛을 본 때다. 알바나 첫 벌이로 니 돈이 생겼을 기라.","hard":"돈 때문에 일찍 철든 때다. 집안 형편이나 첫 벌이 때문에 애먹었을 기라."}},"PAST_FIT":{"good":"그 기운이 니 힘하고 맞아서 애쓴 만큼 남았다.","hard":"근데 그 기운이 니한테 버거워서 애쓴 만큼 안 남았다.","lgood":"크게 튀진 않아도 니 편이 반은 됐다.","lhard":"니 편이 반도 안 돼서 애쓴 거에 비해 남는 게 적었다."},"PAST_FRAME":"**{y1}년부터 {y2}년까지** ({age1}세에서 {age2}세). {narr}","PAST_G":{"비겁":"니 같은 놈들 사이에서 부대낀 10년이다. 친구, 동료, 경쟁자. 사람은 많았는데 돈은 나눠졌제. 그때 고민은 돈이었을 기라. 맞제?","식상":"만들고 말하고 벌인 10년이다. 하고 싶은 게 많았고 실제로 벌였고, 윗사람하고 부딪쳤다. 그때 고민은 직장이나 ⟪관가족⟫이었다.","재성":"돈이 움직인 10년이다. 벌었든 잃었든 판이 컸다. 달리느라 바빴고, 그만큼 공부며 문서며 엄마 쪽은 뒷전이었제.","관성":"책임이 얹힌 10년이다. 자리가 생기고 이름이 생기고 그만큼 눌렸다. 그때 고민은 니 자신이었다. 내가 뭘 원하는지 모르겠는 거.","인성":"받고 배운 10년이다. 자격, 문서, 도와주는 사람. 대신 몸이 안 움직였다. 생각만 많고 손이 안 나갔제."},"PAST_GUNG":"그 10년엔 니 **{gung_mean}** 쪽이 흔들렸다.","PAST_G_AGAIN":{"비겁":"또 니 같은 놈들 시즌이다. 같은 모양이 20년 간 기라. 사람 속에서 부대끼고 돈은 나눠지고. 지겨웠으면 그래서다.","식상":"또 만들고 벌이는 시즌이다. 20년 내내 만들고 벌였단 말이다. 재주는 늘었는데 윗사람하고는 계속 부딪쳤제.","재성":"또 달리는 시즌이다. 20년을 달렸단 말이다. 돈은 움직였는데 공부며 엄마 쪽은 계속 뒷전이었제.","관성":"또 책임지는 시즌이다. 20년 내내 책임졌단 말이다. 자리는 굳었는데 니가 뭘 원하는지는 점점 흐려졌제.","인성":"또 배우는 시즌이다. 20년을 받고 배웠단 말이다. 머리는 찼는데 손이 안 나갔제. 움직일 때 놓친 느낌, 그거다."},"PAST_HEAD":"**{y1}년부터 {y2}년까지, {age1}세에서 {age2}세는 {verdict}.**","PAST_MIND":{"재성":" 속으로는 돈 생각이 꽉 차 있었다.","식상":" 속으로는 하고 싶은 게 많았다.","관성":" 속으로는 책임감에 눌려 있었다.","인성":" 속으로는 배우고 싶고 기대고 싶었다.","비겁":" 속으로는 남한테 지기 싫었다."},"PAST_MIX":" 근데 다 좋지는 않았다. ","PAST_QUIET":"그 10년은 니 팔자를 크게 안 건드렸다. 살던 대로 산 10년이다. 지루했으면 그래서다.","PAST_SAME":"앞 10년하고 같은 기운이 이어진 때다. ","PAST_SEAT":{"월":{"충":"그라고 그 10년 사이에 하던 일이 크게 바뀌었을 기라. 일자리를 옮기거나 그만두거나, 이사나 부모님 일 중에 하나는 있었다.","합":"그라고 그 10년엔 한 직장, 한 일에 오래 묶여 있었을 기라. 떠나고 싶어도 못 떠났제.","etc":"그라고 그 10년엔 일하는 데서 자잘한 말썽이 끊이지 않았을 기라."},"일":{"충":"그라고 그 10년 사이에 연애나 결혼에 큰 변화가 있었거나, 이사, 몸 고생이 있었을 기라.","합":"그라고 그 10년엔 짝이 생기거나 결혼처럼 사람하고 묶이는 일이 있었을 기라.","etc":"그라고 그 10년엔 옆 사람하고 자잘하게 부딪치는 일이 잦았을 기라."},"년":{"충":"그라고 집안 어른 쪽에 일이 있었거나 고향을 떠났을 기라.","합":"그라고 집안 도움을 받은 일이 있었을 기라.","etc":"그라고 집안에 말이 많았을 기라."},"시":{"충":"그라고 자식이나 아랫사람 일로 속 썩은 일이 있었을 기라.","합":"그라고 자식이 생기거나 아랫사람 덕을 본 일이 있었을 기라.","etc":"그라고 자식이나 아랫사람 일로 신경 쓸 일이 잦았을 기라."}},"PAST_SEAT_M":{"월":{"충":"그라고 그 10년 사이에 하던 일이 크게 바뀌었을 기라. 일자리를 옮기거나 그만두거나, 이사나 부모님 일 중에 하나는 있었다.","합":"그라고 그 10년엔 한 직장, 한 일에 오래 묶여 있었을 기라. 떠나고 싶어도 못 떠났제.","etc":"그라고 그 10년엔 일하는 데서 자잘한 말썽이 끊이지 않았을 기라."},"일":{"충":"그라고 그 10년 사이에 결혼이나 부부 사이에 큰 변화가 있었거나, 이사, 몸 고생이 있었을 기라.","합":"그라고 그 10년엔 결혼처럼 짝하고 단단히 묶이는 일이 있었을 기라.","etc":"그라고 그 10년엔 옆 사람하고 자잘하게 부딪치는 일이 잦았을 기라."},"년":{"충":"그라고 집안 어른 쪽에 일이 있었거나 고향을 떠났을 기라.","합":"그라고 집안 도움을 받은 일이 있었을 기라.","etc":"그라고 집안에 말이 많았을 기라."},"시":{"충":"그라고 자식이나 아랫사람 일로 속 썩은 일이 있었을 기라.","합":"그라고 자식이 생기거나 아랫사람 덕을 본 일이 있었을 기라.","etc":"그라고 자식이나 아랫사람 일로 신경 쓸 일이 잦았을 기라."}},"PAST_VERDICT":{"good":"잘 풀린 10년이다","hard":"힘들었던 10년이다","mixed":"좋은 것도 힘든 것도 섞인 10년이다","lgood":"고생은 해도 결과는 괜찮았던 10년이다","lhard":"마음은 앞섰는데 결과가 안 따라온 10년이다"},"PAST_WHY":{"good":"그 10년 기운이 니 타고난 힘하고 맞았거든. 힘을 쓰는 만큼 결과가 나왔다.","hard":"그 10년 기운이 니한테 버거웠거든. 애쓴 만큼 안 나오고 몸하고 마음이 먼저 지쳤다.","mixed":"그 10년 기운이 반은 니 편이고 반은 아니었거든. 되는 일은 되고, 막히는 일은 끝까지 막혔다.","lgood":"그 10년 기운이 실제 살림 쪽으로는 니 편이었는데 마음 쪽으로는 버거웠거든. 고생은 해도 손에 남는 게 있었다.","lhard":"그 10년 기운이 마음은 들뜨게 했는데 실제 살림 쪽으로는 니 편이 아니었거든. 하고 싶은 건 많았는데 손에 남는 게 적었다."},"PAST_WHY2":"그 10년은 {dp}이었거든. {fit}","PAST_WHY3":"그 10년은 겉으로는 {dp}이었거든.{mind}","PAST_YEARS":"특히 {items}. 맞제?","PAST_YEAR_EV":{"work_peak":"{yy}년 무렵엔 일이 크게 한 번 섰을 기라","work_clash":"{yy}년 무렵엔 하던 일이 크게 흔들렸을 기라","love_bind":"{yy}년 무렵엔 사람하고 묶이는 일, 연애나 결혼이 있었을 기라","love_clash":"{yy}년 무렵엔 짝 쪽에 이별이나 큰 다툼이 있었을 기라","money_vault":"{yy}년 무렵엔 큰돈이 한 번 움직였을 기라","money_hit":"{yy}년 무렵엔 억울하게 나간 돈이 있었을 기라"},"PAST_YEAR_EV_M":{"work_peak":"{yy}년 무렵엔 일이 크게 한 번 섰을 기라","work_clash":"{yy}년 무렵엔 하던 일이 크게 흔들렸을 기라","love_bind":"{yy}년 무렵엔 짝하고 단단히 묶이는 일, 결혼이나 부부 사이에 큰 일이 있었을 기라","love_clash":"{yy}년 무렵엔 부부 사이에 큰 다툼이나 떨어져 지낼 일이 있었을 기라","money_vault":"{yy}년 무렵엔 큰돈이 한 번 움직였을 기라","money_hit":"{yy}년 무렵엔 억울하게 나간 돈이 있었을 기라"},"PLAN_CHUNG":" 그라고 이 해는 니 {gung_mean} 쪽하고 정면으로 부딪친다. 옮기든 갈라지든 한다.","PLAN_INTRO":"앞 3년은 손님 순서대로 간다. 먼저 알아 둘 거. **10년 시즌은 방향이고 해마다 오는 손님은 속도다.** 시즌이 달리라 캐도 그해 손님이 쉬라 카면 속도를 줄이는 기라. 방향을 바꾸라는 게 아이다.","PLAN_LINE":"**{yy}년**엔 {plain}이 손님으로 온다. {act}","PRE3":"그라고 **10년 시즌이 바뀌기 3년 전에 깜짝 놀랄 일이 생긴다.** {y3}년에서 {y1}년 사이다. 그 3년에 손대는 일이 다음 10년 니 본업이 된다. 그때 뭘 시작하는지 단디 봐라.","PRESCRIBE":["처방 셋이다. 하나, **할 수 있는 걸 해라.** 못 하는 걸 붙잡고 있는 게 니 병이다.","둘, **세지면 약해진다.** 니가 세지는 그 자리에서 무너진다. 잘될 때 덜어내라.","셋, **센 놈이 살아남는 게 아니라 살아남는 놈이 센 기라.** 버텨라. 시즌은 바뀐다."],"PRE_DAEUN":"니는 아직 첫 시즌이 안 열렸다. {n}세부터다. 지금은 타고난 팔자 그대로 사는 때다. 되짚을 게 없으니 이 편은 짧다.","PRI":{"marry_dating":"결혼을 준비해라","marry_single":"사람 만날 준비를 해라","marry_reunion":"그 사람 문제를 정리해라","marry_body":"{yy}년이 {what}다.{gap} {do}","marry_gap":" 이 해를 놓치면 다음은 {nxt}년이라 {n}년을 기다려야 된다.","marry_gap_none":" 이 해를 놓치면 앞 10년 안엔 이만한 해가 다시 안 보인다.","marry_do":{"dating":"그 전에 둘이 돈, 집, 아이, 양가 얘기를 맞춰 둬라.","single":"그 전까지 소개 자리, 모임에 꾸준히 나가라. 집에만 있으면 그해가 와도 만날 사람이 없다.","reunion":"그 전에 헤어진 이유부터 고쳐 놔라. 그대로 붙으면 또 같은 데서 갈라진다."},"study":"공부해서 취업에 집중해라","study_body":"{sy}년엔 자격이든 공부든 끝내 두고, {jy}년에 들어갈 데를 노려라. {jy}년은 {name}다.","study_body1":"{jy}년이 {name}다. 그 전까지 자격이든 기술이든 하나는 끝내 둬라. 준비된 사람만 그해를 잡는다.","work_up":"일에서 크게 한 번 벌일 준비를 해라","work_up_body":"{yy}년이 {name}다. 정점은 그 전 2~3년에 깔아 둔 게 터지는 거라, 지금부터 그 판을 깔아라.","work_guard":"일 자리 흔들리는 해를 대비해라","work_guard_body":"{yy}년엔 하던 판이 통째로 흔들린다. 옮길 거면 그 전에 옮기고, 버틸 거면 그 해만 넘겨라. 그해에 홧김에 그만두는 게 제일 손해다.","money_guard":"돈 지키기가 먼저다","money_guard_body":"{yy}년은 {name}다. 그해엔 빌려주지 말고, 보증 서지 말고, 같이 하자는 투자는 거절해라. 지켜야 다음에 들어올 때 남는다.","money_up":"목돈 만들 준비를 해라","money_up_body":"{yy}년은 {name}다. 그해 들어온 돈은 반을 딴 통장에 떼서 묶어라. 그 돈이 다음 판 밑천이다.","body":"몸부터 챙겨라","body_body":"{yy}년엔 니 몸 자리가 흔들린다. 일이고 돈이고 몸이 버텨야 따라온다. 그해엔 검진 받고, 일정 하나는 빼라.","keep":"니 무기를 갈고닦아라","keep_body":"니가 제일 잘하는 걸 하나 더 키워 둬라. 남들이 니한테 자꾸 맡기는 일, 그게 니 무기다. 운이 올 때 그게 밑천이 된다.","work_stay":"지금 자리에서 키우는 데 집중해라","work_stay_body":"{yy}년은 {name}다. 옮길 생각보다 지금 하는 데서 이름을 세울 때다. 여기서 쌓은 게 나중에 옮길 때 몸값이 된다.","season_in":"지금이 니 일복 시즌이다, 판을 키워라","season_in_body":"{y2}년까지가 니 인생에서 일복이 제일 두터운 10년이다. 이 시즌에 벌인 게 남은 인생을 먹여 살린다. 미루지 마라.","season_soon":"니 일복 시즌 들어갈 준비를 해라","season_soon_body":"{y1}년부터 10년이 니 인생에서 일복이 제일 두텁다. 시즌 들어가기 2~3년 전에 깔아 둔 게 그 10년 내내 간다. 지금 뭘 깔지 정해라.","kids":"자식 일을 챙겨라","kids_body":"{yy}년엔 자식이나 아랫사람 쪽이 흔들린다. 그해엔 니 일보다 그쪽 얘기를 먼저 들어 줘라.","kids_good":"자식 덕 볼 준비를 해라","kids_good_body":"{yy}년엔 자식이나 아랫사람이 니 편이 된다. 그해엔 맡길 건 맡기고 기대도 된다.","retire_money":"모은 돈은 굴리지 말고 지켜라","retire_money_body":"이 나이엔 버는 것보다 안 잃는 게 버는 기라. 솔깃한 투자 얘기는 가족한테 먼저 보이고, 큰돈은 한 번에 움직이지 마라.","work_stay_body_biz":"{yy}년은 {name}다. 판을 옮기거나 새로 벌이기보다 지금 하는 일을 키울 때다. 여기서 붙은 손님이 나중에 밑천이 된다.","health":"몸을 일정표에 넣어라","health_body":"이 나이엔 몸이 곧 재산이다. 검진 날짜, 걷는 시간부터 달력에 박아 두고 나머지 일정을 짜라.","marry_do_now":{"dating":"올해 안에 둘이 돈, 집, 아이, 양가 얘기를 맞춰 둬라.","single":"올해는 소개 자리, 모임을 마다하지 마라. 집에만 있으면 좋은 해를 그냥 보낸다.","reunion":"올해 안에 헤어진 이유부터 고쳐 놔라. 그대로 붙으면 또 같은 데서 갈라진다."},"study_body1_now":"{jy}년이 {name}다. 올해 안에 자격이든 기술이든 하나는 끝내 둬라. 준비된 사람만 그해를 잡는다."},"PRI_HEAD":"앞일 보기 전에, 지금 니한테 제일 급한 것부터 순서대로 짚어 준다. 앞으로 오는 운을 다 보고 고른 거다.","PRI_LINE":"**{ord}, {head}.** {body}","PRI_ORD":["첫째","둘째","셋째"],"REUNION_NONE":"앞 5년 안엔 다시 붙는 해가 안 보인다. 붙잡고 있는 건 운이 아니라 **니 미련이다.** 놔야 새 사람이 들어온다.","REUNION_OPEN":"다시 붙을 해가 있다. **{yrs}년이다.** 그해엔 니 짝 자리에 사람이 착 붙는다. 연락이 오든 니가 하든 문이 열리는 해다.","REUNION_SHUT":"대신 **{yrs}년**은 짝 자리가 정면으로 부딪치는 해다. 그해에 붙으면 또 갈라진다. 그해엔 붙잡지 마라.","REUNION_STAR":"그라고 **{yrs}년**엔 짝 기운이 손님으로 온다. 그 사람이든 새 사람이든 사람이 들어오는 해다.","RULE_23":"하나 알아 둬라. **10년 시즌이 바뀌기 2~3년 전에 손댄 일을 그다음 10년 내내 한다.** 지금 시즌은 {cy}년에 시작했으니, {cy3}년에서 {cy1}년 사이에 니가 시작한 그거, 그게 이번 10년 니 본업이다.","RX_HEAD":"처방은 세 개다. 니 팔자에 맞춘 거라 남한테는 안 맞는다.","RX_LINE":"{n}. **{head}.** {body}","SAME_WARN":"하나 알아 둬라. **니하고 똑같은 사람은 피해라.** 똑같은 사람 만나면 편한데 둘 다 안 큰다.","SEASON_MEAN":{"재성":"벌여 놓은 걸 거둬서 돈으로 바꾸는 때라, 움직이는 쪽이 맞다.","식상":"새로 만들고 벌이는 때다. 대신 아직 덜 익었으니 한 번에 크게 걸지는 마라.","관성":"책임지고 자리를 굳히는 때라, 새로 벌이기보다 지키는 쪽이 맞다.","인성":"배우고 정리하는 때라, 달리기보다 준비하는 쪽이 맞다.","비겁":"사람 모으고 재료 모으는 때라, 결정보다 준비가 먼저다. 동업은 조심해라."},"SEASON_PLAIN":{"재성":"돈하고 일이 크게 움직이는","식상":"하고 싶은 걸 꺼내서 해 보는","관성":"책임이 무거워지고 자리가 굳는","인성":"배우고 실력을 쌓는","비겁":"사람이 몰리고 경쟁이 붙는"},"SEAT_WORD":{"년":"집안","월":"일","일":"집과 짝","시":"자식과 말년"},"SEUN_PAST_CLOSE":["세 해를 나란히 놓으면 결이 보인다. 손님은 다 달랐는데 니가 받는 방식은 늘 같았을 기라.","이게 니가 지나온 세 해다. 앞일은 뒤에서 본다."],"SEUN_PAST_GUNG":" 그해엔 니 {gung_mean} 쪽이 흔들렸다.","SEUN_PAST_HEAD":"니는 아직 첫 시즌이 안 열렸다. {n}세부터다. 그라모 시즌 대신 **지나온 세 해**를 짚자. 니 나이엔 지난 10년보다 최근 3년이 더 또렷하거든.","SEUN_PAST_HEAD2":"니는 지금이 **첫 시즌**이다({cy}년 시작). 되짚을 지난 시즌이 없으니 대신 지나온 세 해를 짚자.","SEUN_PAST_LINE":"**{yy}년**엔 {plain}이 손님으로 왔다. {expl}","SPOUSE_CLASH":" 그라고 니 팔자엔 짝 자리가 다른 자리하고 부딪친다. 둘 사이는 좋아도 바깥 일, 그러니까 일이나 집안이 자꾸 끼어든다. **둘만의 시간을 따로 떼어 두는 게** 이 팔자의 보강법이다.","SPOUSE_PM":{"비견":["대등하게 같이 간다는 거다. 니 편이 되어 주고 같이 일을 벌일 수 있다","둘 다 고집이 세서 누가 숙이질 않는다. 돈 쓰는 데서도 각자 주장이 세다","**역할을 갈라라.** 돈은 누가, 집안일은 누가, 정해 놓으면 부딪칠 일이 반으로 준다."],"겁재":["추진력이 세고 판을 같이 키울 수 있다는 거다","돈이 둘 사이로 새기 쉽고, 경쟁하듯 산다","**통장은 각자 하나씩, 같이 쓰는 건 하나만.** 돈 규칙만 정해도 싸움이 준다."],"식신":["편하고 넉넉하다는 거다. 먹이고 챙기고, 집이 따뜻하다","둘 다 늘어지기 쉽다. 편한 게 길어지면 발전이 없다","**같이 할 목표를 하나 세워라.** 저축이든 운동이든, 같이 하는 게 하나 있어야 안 늘어진다."],"상관":["재밌고 말이 통한다는 거다. 재주 많은 짝이라 같이 있으면 심심할 틈이 없다","말이 세서 상처 주기 쉽고 니 자리를 흔든다","**싸울 땐 글로 해라.** 말로 하면 세게 나간다. 그라고 짝 재주가 밖으로 나갈 데를 만들어 줘라."],"편재":["통 크고 활동적이라 판이 커진다는 거다. 돈 들어올 길을 짝이 연다","밖으로 돌고 씀씀이가 크다","**큰돈 쓰기 전엔 둘이 같이 정하는 규칙**을 만들어라. 그것만 지키면 짝이 니 복이다."],"정재":["성실하고 알뜰하다는 거다. 살림이 안정되고 돈이 모인다","답답하고 재미가 덜하다. 바뀌는 걸 싫어한다","**한 달에 한 번은 둘이 새 걸 해라.** 안 가 본 데, 안 먹어 본 거. 든든함에 재미만 얹으면 된다."],"편관":["추진력 있고 니를 단단하게 만든다는 거다. 밖에서 든든한 방패다","누르고 몰아붙인다. 니가 숨 막힐 때가 있다","**니 시간을 정해 두고 지켜라.** 숨 쉴 틈이 있어야 이 짝 옆에서 오래 간다."],"정관":["반듯하고 믿음직하다는 거다. 집안의 기둥이 된다","체면을 챙기고 니 맘대로 하는 걸 못 봐준다","**큰일은 미리 상의해라.** 상의만 하면 이 짝은 끝까지 니 편이다."],"편인":["생각이 깊고 니가 못 보는 걸 본다는 거다","속을 잘 안 보이고 끈기가 딸린다. 혼자 있고 싶어 한다","**혼자 있는 시간을 인정해 줘라.** 다그치면 더 멀어지고, 놔두면 돌아온다."],"정인":["받쳐 주고 챙겨 준다는 거다. 니가 힘들 때 기댈 데다","니가 받는 데 익숙해져서 고마운 줄 모르게 된다","**받은 만큼 표현해라.** 고맙다는 말 한마디가 이 짝을 계속 니 편으로 둔다."]},"SPOUSE_PMF":"이런 짝의 좋은 점은 {plus}. 대신 모자란 데도 있다. {minus}. 둘이 더 잘 살려면 이거 하나만 해라. {fix}","SPOUSE_REL":{"f":"니를 누르는 게 아니라 잡아 주는 사람, 그게 니 짝이다.","m":"니가 굴리는 게 아니라 지켜 주는 사람, 그게 니 짝이다."},"SPOUSE_SEAT":"짝은 어디 있노? 팔자 표에서 **니 바로 밑 글자**, 거기가 짝 자리다. 어설프게 배운 사람들은 글자 종류부터 찾는데, 자리가 먼저다.","SPOUSE_STAR":{"0":"그라고 니 팔자엔 **짝 기운이 없다.** 짝에 대한 그림이 흐릿하단 말이다. 그래서 자꾸 찾고, 찾아도 확신이 안 선다. 근데 없는 건 복이다. 짝 때문에 무너질 일은 없다.","1":"그라고 니 팔자엔 짝 기운이 **딱 하나** 있다. 그림이 또렷하다. 니가 원하는 짝 모양이 정해져 있는 기라. 그 모양 아니면 안 끌린다.","2":"그라고 니 팔자엔 짝 기운이 {n}개다. 고를 게 많아서 못 고르고, 골라 놓고도 **딴 데 본다.** 하나로 정하는 게 니 숙제다."},"SPOUSE_STAR_DIVORCED":"그라고 니 팔자엔 짝 기운이 {n}개다. 고를 게 많아서 **한 사람한테 오래 못 머무는** 모양이다. 다음엔 기준을 딱 하나만 정해라.","SPOUSE_STAR_MARRIED":"그라고 니 팔자엔 짝 기운이 {n}개다. 결혼했어도 **자꾸 비교하게 되는** 모양이다. 옆 사람을 딴 사람하고 재 보는 버릇, 그게 싸움 불씨다. 비교를 멈추면 옆 사람이 보인다.","SPOUSE_STEM":"니한테 맞는 짝은 {simg} 같은 사람이다. {rel}","STAMP":"여기까지다. {화자}가 본 니 팔자, 열여섯 편. 맞는 건 맞고, 안 맞는 건 니 옆 사람 얘기다. 팔자는 집 전체를 흔들거든. 가라. 시즌 바뀌면 또 온나.","STAMP2":"여기까지다. {화자}가 본 니 팔자, 열여섯 편. 맞는 건 맞고, 안 맞는 건 니 옆 사람 얘기다. 팔자는 집 전체를 흔들거든. 처방 세 개만 기억하고 가라. 시즌 바뀌면 또 온나.","STEM2":{"0":"큰 나무는 위로 자라야 산다. 니가 답답한 건 누가 눌러서가 아니라 자랄 데가 없어서다. 사람 바꾸지 말고 자리를 옮겨라.","1":"덩굴은 혼자 못 선다. 그게 약점 같제? 아이다. 기댈 데를 고르는 눈이 니 재주다. 기대는 게 문제가 아니라 잘못 고른 걸 붙잡고 있는 게 문제다.","2":"해는 하나면 된다. 니 옆에 해가 또 있으면 둘 다 죽는다. 니가 튀는 사람하고 자꾸 부딪치는 게 그래서다. 비출 데를 정해라.","3":"촛불은 바람을 탄다. 남 말 한마디에 흔들리는 거, 예민해서가 아니라 불이 작아서 그렇다. 대신 니는 어두운 데서 제일 빛난다. 남들 못 보는 걸 본다.","4":"산은 안 움직이는 게 아니라 못 움직이는 기라. 답답하단 소리 듣는 게 그래서다. 근데 산 없는 동네에 사람 모이더나? 니 자리에 있어라. 그게 니 값이다.","5":"밭은 뭘 심느냐가 전부다. 니는 남이 심은 거 기르느라 니 걸 못 심었다. 이제는 니 밭에 니 걸 심어라. 남 일 봐주는 건 그다음이다.","6":"도끼는 나무를 만나야 값이 나온다. 자를 게 없으면 니가 니를 자른다. 요새 니가 니한테 제일 독하제? 자를 거를 밖에서 찾아라. 일로.","7":"보석은 다듬어야 값이 난다. 근데 니는 다듬어 주는 사람을 밀어낸다. 찔릴까 봐. 니를 갈아 주는 사람이 니를 살리는 사람이다. 아프다고 피하지 마라.","8":"바다도 둑이 있어야 쓸모가 있다. 니한테 둑은 규칙이고 마감이고 약속이다. 니가 제일 싫어하는 그게 니를 크게 만든다. 둑 없으면 그냥 넓은 웅덩이다.","9":"이슬도 모이면 강이 된다. 니는 혼자 있으면 작아지고 어디 스며들면 커진다. 조직이든 사람이든 스며들 데를 찾아라. 대신 스며든 데서 못 나오는 게 병이다."},"STEM2_HEAD":"니를 뜻하는 글자는 {h}({k})다. 팔자 표에서 태어난 날 윗글자, 이게 니다. {el} 기운이다. ","STEM_REL":{"합":"이번 10년은 니하고 **손이 착 맞는** 기운이다. 뭔가에 마음이 묶이는 10년이다. 좋은 거다. 대신 그 마음이 온전히 니 것인지는 한 번씩 물어봐라.","생아":"이번 10년은 **니를 밀어주는** 기운이다. 힘 빠질 때 뒤를 돌아봐라. 받쳐 주는 게 있다.","아생":"이번 10년은 **니가 먹여 살리는** 기운이다. 내주는 10년이다. 나쁘진 않은데 자꾸 뭘 내놓게 된다.","극아":"이번 10년은 **니를 누르는** 기운이다. 쪼매 버겁다. 근데 누르는 게 있어야 모양이 잡힌다.","아극":"이번 10년은 **니가 잡으러 가는** 기운이다. 돈이든 사람이든 쫓아가는 10년이라 바쁘다.","비겁":"이번 10년은 **니하고 똑같은** 기운이다. 쪼매 아깝다. 고민만 하다 끝나기 쉽다. 니 같은 놈이 옆에 붙으면 결정이 늦어진다."},"STUDY_FIELD":{"식신":"말하고 가르치고 만드는 공부가 맞다. 교육, 상담, 창작, 요리·콘텐츠 쪽. 사람하고 섞여서 하는 공부에서 큰다.","상관":"니 생각대로 표현하는 공부가 맞다. 말, 글, 창작, 미디어 쪽. 남한테 맞추지 말고 니 맛대로 할 때 실력이 붙는다.","편재":"판을 크게 보는 공부가 맞다. 경영, 무역, 유통 쪽. 꿈을 크게 잡아라.","정재":"거북이처럼 꾸준히 쌓는 공부가 맞다. 회계, 경제, 관리, 기술 자격 쪽. 한 계단씩 올라가는 게 니 무기다.","편관":"센 일을 맡는 공부가 맞다. 경찰·군·소방, 법, 체육, 행정 쪽. 순한 공부보다 버티는 공부에서 큰다.","정관":"바른 틀에서 인정받는 공부가 맞다. 행정, 법, 공공기관, 큰 회사 쪽. 성적표하고 자격증이 니한테 맞는 저울이다.","편인":"남들 안 하는 전문 공부가 맞다. 문화예술, 연구, 특수 기술 쪽. 대신 게으름만 조심해라.","정인":"사회가 알아주는 공부가 맞다. 시험, 학위, 교육, 의약 쪽. 니는 공부 체질이다.","비견":"니가 대장이 되는 공부가 맞다. 기술, 체육, 문화예술, 창업 쪽. 남 밑보다 니 판을 짜는 쪽이다.","겁재":"승부가 붙는 공부가 맞다. 체육, 대회, 경영 쪽. 경쟁심을 쓸 데를 찾아야 니가 안 화난다."},"STUDY_SHORT":{"식신":"만들어 내놓는 공부","상관":"말하고 표현하는 공부","편재":"사람과 돈이 움직이는 공부","정재":"꼼꼼하게 쌓는 공부","편관":"몸과 책임을 쓰는 공부","정관":"정해진 틀에서 인정받는 공부","편인":"남들 안 하는 걸 파는 공부","정인":"배워서 넘기는 공부","비견":"같이 부딪치며 크는 공부","겁재":"승부가 붙는 공부"},"SYMPTOM_G":{"비겁":"니는 무너지기 전에 **사람한테 먼저 짜증이 난다.** 별것 아닌 말에 욱하고, 같이 하던 사람하고 틀어진다. 그게 신호다. 그때는 사람 만나는 걸 줄이고 혼자 정리할 시간을 가져라.","식상":"니는 무너지기 전에 **말이 거칠어지고 일을 벌인다.** 갑자기 이것저것 시작하고 윗사람한테 대든다. 그게 신호다. 그때는 새로 벌이지 말고 하던 거 하나만 마무리해라.","재성":"니는 무너지기 전에 **돈을 막 쓰거나 큰 판에 손댄다.** 한 방에 만회하고 싶어지는 기라. 그게 신호다. 그때는 카드 한 장만 남기고 큰돈은 석 달 묶어 둬라.","관성":"니는 무너지기 전에 **책임을 혼자 다 떠안는다.** 거절을 못 하고 잠이 줄고 몸이 먼저 고장 난다. 그게 신호다. 그때는 일 하나를 남한테 넘기고 병원부터 가라.","인성":"니는 무너지기 전에 **생각만 많아지고 몸이 안 나간다.** 하루 종일 누워서 걱정만 한다. 그게 신호다. 그때는 생각을 멈추고 밖에 나가서 걸어라. 몸이 움직이면 머리가 따라온다."},"TEEN_ACT":{"boss":{"인성":"그해엔 기술 하나를 기초부터 배워라. 요리 학원, 목공 체험, 코딩 학원, 운동 클럽 중에 끌리는 거 하나면 된다.","식상":"그해엔 만든 걸 직접 내놔 봐라. 학교 축제 판매 부스, 벼룩시장, 손으로 만든 물건 장터 같은 데서.","재성":"그해엔 한국잡월드나 지역 직업체험관에 가서 사장님·기술자 일을 직접 해 봐라. 동네 가게 사장님 인터뷰도 좋다.","관성":"그해엔 그 기술 자격증이나 급수 시험을 쳐 봐라. 조리기능사, 컴퓨터 자격증, 태권도·수영 급수 같은 거.","비겁":"그해엔 같이 할 동아리나 팀을 니가 꾸려 봐라. 학교 창업 동아리, 운동 클럽."},"식신":{"인성":"그해엔 독서 논술, 글쓰기 교실, 그림 학원처럼 말·글·그림 기초를 배워라. 책은 한 달에 두 권.","식상":"그해엔 글이든 그림이든 영상이든 하나를 끝까지 완성해서 보여 줘라. 학교 문집, 교내 전시, 가족 앞 발표회도 된다.","재성":"그해엔 선생님, 상담사, 작가가 일하는 걸 직접 봐라. 꿈길 진로체험이나 도서관 작가와의 만남 같은 데서.","관성":"그해엔 글짓기·말하기 대회나 한자·한국사 급수 시험에 나가 봐라.","비겁":"그해엔 도서관 독서 봉사나 동생들 가르치는 멘토링을 시작해라."},"상관":{"인성":"그해엔 좋아하는 분야 기초를 제대로 배워라. 영상 편집 수업, 작곡·보컬 레슨, 웹툰 그리기 강좌 같은 거.","식상":"그해엔 니 이름으로 블로그나 영상 채널을 만들어 하나씩 올려 봐라. 남 따라 하지 말고 니 식으로. 공개 범위는 보호자하고 정해라.","재성":"그해엔 방송국 견학, 출판사·광고 회사 탐방, 청소년 미디어센터 프로그램처럼 만드는 현장을 봐라.","관성":"그해엔 청소년 영상·글 공모전에 내 봐라.","비겁":"그해엔 교내 방송반, 신문반, 창작 동아리에 들어가라."},"편재":{"인성":"그해엔 청소년 경제 교실, 경제 신문 청소년판, 용돈 기입장으로 돈이 도는 기초를 배워라.","식상":"그해엔 학교 축제 부스나 벼룩시장에서 직접 팔아 봐라. 원가하고 남은 돈을 계산해 봐라.","재성":"그해엔 전통시장, 물류센터, 기업 견학처럼 돈과 물건이 도는 현장을 봐라.","관성":"그해엔 청소년 경제 이해력 시험이나 창업 경진대회에 나가 봐라.","비겁":"그해엔 모둠 프로젝트나 창업 동아리에서 판을 니가 짜 봐라."},"편관":{"인성":"그해엔 운동 하나를 꾸준히 하고 법·규칙에 대한 책을 읽어라. 태권도, 수영, 축구 클럽 같은 거.","식상":"그해엔 운동 대회나 토론 대회에 나가 니 힘을 보여 줘라.","재성":"그해엔 소방서·경찰서 견학, 법원 재판 방청, 안전체험관처럼 센 일 하는 현장을 직접 봐라.","관성":"그해엔 운동 승급·승단 심사나 체력 인증을 받아 봐라. 버틴 만큼 나온다.","비겁":"그해엔 운동부, 선도부, 청소년 경찰학교처럼 규율 있는 팀에 들어가라."},"org":{"인성":"그해엔 수학·경제·사회 기초를 다지고 컴퓨터 문서 다루는 법(한글·엑셀)을 배워라.","식상":"그해엔 학생회나 동아리에서 맡은 일을 정리해서 발표해 봐라.","재성":"그해엔 시청·구청 견학, 청소년 의회, 회사 탐방으로 조직이 굴러가는 현장을 봐라.","관성":"그해엔 컴퓨터 활용 자격증이나 한국사 시험 같은 기초 시험을 쳐 봐라.","비겁":"그해엔 학생회나 동아리 임원을 맡아라."},"정인":{"인성":"그해엔 국어·영어·수학 기초를 잡고 독서 습관을 들여라. 방과 후 수업이나 도서관 프로그램을 써라.","식상":"그해엔 배운 걸 친구한테 설명해 주고 정리 노트를 만들어라. 설명할 수 있어야 니 거다.","재성":"그해엔 대학 캠퍼스 투어, 병원·연구소 견학, 과학관 프로그램에 가 봐라.","관성":"그해엔 학력 평가, 교육청 영재원 선발, 경시대회에 도전해 봐라.","비겁":"그해엔 같이 공부할 스터디 모임을 만들어라."},"편인":{"인성":"그해엔 꽂힌 분야 하나를 깊게 파라. 코딩 학원, 악기 레슨, 미술 학원, 과학 탐구 교실 중 하나.","식상":"그해엔 그 분야 결과물을 하나 완성해라. 앱 하나, 곡 하나, 작품 하나, 탐구 보고서 하나.","재성":"그해엔 대학 연구실 체험, 전시회, 공연장, 과학관 캠프에 직접 가 봐라.","관성":"그해엔 소프트웨어·과학 탐구 대회나 미술·음악 공모전에 내 봐라.","비겁":"그해엔 같은 걸 좋아하는 소수 모임을 찾아라. 온라인 모임이면 보호자하고 같이 골라라."}},"TEEN_ACT2":{"인성":"{yrs}년엔 배운 걸 문제로 풀고 남한테 설명해 보면서 굳혀라.","식상":"{yrs}년엔 한 단계 올려라. 만든 걸 더 큰 무대, 대회나 전시에 내놔라.","재성":"{yrs}년엔 본 걸 바탕으로 체험이나 봉사처럼 직접 해 보는 걸 하나 해라.","관성":"{yrs}년엔 한 단계 위 시험에 도전해라.","비겁":"{yrs}년엔 그 팀에서 니 역할 하나를 맡아라.","clash":"{yrs}년까지 흔들림이 이어진다. 하던 준비만 지켜라."},"TEEN_ACT2F":{"boss":{"인성":"배운 기술로 작은 걸 직접 만들어 봐라.","식상":"내놓은 걸 고쳐서 한 번 더 내놔라. 이번엔 값을 받아 봐라.","재성":"그 가게나 공방에서 하루라도 일을 거들어 봐라.","관성":"한 단계 위 급수에 도전해라.","비겁":"꾸린 팀으로 대회 하나에 나가라."},"식신":{"인성":"읽은 걸 니 말로 정리해서 써 봐라.","식상":"완성한 걸 더 많은 사람 앞에 내놔라. 발표회든 전시든.","재성":"그 일을 하루 따라다니는 체험을 해 봐라.","관성":"한 단계 위 대회나 급수에 나가라.","비겁":"가르치는 봉사를 꾸준히 이어 가라."},"상관":{"인성":"배운 기초로 니 작품 하나를 기획해 봐라.","식상":"올린 것 중에 반응 좋은 걸 시리즈로 이어 가라.","재성":"그 현장에서 작은 일이라도 직접 맡아 봐라.","관성":"더 큰 공모전에 내라.","비겁":"모임에서 니가 기획을 맡아라."},"편재":{"인성":"배운 걸로 용돈 기록부터 직접 굴려 봐라.","식상":"팔아 본 걸 키워서 한 번 더 해 봐라. 남은 돈을 따져 봐라.","재성":"본 걸 바탕으로 작은 판매나 장터 일을 거들어 봐라.","관성":"한 단계 위 대회에 나가라.","비겁":"짠 판을 친구들하고 끝까지 굴려 봐라."},"편관":{"인성":"쌓은 체력으로 운동 하나를 정해서 꾸준히 해라.","식상":"한 단계 큰 대회에 나가라.","재성":"그 일 하는 사람한테 직접 물어보는 자리를 만들어라.","관성":"한 단계 위 급수나 검정에 도전해라.","비겁":"그 팀에서 맡은 역할을 끝까지 해내라."},"org":{"인성":"배운 걸로 엑셀이나 문서 정리를 직접 해 봐라.","식상":"발표한 걸 보고서로 정리해서 남겨라.","재성":"그 일 하는 사람 일과를 하루 따라다녀 봐라.","관성":"한 단계 위 자격증에 도전해라.","비겁":"맡은 임원 일을 끝까지 해내고 기록을 남겨라."},"정인":{"인성":"모르는 걸 찾아 읽는 습관을 하루 한 시간으로 늘려라.","식상":"정리 노트를 친구들하고 나눠 봐라. 설명하면서 니가 는다.","재성":"관심 가는 학과 수업을 하루 청강해 봐라.","관성":"한 단계 위 경시대회에 나가라.","비겁":"스터디를 니가 이끌어라."},"편인":{"인성":"판 분야에서 니만의 주제 하나를 정해라.","식상":"완성한 걸 남들 앞에 내놔라. 전시든 발표든.","재성":"그 분야 사람한테 직접 연락해서 물어봐라.","관성":"더 큰 대회에 내라.","비겁":"모임에서 니가 아는 걸 나눠라."}},"TEEN_ACT_CLASH":"그해엔 큰 결정은 미루고, 분야를 갈아타기보다 하던 준비를 지켜라.","TEEN_AGE":20,"TEEN_ANS_HEAD":"니 나이엔 이게 제일 궁금할 기라. **진로는 언제 정해지나.** 돌려 말 안 한다.","TEEN_ANS_NEXT":"하나 더. **시험·입시는 언제 잘 풀리나.** 이것도 답부터 한다.","TEEN_BACK_G":{"재성":"아니라꼬? 그라모 갖고 싶은 게 생기면 모아서라도 사는 쪽이었을 기라. 돈 계산은 빠르제.","관성":"아니라꼬? 그라모 어디서든 결국 니가 총대 멨을 기라. 모둠이든 동아리든 니한테 맡겨지제.","인성":"아니라꼬? 그라모 궁금한 건 끝까지 찾아보는 쪽이었을 기라. 찾아보다 밤새운 적 있제.","식상":"아니라꼬? 그라모 쉬는 시간에라도 뭘 만들거나 떠들고 있었을 기라. 가만있으면 좀이 쑤시제.","비겁":"아니라꼬? 그라모 게임이든 시험이든 경쟁만 붙으면 눈빛이 달라졌을 기라. 지는 건 못 참제."},"TEEN_BODY_CARE":{"목":"그해엔 눈하고 근육이 먼저 지친다. 폰·게임 시간을 줄이고, 자기 전에 스트레칭을 해라. 짜증이 늘면 참지 말고 말로 풀어라.","화":"그해엔 심장이 쉽게 놀란다. 늦게 자지 말고, 무서운 영상이나 큰 소리는 피하고, 운동하고 나면 물부터 마셔라.","토":"그해엔 위장이 먼저 지친다. 야식하고 단 것을 줄이고 끼니 시간을 지켜라. 운동 전엔 무릎 준비 운동을 꼭 해라.","금":"그해엔 폐하고 피부가 먼저 지친다. 미세먼지 많은 날엔 마스크를 쓰고, 환절기 감기를 조심하고, 물하고 채소를 챙겨 먹어라.","수":"그해엔 신장·방광하고 귀가 먼저 지친다. 화장실은 참지 말고, 이어폰 볼륨을 줄이고, 기분이 처지면 혼자 두지 말고 말해라."},"TEEN_BODY_COLOR":"요새 자꾸 끌리는 옷 색이 있으면 봐라. 약해진 기운이 그 색을 찾는 기라. 파랑·초록은 나무, 빨강·분홍은 불, 노랑·갈색은 흙, 하양은 쇠, 검정·회색은 물이다.","TEEN_BODY_EL":{"목":"**나무(木) 쪽이 약하다.** 간·담, 눈, 관절·근육이 먼저 지친다. 신호는 짜증, 눈 피로, 몸이 뻐근한 거다. 스트레칭을 버릇으로 들여라.","화":"**불(火) 쪽이 약하다.** 심장·혈관, 혀, 얼굴 쪽이 먼저 지친다. 신호는 잘 놀라고 얼굴이 쉽게 달아오르는 거다. 놀랄 일 앞에 숨부터 골라라.","토":"**흙(土) 쪽이 약하다.** 위장, 무릎, 잇몸이 먼저 지친다. 신호는 속이 더부룩하고 입맛이 들쭉날쭉한 거다. 끼니를 거르지 마라.","금":"**쇠(金) 쪽이 약하다.** 폐·대장, 코, 피부가 먼저 지친다. 신호는 잦은 기침, 코막힘, 피부 트러블이다. 환기하고 물을 자주 마셔라.","수":"**물(水) 쪽이 약하다.** 신장·방광, 귀가 먼저 지친다. 신호는 소변을 자꾸 참는 버릇, 잠이 얕고 기분이 처지는 거다. 화장실은 참지 마라."},"TEEN_BODY_HIT":"**{lab}**엔 {yname} 기운이 들어와 니 약한 {wname} 쪽을 친다. {care}","TEEN_BODY_NONE":"다섯 기운이 고르게 있어서 크게 약한 자리는 없다. 대신 생활 리듬이 깨지면 다 같이 처진다. 자는 시간부터 지켜라.","TEEN_BODY_YEARS":"앞 5년 중 **{yrs}년**엔 그해 들어오는 기운이 니 약한 쪽을 치거든. 그래서 그쪽이 더 지치기 쉽다. 그해엔 잠·밥·운동부터 챙겨라.","TEEN_CHEONSEONG":{"비견":"니가 타고난 천성은 **아버지를 닮은 고집**이다. 니 길은 니가 정한다.","겁재":"니가 타고난 천성은 **악바리 승부욕**이다. 쓸 데를 찾으면 무기고, 못 찾으면 늘 화가 나 있다.","식신":"니가 타고난 천성은 **여유와 풍류**다. 즐길 줄 알고 사람을 편하게 한다.","상관":"니가 타고난 천성은 **밀어붙이는 힘**이다. 하고 싶은 말은 해야 직성이 풀린다.","편재":"니가 타고난 천성은 **큰 꿈, 큰 스케일**이다. 작게 노는 건 성에 안 찬다.","정재":"니가 타고난 천성은 **거북이 같은 꾸준함**이다. 느려도 끝까지 간다.","편관":"니가 타고난 천성은 **센 데로 가는 힘**이다. 순한 일보다 빡센 일에서 산다.","정관":"니가 타고난 천성은 **바른 생활**이다. 재미는 없어도 다들 니를 믿는다.","편인":"니가 타고난 천성은 **창작하는 끼**다. 남다른 생각이 나온다. 대신 게으름만 조심해라.","정인":"니가 타고난 천성은 **공부 체질**이다. 배우는 게 몸에 맞는다."},"TEEN_CHILD":{"0":"어릴 때부터 고집이 셌제? 하라는 대로 안 하고, 꺾이면 꺾였지 굽히진 않는 아이였다.","1":"어릴 때 누구 옆에 꼭 붙어 다녔제? 엄마든 언니든 친구든, 기댈 사람을 잘 골라서 따라다녔다.","2":"어릴 때 어딜 가도 눈에 띄었제? 목소리 크고 잘 웃는데, 하던 걸 오래 붙들진 못했다.","3":"어릴 때 눈치가 빨랐제? 어른들 표정부터 읽고, 작은 일에도 마음이 오래 갔다.","4":"어릴 때 듬직하다는 소리 들었제? 잘 안 울고, 속을 안 보여서 무슨 생각 하는지 몰랐다.","5":"어릴 때 동생이나 친구를 잘 챙겼제? 니 거 내주고도 별말 안 하는 아이였다.","6":"어릴 때 싫은 건 딱 잘라 싫다 했제? 결단은 빠른데 말이 좀 셌다.","7":"어릴 때 꼼꼼하고 예민했제? 옷이 까끌하거나 물건이 제자리에 없으면 못 견뎠다.","8":"어릴 때 이것저것 다 궁금해했제? 관심은 넓은데 하나에 오래 머물진 않았다.","9":"어릴 때 조용한데 할 건 다 했제? 작아 보여도 하고 싶은 건 결국 해내는 아이였다."},"TEEN_CHILD_BACK":"아니라꼬? 그라모 집에서는 그랬을 기라. 밖에서 감춘 거지 없어진 게 아이다.","TEEN_CLASH":["자리가 흔들리는 해","그해 기운이 니 무기 자리를 정면으로 치거든. 반이든 학교든 진로 계획이든 한 번 흔들린다.","큰 결정은 미루고 하던 것만 지켜라. 넘기면 더 맞는 자리로 간다"],"TEEN_CLASH_HOME":"**집.** 이사나 전학, 반 바뀜처럼 있던 자리가 바뀌기 쉽다. 바뀌면 바뀐 대로 받아라.","TEEN_COLOR_ROLE":"그 색이 니한테 뭘 뜻하냐면, 파랑·초록이 끌리면 {s0} 지친 거고, 빨강·분홍이면 {s1}, 노랑·갈색이면 {s2}, 하양이면 {s3}, 검정·회색이면 {s4} 지친 거다.","TEEN_DAD":{"비겁":"아버지 자리엔 **니랑 닮은 기운**이 앉았다. 아버지를 닮아 간다. 고집도 닮았다.","식상":"아버지 자리엔 **재주 기운**이 앉았다. 아버지한테서 하고 싶은 걸 해 보는 성질을 받았다.","재성":"아버지 자리엔 **판 굴리는 기운**이 앉았다. 아버지한테서 현실 감각, 셈하는 머리를 받았다.","관성":"아버지 자리엔 **규칙 기운**이 앉았다. 아버지한테서 반듯하게 사는 성질을 받았다. 대신 아버지 말이 무겁게 들린다.","인성":"아버지 자리엔 **받쳐 주는 기운**이 앉았다. 아버지한테서 배우기 좋아하는 성질을 받았다."},"TEEN_DAEUN_EVENT":{"비견":"또래하고 부딪칠 일이 많아졌다. 친구든 경쟁자든. 니 자리에 누가 들어왔거나 같이 하는 애가 생겼거나.","겁재":"니 걸 뺏기거나 나눌 일이 생겼다. 친구한테 서운했거나 형제하고 다퉜거나. 지기 싫은 마음도 확 커졌을 기라.","식신":"먹고 만들고 노는 쪽으로 판이 바뀌었다. 키나 살이 확 붙었거나 새로 빠진 게 생겼거나.","상관":"말이 많아지고 반항심이 올라왔다. 선생이나 부모하고 부딪쳤거나 하던 걸 그만두고 싶었거나.","편재":"노는 물이 넓어졌다. 아는 사람이 확 늘었거나, 집에 큰돈 들어가는 일이나 이사가 있었거나.","정재":"생활에 틀이 잡혔다. 학원이든 일과든 정해진 게 늘었다. 대신 답답해졌고.","편관":"어깨가 무거워졌다. 해야 할 게 갑자기 늘었거나 무서운 선생을 만났거나, 아프거나 눌리는 일. 빡센 시즌이다.","정관":"자리가 생겼다. 반이든 팀이든 어딘가에 확실히 속하게 됐다. 대신 니 맘대로는 못 하게 됐고.","편인":"혼자 파고드는 시간이 늘었다. 엉뚱한 취미, 특이한 친구. 별난 시즌이다.","정인":"받쳐 주는 게 생겼다. 도와주는 어른, 좋은 선생, 엄마 쪽 일. 공부가 좀 들어가기 시작했다."},"TEEN_DEVELOP":{"인성":"그해엔 {field} 쪽에 필요한 기초를 넣어라. 책, 강의, 자격 공부. 넣어 둔 게 다음 재주 해에 나온다.","식상":"그해엔 배운 걸 꺼내 봐라. 발표든 대회든 작품이든 {field} 쪽으로 결과물 하나를 남겨라.","재성":"그해엔 {field} 쪽 현장을 직접 보러 가라. 체험이든 견학이든 현실 감각을 키우는 해다.","관성":"그해엔 {field} 쪽에 필요한 시험이나 평가를 받아 봐라. 준비한 만큼 드러난다.","비겁":"그해엔 {field} 쪽을 같이 할 친구나 모임을 찾아 출발해라.","clash":"그해엔 계획이 한 번 흔들린다. 분야를 갈아타기보다 하던 준비를 지켜라."},"TEEN_EARN":{"재성":"니 돈은 **판을 굴려서 버는 돈**이다. 사고팔고 사람 모으고 일을 벌이는 데서 돈이 난다. 정해진 돈만 받는 자리는 답답할 기라.","관성":"니 돈은 **자리에서 나오는 돈**이다. 어딘가에 속해서 맡은 걸 해내면 꼬박꼬박 들어온다. 이름이 오르면 돈도 오른다.","인성":"니 돈은 **배운 걸로 버는 돈**이다. 자격이든 전문 기술이든, 남이 못 하는 걸 아는 데서 돈이 난다. 공부가 곧 밑천이다.","식상":"니 돈은 **재주로 버는 돈**이다. 만들고 말하고 보여 주는 데서 돈이 난다. 니 손에서 나온 게 팔리는 기라.","비겁":"니 돈은 **사람하고 같이 버는 돈**이다. 팀으로 움직이고 경쟁이 붙는 데서 돈이 난다. 혼자 하는 일보다 여럿이 하는 일이다."},"TEEN_EARN_G":{"비견":"니 돈은 **니가 대장인 일**에서 나온다. 니 판을 짜서 하는 일이 맞다. 대신 동업은 하지 마라.","겁재":"니 돈은 **니가 대장인 일**에서 나온다. 니 판을 짜서 하는 일이 맞다. 대신 동업은 하지 마라.","식신":"니 돈은 **말하고 가르치고 만드는 데**서 나온다. 교육, 상담, 창작처럼 사람하고 섞이는 일이다.","상관":"니 돈은 **니 개성**에서 나온다. 말하고 만드는 일인데, 대중에 맞추지 말고 니 맛대로 할 때 돈이 된다.","편재":"니 돈은 **판 큰 일**에서 나온다. 사업, 유통처럼 크게 굴리는 쪽이다.","편관":"니 돈은 **센 자리**에서 나온다. 권한 있는 자리, 책임 큰 일이다.","정재":"니 돈은 **조직**에서 나온다. 공공기관이든 큰 회사든 어디 가도 무난하다. 꼬박꼬박 쌓는 돈이다.","정관":"니 돈은 **조직**에서 나온다. 공공기관이든 큰 회사든 어디 가도 무난하다. 꼬박꼬박 쌓는 돈이다.","정인":"니 돈은 **공부**에서 나온다. 사회가 알아주는 시험, 학위, 자격이 니 밑천이다.","편인":"니 돈은 **전문·특수 분야**에서 나온다. 남이 못 보는 걸 보는 재주다. 대신 주식 같은 건 하지 마라."},"TEEN_EARN_NOINS":" 근데 니는 받쳐 주는 기운이 없어서 큰 판이 버겁다. 배울 건 먼저 배워 둬라.","TEEN_EARN_STRUCT":{"jeong":"그라고 니는 정해진 길을 밟아 가며 크는 사람이다. 첫 돈은 월급처럼 정해진 데서 받는 게 맞다.","pyeon":"그라고 니는 니 판을 짜야 크는 사람이다. 남 밑에서 배우되 언젠가는 니 이름 걸고 하게 된다.","mix":"그라고 니는 정해진 길에서도 니 판에서도 되는 사람이다. 하나를 본업으로 잡고 하나는 옆에 둬라."},"TEEN_EL_ACT":"다섯 기운으로 보면 제일 많은 게 {name}다. 그래서 학교에서도 {habit}, 그게 니 버릇으로 나온다.","TEEN_EL_COUNT":"니 팔자 {tot} 글자를 다섯 기운으로 나누면 이렇다. **나무 {a} · 불 {b} · 흙 {c} · 쇠 {d} · 물 {e}.**","TEEN_EL_NAME":{"목":"나무(木)","화":"불(火)","토":"흙(土)","금":"쇠(金)","수":"물(水)"},"TEEN_EL_ROLE":{"비겁":"이 기운은 니한테 친구, 그라고 니 자신이다.","식상":"이 기운은 니한테 재주하고 표현이다.","재성":"이 기운은 니한테 결과하고 돈 감각이다.","관성":"이 기운은 니한테 규칙하고 선생이다.","인성":"이 기운은 니한테 배움하고 엄마다."},"TEEN_EL_SHORT":{"목":"새로 벌이는 힘","화":"드러내는 힘","토":"붙드는 힘","금":"맞고 틀린 걸 가리는 힘","수":"궁리하는 힘"},"TEEN_EL_STUDY":{"목":"글 읽고 쓰는 공부","화":"말하고 발표하는 공부","토":"꾸준히 반복하는 공부","금":"규칙 세우고 계산하는 공부","수":"생각하고 탐구하는 공부"},"TEEN_EL_TRAIT":{"목":{"0":"**나무(木)는 없다.** 나무는 뻗고 키우는 기운, 사람으로 치면 정이다. 없으니 오히려 사랑받고 싶은 마음이 크다. 받으려고 하면 서운함만 쌓인다. 먼저 그냥 줘 봐라.","1":"**나무(木)는 알맞다.** 새로 해 보고 싶은 마음이 적당히 있다. 시작할 줄 아는 아이다.","3":"**나무(木)가 많다.** 뻗어 나가는 기운이 넘친다. 하고 싶은 게 많고 일을 자꾸 새로 벌인다. 대신 하나 끝내기 전에 다음 걸 잡는다."},"화":{"0":"**불(火)은 없다.** 불은 드러내는 기운, 사람으로 치면 예의다. 없으니 속을 잘 안 보인다. 대신 오히려 튀고 싶은 마음이 속에 있다.","1":"**불(火)은 알맞다.** 드러낼 때는 드러내고 감출 때는 감출 줄 안다.","3":"**불(火)이 많다.** 드러내는 기운이 넘친다. 표정에 다 나오고 사람 앞에 서는 걸 좋아한다. 대신 확 달아올랐다 확 식는다."},"토":{"0":"**흙(土)은 없다.** 흙은 붙드는 기운, 사람으로 치면 믿음이다. 없으니 중심이 자꾸 흔들리고 자리를 못 잡는다. 대신 그래서 더 안정을 찾는다.","1":"**흙(土)은 알맞다.** 친구 사이에서 중심을 잡아 줄 줄 안다.","3":"**흙(土)이 많다.** 붙드는 기운이 넘친다. 한번 쥔 건 안 놓고 고집이 세다. 믿음직한데 속을 잘 안 보여 준다."},"금":{"0":"**쇠(金)는 없다.** 쇠는 자르는 기운, 사람으로 치면 정의다. 없으니 끊을 때 못 끊는다. 싫은 친구한테도 싫다는 말을 못 한다.","1":"**쇠(金)는 알맞다.** 맞고 틀린 걸 가릴 줄 아는데 지나치진 않다.","3":"**쇠(金)가 많다.** 자르는 기운이 넘친다. 맞다 틀리다를 끝까지 따진다. 니 정의를 친구한테 강요하면 친구가 떠난다."},"수":{"0":"**물(水)은 없다.** 물은 궁리하는 기운, 사람으로 치면 지혜다. 없으니 오히려 아는 척을 한다. 모르는 건 모른다고 말하는 게 니 숙제다.","1":"**물(水)은 알맞다.** 생각할 줄 알고 말도 잘한다. 슬기로운 아이다.","3":"**물(水)이 많다.** 궁리하는 기운이 넘친다. 아는 게 많고 말도 잘하는데, 생각이 많아서 결정을 미룬다."}},"TEEN_END1":"여기까지가 공짜다. 다음 장부터 기질, 재능, 행동, 공부, 진로 순으로 니 얘기만 골라서 한다.","TEEN_FALL":{"비겁":"니는 **니 몫 챙기다 무너진다.** 친구랑 나눠 쓰다 니 게 안 남고, 지기 싫어 무리한다.","식상":"니는 **규칙하고 부딪치다 무너진다.** 하고 싶은 말 다 하다 선생이나 학교하고 틀어진다.","재성":"니는 **공부를 놓치다 무너진다.** 눈앞 재미가 커서 배우는 자리가 밀린다.","관성":"니는 **니 자신을 몰아붙이다 무너진다.** 남 기대에 맞추느라 친구도 니 마음도 놓친다.","인성":"니는 **생각만 하다 무너진다.** 머리에 든 건 많은데 꺼내 쓰질 못한다."},"TEEN_FALL_DO":{"관성":"그해엔 다 잘하려 하지 말고 셋 중 하나는 놓아라. 쉬는 것도 공부다.","비겁":"그해엔 공부하는 시간만큼은 혼자 있어라. 친구는 그다음이다.","식상":"그해엔 시험 날짜부터 달력에 박아라. 하고 싶은 건 그다음에 해도 안 늦다.","재성":"그해엔 폰을 손 닿는 데 두지 마라. 장치가 의지보다 세다.","인성":"그해엔 계획 세우지 말고 오늘 한 쪽부터 해라. 시작이 반이 아이라 전부다."},"TEEN_FALL_NONE":"앞 5년 안엔 니 무기 자리를 정면으로 치는 해가 없다. 그래도 버릇은 버릇이다. 신호가 오면 그때 멈춰라.","TEEN_FALL_SIGN":{"관성":"신호는 이거다. 하기 싫은데 싫다는 말을 못 하고 잠이 줄어든다. 그때가 멈출 때다.","비겁":"신호는 이거다. 친구가 안 하면 니도 안 하게 된다. 그때가 니 길을 다시 볼 때다.","식상":"신호는 이거다. 해야 할 걸 미루고 딴 걸 붙잡는다. 그때가 달력을 다시 볼 때다.","재성":"신호는 이거다. 오늘만 하고 그만한다는 말이 사흘째다. 그때가 장치를 걸 때다.","인성":"신호는 이거다. 계획을 세 번째 다시 짠다. 그때가 그냥 시작할 때다."},"TEEN_FALL_YEARS":"앞으로 이게 터지기 쉬운 해는 **{yrs}년**이다. 그해 기운이 니 무기 자리를 정면으로 치거든.","TEEN_FIELD_KEY":{"비견":"boss","겁재":"boss","식신":"식신","상관":"상관","편재":"편재","편관":"편관","정재":"org","정관":"org","정인":"정인","편인":"편인"},"TEEN_FIELD_SHORT":{"비견":"니가 대장인 일","겁재":"니가 대장인 일","식신":"말·교육·창작 일","상관":"니 맛대로 하는 창작·말 일","편재":"판 큰 일","편관":"센 자리의 일","정재":"조직에서 쌓는 일","정관":"조직·공공 일","정인":"사회가 알아주는 공부 쪽 일","편인":"전문·특수 분야 일"},"TEEN_FINISH":{"목":"하나 더. 니는 **벌여 놓고 마무리가 약한** 아이다. 하나 끝내기 전에 다음 걸 잡는다. 벌인 걸 끝내고 다음으로 가라.","화":"하나 더. 니는 **사람들 속에서 신나게 하는데 끝맺음은 약한** 아이다. 마지막 10분을 챙겨라.","금":"하나 더. 니는 **깔끔하게 마무리하는** 아이다. 시작만 해 주면 끝은 니가 낸다.","수":"하나 더. 니는 **깔끔하게 마무리하는** 아이다. 시작만 해 주면 끝은 니가 낸다."},"TEEN_FIRST_MONEY":"니 힘으로 처음 돈 맛을 제대로 보는 해는 **{yy}년, {age}세**다. 그해엔 돈이 니 손에 붙는다. 그때 번 첫 돈은 쓰지 말고 반은 묶어 둬라.","TEEN_FIRST_MONEY_NONE":"스무 살 넘어 10년 안엔 돈이 확 붙는 해가 따로 없다. 니 돈은 한 방이 아니라 쌓여서 오는 돈이다.","TEEN_FLOW_SHAPE":{"생":"그라고 니는 **시작은 잘하는 아이**다. 새 학기, 새 학원, 새 취미에 제일 먼저 신난다. 대신 벌여 놓고 끝을 못 맺는 버릇이 있제?","왕":"그라고 니는 **한창 달릴 때 제일 잘하는 아이**다. 일단 붙으면 집중해서 해낸다. 대신 시작하고 정리할 땐 누가 옆에서 밀어 줘야 움직인다.","고":"그라고 니는 **정리는 잘하는데 시작이 느린 아이**다. 숙제도 마감이 다가와야 손이 간다. 생각만 하다 하루 가는 거, 맞제?","생왕":"그라고 니는 벌이고 달리는 건 잘하는데 **마무리가 약하다.** 늘 바쁜데 끝난 게 별로 없다.","생고":"그라고 니는 시작하고 접는 건 하는데 **한창 달리는 힘은 따로 와야 한다.** 재밌을 때만 확 붙는다.","왕고":"그라고 니는 하던 걸 잘 마무리한다. 대신 **새로 시작하는 게 제일 어렵다.** 새 반, 새 학원 첫날이 힘들다.","생왕고":"그라고 니는 벌이고 달리고 마무리하는 걸 **혼자 다 하는 아이**다. 대신 한쪽에 꽂히면 다른 걸 다 놓친다."},"TEEN_FORMULA":{"both":"니 팔자 {tot} 글자 중에 {n} 자가 {name}다. 그런데 {mname}은 한 자도 없다. 한마디로 니는 **{adj} 아이인데, {madj} 아이**다.","many":"니 팔자 {tot} 글자 중에 {n} 자가 {name}다. 한마디로 니는 **{adj} 아이**다.","miss":"니 팔자엔 {mname}이 한 자도 없다. 한마디로 니는 **{madj} 아이**다.","none":"니 팔자엔 다섯 기운이 고르게 다 있다. 한마디로 니는 **어디 가도 적응하는 아이**다. 대신 하나에 깊이 빠지는 건 니가 골라야 한다."},"TEEN_FRIEND":{"0":"니 팔자엔 니 같은 또래 기운이 없다. 그래서 남을 동급으로 잘 안 친다. 먼저 인정해 줘라. 맞는 친구 한 명이면 된다.","1":"니 팔자엔 또래 기운이 알맞게 있다. 친구하고 어깨 견주며 가는 쪽이다. 경쟁이 니를 키운다.","3":"니 팔자엔 또래 기운이 많다. 경쟁에 질리기 쉽다. 정리하고 진짜 한 명만 남겨라. 그라고 이런 팔자는 엄마가 고생한다. 엄마한테 잘해라."},"TEEN_FRIEND_MONEY":{"0":"친구한테 돈 새는 일은 적다. 대신 니 돈 니가 다 쓴다.","1":"친구한테 쓰는 돈은 적당하다. 사 줄 땐 사 주고 받을 땐 받는다.","3":"친구한테 돈이 잘 샌다. 사 주고 빌려주고. 빌려준 돈은 못 받는다 치고 줘라."},"TEEN_FUTURE":"커서 일로 치면 {jobs} 쪽이 잘 붙는다.","TEEN_GEOB":{"yang":"그라고 니 속엔 **또 다른 니**가 하나 산다. 겉은 세 보이는데 속은 여리다. 센 척 뒤에 상처를 숨긴다.","yin":"그라고 니 속엔 **또 다른 니**가 하나 산다. 겉은 여려 보이는데 속에 센 놈이 산다. 얕보고 건드렸다간 다들 놀란다."},"TEEN_GEOB_EXAM":" 그라고 니 속의 승부욕이 이 해에 터지고 싶어 한다. 시험·대회엔 써라. 그만두는 결정은 한 해 미뤄라.","TEEN_GRADE":{"8":"초1","9":"초2","10":"초3","11":"초4","12":"초5","13":"초6","14":"중1","15":"중2","16":"중3","17":"고1","18":"고2","19":"고3","20":"스무 살"},"TEEN_GROUP_NAME":{"비겁":"니 같은 기운","식상":"꺼내는 기운","재성":"결과 챙기는 기운","관성":"규칙 기운","인성":"받쳐 주는 기운"},"TEEN_GROUP_TRAIT":{"비겁":"자존심이 세고 지기 싫어한다. 대신 니 편은 끝까지 챙기는 의리가 있다.","식상":"표현하고 만들고 노는 게 좋다. 호기심이 많고 가만있으면 좀이 쑤신다.","재성":"현실 감각이 빠르다. 갖고 싶은 게 분명하고 셈이 빠르다.","관성":"책임감이 세다. 규칙을 지키고 인정받고 싶어 한다.","인성":"생각이 깊고 배우는 걸 좋아한다. 대신 기댈 데를 찾는다."},"TEEN_GUESS":{"식신":"니, 뭘 만들거나 그리거나 꾸미는 거 좋아하제? 가만히 듣는 수업보다 손으로 해 보는 시간이 편한 쪽.","상관":"니, 말 잘한다는 소리 듣제? 발표든 토론이든 수다든 입이 먼저 나가는 쪽. 말대꾸한다고 혼난 적도 있을 기라.","편재":"니, 친구들 사이에서 판 벌이는 애제? 놀러 갈 데 정하고 사람 모으고, 일을 크게 벌이는 쪽.","정재":"니, 할 거 미리미리 해 놓는 애제? 벼락치기보다 날마다 조금씩 쌓는 쪽. 계획표 쓰면 칸을 꽉 채우고.","편관":"니, 힘든 거 맡아서 버티는 애제? 운동이든 맡은 일이든, 남들 빡세서 안 하는 걸 하는 쪽.","정관":"니, 규칙 잘 지키는 애제? 선생님한테 믿을 만하다는 소리 듣고, 맡은 건 끝까지 하는 쪽.","편인":"니, 남들 잘 모르는 거에 빠지는 애제? 혼자 파고든 게 하나 있고, 거기선 니가 제일 잘 아는 쪽.","정인":"니, 배우는 거 싫지 않은 애제? 차근차근 정리해서 외우고, 친구한테 설명도 잘해 주는 쪽.","비견":"니, 친구들하고 몰려다니는 애제? 혼자보다 여럿이 편하고, 같은 거 하는 친구하고 은근히 겨루는 쪽.","겁재":"니, 지는 거 못 참는 애제? 평소엔 얌전한데 시합이나 내기만 붙으면 사람이 달라지는 쪽."},"TEEN_HABIT":{"0":"니 팔자엔 돈 기운이 없다. 그래서 돈이 손에 오면 금방 사라진다. 그릇이 없으니 장치를 만들어야 된다. 용돈 받는 날 반을 딴 데 옮겨 놔라.","1":"니 팔자엔 돈 기운이 알맞게 있다. 쓸 데 쓰고 남길 줄 아는 쪽이다. 지금 버릇 그대로 가면 된다.","3":"니 팔자엔 돈 기운이 많다. 갖고 싶은 것도 많고 쓰는 것도 크다. 사기 전에 하루만 참는 버릇을 들여라."},"TEEN_HELP_NONE":"앞 5년 안엔 운이 니 힘에 딱 맞게 들어오는 해가 드물다. 그러니 니가 먼저 물어볼 사람을 정해 둬라.","TEEN_HELP_YEARS":"앞 5년 중 **{yrs}년**엔 운이 니 힘에 맞게 들어온다. 버티던 게 풀리는 해다. 힘든 일은 그해에 털어놔라.","TEEN_IMG":{"0":"큰 나무다","1":"덩굴 화초다","2":"한낮의 해다","3":"촛불이다","4":"큰 산이다","5":"논밭이다","6":"무쇠다","7":"보석이다","8":"큰 바다다","9":"시냇물이다"},"TEEN_IMP_RE":"(해|마|둬|봐|줘|써|워|와|켜|꺼|파|가|려|내|세|겨|러|춰|져|놔|어|아|빼|쳐|대|서|펴|라|녀|혀|뎌|쳐)라$","TEEN_INOUT":{"same":"그라고 니는 **겉과 속이 같은 아이**다. 생각한 대로 행동한다. 좋고 싫은 게 너무 분명해서 맞는 친구한텐 최고고 안 맞는 친구한텐 버겁다.","opp":"그라고 니는 **겉과 속의 계절이 반대인 아이**다. 몸은 여름인데 생각은 겨울이다. 기분이 오르내리는 게 그래서다."},"TEEN_INS":{"use":{"식상":"그라고 니는 배운 게 쓰이는 사람이다. 배운 걸 말하고 가르치고 풀어낼 때 머리에 박힌다. 친구한테 설명해 주면서 공부해라.","재성":"그라고 니는 배운 게 쓰이는 사람이다. 어디 쓰이는지 보여야 머리에 들어간다. 이걸 배워 뭐 하는지부터 알고 시작해라.","both":"그라고 니는 배운 게 쓰이는 사람이다. 배운 걸 말로도 풀고 실제로도 써먹는다. 배우면 바로 써먹을 데를 찾아라.","none":"그라고 니는 머리에 넣는 건 잘하는데 꺼낼 데가 모자란다. 문제집 더 사지 말고 푼 걸 남한테 설명해 봐라. 꺼내야 니 거다."},"lean":{"식상":"그라고 니는 혼자 파기보다 기대서 배우는 사람이다. 좋은 선생 하나가 니 성적을 바꾼다. 대신 모르면 입을 열어 물어라.","재성":"그라고 니는 혼자 파기보다 기대서 배우는 사람이다. 학원이든 선생이든 맞는 데 하나에 꾸준히 붙어라. 대신 계획은 니가 짜라.","both":"그라고 니는 혼자 파기보다 기대서 배우는 사람이다. 기대도 된다. 대신 배운 건 니 말로 다시 정리해 둬라.","none":"그라고 니는 혼자 파기보다 기대서 배우는 사람이다. 도와달라는 말을 먼저 해라. 니는 그 말 해도 되는 팔자다."}},"TEEN_JOBS":{"boss":"직업으로 치면 셰프, 운동 코치, 공방·가게 사장, 기술 장인, 무대에 서는 사람 쪽이다.","식신":"직업으로 치면 선생님, 상담사, 작가, 요리 연구가, 콘텐츠 기획자 쪽이다.","상관":"직업으로 치면 작가, 영상 크리에이터, 광고 기획자, 디자이너, 배우·가수 쪽이다.","편재":"직업으로 치면 사업가, 무역·유통 전문가, 마케터, 투자 분석가 쪽이다.","편관":"직업으로 치면 경찰, 소방관, 군인, 법조인, 운동선수·감독 쪽이다.","org":"직업으로 치면 공무원, 회계사·세무사, 행정 전문가, 큰 회사 관리자 쪽이다.","정인":"직업으로 치면 교사, 교수·연구원, 의사·약사·간호사, 법조인 쪽이다.","편인":"직업으로 치면 개발자, 연구원, 예술가, 심리 상담가, 데이터 전문가 쪽이다."},"TEEN_JOB_AGE":"니는 아직 고를 때다. 지금 이름도 앞으로 생길 이름도 다 니 앞에 있다.","TEEN_JOB_END":"지금 할 일은 이거다. 위에 이름 중에 눈에 걸리는 거 두셋을 골라서 그 일 하는 사람 얘기를 찾아봐라. 해 보고 싶은 게 생기면 그게 니 길이다.","TEEN_JOB_STRUCT":{"jeong":"니는 **정해진 길에서 크는 사람**이다. 학교든 자격이든 순서대로 밟아 가는 길이 맞다.","pyeon":"니는 **니 판을 짜는 사람**이다. 남들 가는 길보다 니가 고른 길에서 빛난다. 대신 기초는 남들만큼 해 둬라.","mix":"니는 **정해진 길에서도 니 판에서도 되는 사람**이다. 하나는 학교 공부로, 하나는 니가 좋아하는 걸로 같이 가라."},"TEEN_KEEP_MANY":"없는 걸 좇지 말고 니한테 많은 걸 키워라. 그게 니 장점이다.","TEEN_KIND":{"인성":{"fit":["머리에 잘 들어가는 해","배우는 기운이 들어오는데 니 힘에 딱 맞거든. 좋은 선생이나 책을 만나기 쉽다.","진도를 앞당기고 제일 약한 과목을 이 해에 잡아라"],"unfit":["생각만 많아지는 해","배우는 기운이 들어오는데 니한텐 이미 넘치거든. 머리에 넣는 것보다 꺼내 쓰는 게 모자란다.","새로 배우기보다 문제를 많이 풀어라. 아는 걸 꺼내는 연습이다"]},"관성":{"fit":["시험에서 이름이 서는 해","평가하는 기운이 들어오는데 니 힘이 그걸 받아 낸다. 성적표가 니 편이다.","시험 일정에 맞춰 몰아서 해라. 이 해 성적이 남는다"],"unfit":["시험하고 규칙에 눌리는 해","평가하는 기운이 니 힘보다 세게 들어오거든. 해야 할 게 몰려서 숨이 막힌다.","다 잘하려 하지 말고 실수부터 줄여라. 물어볼 사람을 옆에 둬라"]},"식상":{"fit":["재주가 터져 나오는 해","재주가 밖으로 나오는 기운이 니 힘에 맞거든. 해 보면 된다.","좋아하는 거 하나를 결과물로 남겨라. 대회든 작품이든"],"unfit":["하고 싶은 것만 많고 지치는 해","재주가 밖으로 빠지는 기운인데 니 힘이 그만큼 안 받쳐 주거든. 이것저것 손대다 지친다.","하나만 골라라. 잠부터 챙겨라"]},"재성":{"fit":["바깥에서 길이 보이는 해","바깥 기운이 들어오는데 니 힘이 그걸 쥘 만하거든. 해 보고 싶은 게 현실로 보인다.","관심 가는 일을 직접 보러 가라. 체험이든 견학이든"],"unfit":["바깥에 마음이 끌려가는 해","바깥 재미가 니 힘보다 크게 들어오거든. 공부는 뒷전이 되기 쉽다.","공부 시간을 먼저 떼어 놓고 나머지로 놀아라"]},"비겁":{"fit":["친구가 힘이 되는 해","또래 기운이 들어오는데 니 힘을 받쳐 주거든. 같이 하면 오른다.","같이 공부할 친구를 만들어라"],"unfit":["친구하고 경쟁이 판을 흔드는 해","또래 기운이 니한테 이미 넘치거든. 친구 따라 흔들리고 경쟁에 지친다.","공부하는 시간만큼은 혼자 있어라"]}},"TEEN_LAYER":{"생":"새로 시작할 일이 하나 생긴다","왕":"하던 게 한창 바빠진다","고":"붙잡고 있던 게 하나 매듭지어진다","bind":"곁에 마음 맞는 친구가 붙는다","clash2":"니 몸하고 마음이 한 번 흔들린다. 잠부터 챙겨라"},"TEEN_LAYER_TXT":" 그라고 {when}엔 {txt}.","TEEN_LEAK_YEARS":"**{bad}년**엔 돈이 새는 해다. 그해엔 빌려주지 말고 큰 거 사지 마라.","TEEN_MAJOR":{"boss":"학과로 치면 조리·외식, 체육, 실용음악·공연, 기계·전기 같은 기술 쪽이다. 기술을 일찍 잡고 싶으면 특성화고나 마이스터고도 길이다. 학교 밖에선 창업 캠프나 기술 체험이 도움이 된다.","식신":"학과로 치면 교육, 상담심리, 국어국문·문예창작, 식품영양·조리, 콘텐츠 쪽이다. 학교 밖에선 독서 토론, 글쓰기, 멘토링 봉사가 도움이 된다.","상관":"학과로 치면 문예창작, 미디어커뮤니케이션, 광고홍보, 시각디자인·영상, 공연예술 쪽이다. 학교 밖에선 영상 편집, 작곡, 웹툰 같은 실기를 배워 두면 도움이 된다.","편재":"학과로 치면 경영, 무역, 경제, 유통·물류 쪽이다. 학교 밖에선 경제 교실, 창업 캠프, 직접 팔아 보는 경험이 도움이 된다.","편관":"학과로 치면 경찰행정, 소방안전, 법학, 군사학, 체육 쪽이다. 학교 밖에선 꾸준한 운동, 안전체험, 토론이 도움이 된다.","org":"학과로 치면 행정, 회계·세무, 경영정보, 법학, 산업공학 쪽이다. 학교 밖에선 컴퓨터 활용, 한국사, 학생회 활동이 도움이 된다.","정인":"학과로 치면 교대·사범대, 의약·간호, 법학, 인문학, 기초과학 쪽이다. 학교 밖에선 독서, 탐구 보고서, 경시 준비가 도움이 된다.","편인":"학과로 치면 컴퓨터·소프트웨어, 미술·음악, 심리학, 데이터·과학 연구 쪽이다. 학교 밖에선 코딩, 악기, 미술처럼 한 분야를 깊게 파는 게 도움이 된다."},"TEEN_MISS":"니 팔자엔 {el} 기운이 없다. 그래서 {study}가 처음엔 버겁다. 대신 이걸 조금씩 채우면 공부 전체가 덜 흔들린다.","TEEN_MISS_G":{"비겁":"니 팔자엔 니 같은 기운이 없다. 그래서 혼자 오래 고민하고 잘 삐진다. 없는 건 복이다. 대신 마음 터놓을 친구 하나를 둬라.","식상":"니 팔자엔 꺼내는 기운이 없다. 그래서 오히려 말이나 몸이 앞서 헛발질이 많다. 없는 건 복이다. 대신 같이 꺼내 줄 친구를 둬라.","재성":"니 팔자엔 결과 챙기는 기운이 없다. 그래서 있는 척하고 싶어진다. 없는 건 복이다. 없는 건 없다고 당당히 말해라.","관성":"니 팔자엔 니를 묶는 기운이 없다. 그래서 오히려 울타리에 집착한다. 시험 하나에 몇 년씩 매달리지 마라. 니는 자유롭게 살라고 비워 둔 거다.","인성":"니 팔자엔 받쳐 주는 기운이 없다. 그래서 오히려 공부·자격증에 집착한다. 많이 따는 것보다 하나를 제대로 써먹어라. 없는 건 복이다."},"TEEN_MOM":{"비겁":"엄마 자리엔 **니랑 닮은 기운**이 앉았다. 엄마가 니를 친구처럼 대한다. 편한 대신 부딪칠 땐 또래처럼 부딪친다.","식상":"엄마 자리엔 **재주 기운**이 앉았다. 엄마가 하고 싶은 걸 해 보게 두는 쪽이다. 그 덕에 표현이 자란다.","재성":"엄마 자리엔 **살림 챙기는 기운**이 앉았다. 엄마가 현실적이고 야무지다. 니 돈 감각이 거기서 큰다.","관성":"엄마 자리엔 **규칙 기운**이 앉았다. 엄마가 엄하게 키우는 쪽이다. 답답해도 그게 니 버티는 힘이 된다.","인성":"엄마 자리엔 **챙겨 주는 기운**이 앉았다. 엄마가 가르치고 받쳐 준다. 기대도 되는 엄마다."},"TEEN_MONEY_FLAT":"앞 5년 안엔 돈이 크게 붙는 해도 크게 새는 해도 없다. 그러니 버릇이 전부다. 지금 드는 버릇이 그대로 커서까지 간다.","TEEN_MONEY_YEARS":"앞 5년 중엔 **{good}년**이 돈이 손에 붙는 해다. 용돈이든 알바든 들어오는 게 있다.","TEEN_NOW3":{"인성":["**친구.** 조용한 친구가 맞는다. 무리보다 한둘이다.","**집.** 엄마 쪽 일이 많아진다. 도움도 잔소리도 같이 온다.","**몸.** 앉아 있는 시간이 늘어난다. 하루 한 번은 걸어라."],"관성":["**친구.** 선배나 윗사람하고 부딪치기 쉽다. 말 한마디 조심해라.","**집.** 집에서 잔소리가 는다. 받아치지 마라.","**몸.** 잔병하고 피로가 쌓인다. 쉬는 날을 먼저 박아라."],"식상":["**친구.** 말이 많아지는 해다. 뒷말 조심해라.","**집.** 하고 싶은 걸 말하는 해다. 우기지 말고 설득해라.","**몸.** 먹는 게 늘고 살이 붙기 쉽다."],"재성":["**친구.** 노는 물이 넓어진다. 새 친구가 많이 붙는다.","**집.** 갖고 싶은 게 늘어서 용돈 갖고 부딪친다.","**몸.** 바쁘게 돌아다닌다. 무리만 하지 마라."],"비겁":["**친구.** 친구가 전부다. 누구랑 어울리냐가 성적을 바꾼다.","**집.** 형제나 또래 일로 신경 쓸 일이 있다.","**몸.** 힘이 넘친다. 운동으로 빼라."]},"TEEN_NOW4":{"인성":["**공부.** 머리에 잘 들어가는 해다. 어려운 과목을 잡아라.","**친구.** 조용한 친구가 맞는다. 무리보다 한둘이다.","**집.** 엄마 쪽 도움이 크다. 기대도 된다.","**몸.** 무난하다. 잠만 줄이지 마라."],"관성":["**공부.** 시험이 몰리고 압박이 세다. 실수부터 줄여라.","**친구.** 선배나 윗사람하고 부딪치기 쉽다. 말 한마디 조심해라.","**집.** 집에서 잔소리가 는다. 받아치지 마라.","**몸.** 잔병하고 피로가 쌓인다. 쉬는 날을 먼저 박아라."],"식상":["**공부.** 수업이 답답하다. 좋아하는 거 하나로 숨통을 틔워라.","**친구.** 말이 많아지는 해다. 뒷말 조심해라.","**집.** 하고 싶은 걸 말하는 해다. 우기지 말고 설득해라.","**몸.** 먹는 게 늘고 살이 붙기 쉽다."],"재성":["**공부.** 딴 데 마음이 간다. 공부 시간부터 떼어 놔라.","**친구.** 노는 물이 넓어진다. 새 친구가 많이 붙는다.","**집.** 갖고 싶은 게 늘어서 용돈 갖고 부딪친다.","**몸.** 바쁘게 돌아다닌다. 무리만 하지 마라."],"비겁":["**공부.** 경쟁이 붙는 해다. 라이벌을 연료로 써라.","**친구.** 친구가 전부다. 누구랑 어울리냐가 성적을 바꾼다.","**집.** 형제나 또래 일로 신경 쓸 일이 있다.","**몸.** 힘이 넘친다. 운동으로 빼라."]},"TEEN_NOW_HEAD":"그라고 **올해 {yy}년.** 올해 뭐가 우째 움직이노? 하나씩 간다.","TEEN_NOW_PEOPLE":"**사람·몸.** {txt}.","TEEN_NOW_STUDY":"**공부.** {name}다. {do}.","TEEN_ORDER":[1,11,15,16,17,2,12,3,4,5,6,7],"TEEN_ORDER_P":[1,11,15,16,17,2,12,3,4,13,5,6,7],"TEEN_PARENT_DO":"아이한테 이렇게 일러 줘라. \"{t}\"","TEEN_PARENT_NOTE":"보호자가 본다 캐서 아이 얘기를 보호자한테 한다. 아래 「해라」는 아이한테 그대로 전해 주라. 이 글을 아이한테 보여 줘도 된다.","TEEN_PARENT_PRE":[["아이다","아니다"],["아이라 ","아니라 "]],"TEEN_PARENT_RE":"(?<![가-힣])니(?=가|는|를|한테|한텐|랑|도|만|하고|보다|처럼|만큼|[^가-힣]|$)","TEEN_PARENT_SWAP":[["모르면 「잘 모르니 알려 달라」고 먼저 부탁해라. 니는 그 말을 잘 못 해서 괜히 거만하다는 오해를 받는다.","아이한테 꼭 알려 줘라. \"모르면 꼭 모른다고 말해라.\" 이 아이는 그 말을 잘 못 해서 괜히 거만하다는 오해를 받는다."],["니 자신","자기 자신"],["니 같은 기운","자기 같은 기운"]],"TEEN_PAR_END":"엄마·아버지는 고를 수 없다. 대신 어떻게 지낼지는 고를 수 있다. 이 편은 그거 알라고 있는 거다.","TEEN_PAR_HEAD":"엄마·아버지 얘기다. 팔자 표에서 태어난 달 윗글자가 아버지 자리, 아랫글자가 엄마 자리다. 아버지한테선 타고난 성질을 받고, 엄마한테선 크는 환경을 받는다.","TEEN_PAST":{"인성":"배우는 게 잘 들어오던 해다. 좋은 선생을 만났거나 칭찬받은 기억이 있을 기라.","관성":"눌리던 해다. 규칙, 혼나는 일, 시험 압박이 컸을 기라.","식상":"하고 싶은 게 많던 해다. 말대꾸가 늘었거나 새로 빠진 게 있었을 기라.","재성":"바깥에 마음이 가던 해다. 노는 물이 넓어지고 갖고 싶은 게 많았을 기라.","비겁":"친구가 전부이던 해다. 친구 따라 움직이고 친구 때문에 속상했을 기라."},"TEEN_PAST_EV":{"인성":"몸이 처지고 움직이기 싫었을 기라. 대신 머리에 든 건 늘었다.","식상":"학교 규칙이나 선생하고 부딪친 일이 있었을 기라.","재성":"시험 걱정이 컸거나 엄마하고 자주 부딪쳤을 기라.","관성":"친구나 형제 일로 속 끓였을 기라. 결국 니 자신하고 싸운 해다.","비겁":"용돈이든 물건이든 니 몫이 새 나갔을 기라.","clash":"반이든 집이든 친구든 뭔가 갈라진 일이 있었을 기라."},"TEEN_PATH_MORE":"니 공부 스타일은 五편, 해마다 키울 건 七편에 있다.","TEEN_PATH_NONE":"앞 7년 안엔 진로가 딱 정해지는 해가 안 보인다. 그라니 서두르지 말고, 맞는 걸 찾을 때까지 넓게 해 봐라.","TEEN_PATH_TOP":"**진로는 {yy}년에 가닥이 잡힌다.** {why}","TEEN_PATH_TYPE":{"gyeok":"그라고 니는 **깔린 길을 가는 사람**이다. 부모나 학교가 깔아 준 길이 맞다. 싫어도 해야 할 걸 해내는 쪽이고, 늦게 독립해도 된다.","eokbu":"그라고 니는 **스스로 길을 찾는 사람**이다. 남이 정해 준 길보다 니가 고른 길에서 산다. 빨리 독립하는 게 맞고, 진로가 바뀌는 신호는 니가 새 공부를 시작할 때다."},"TEEN_PEAK":"커서 일복이 제일 두터운 10년은 **{a1}세부터**다. 지금부터 깔아 둔 게 그때 터진다.","TEEN_PEOPLE_END":"사람 운은 고르는 사람 몫이다. 니를 끌어올려 주는 사람 곁에 앉아라.","TEEN_PEOPLE_HEAD":"**사람 얘기다.** 짝은 아직 이르다. 지금은 친구하고 선생, 선후배가 니 판을 만든다.","TEEN_PEOPLE_MAP":"니 주변 어른 중에 이런 사람을 알아 두고 가까이 둬라. 담임이든 학원 선생이든 친척 어른이든 상관없다. 그 사람 생일을 만세력에 넣어 태어난 날 윗글자가 {gwan}이면 니 고삐 잡아 줄 사람이고, {ins}이면 막힐 때 물어볼 사람이다.","TEEN_PEOPLE_ROW":"**{lab}**엔 {head} {why} {ev} {do}","TEEN_PEOPLE_Y":{"인성":"몸이 처지고 움직이기 싫어지는 해다. 운동 하나는 붙들어라","식상":"선생이나 학교 규칙하고 부딪치기 쉬운 해다. 말 한마디 조심해라","재성":"엄마하고 부딪치기 쉽고 시험 걱정이 큰 해다. 엄마한테 먼저 말을 걸어라","관성":"친구나 형제 일로 속 끓는 해다. 남 탓 말고 니 마음부터 봐라","비겁":"용돈이든 물건이든 친구하고 얽히는 해다. 빌려주지 마라"},"TEEN_PEOPLE_Y2":{"비겁":["친구하고 돈이 얽히는 해다.","그해엔 니랑 같은 기운이 들어오거든. 같은 기운이 늘면 나눠 먹을 몫이 준다.","그래서 용돈이든 물건이든 친구하고 얽히고 서운한 일이 생긴다.","빌려주지 말고, 같이 쓰는 돈은 미리 정해라"],"식상":["선생이나 학교 규칙하고 부딪치기 쉬운 해다.","그해엔 재주하고 말이 밖으로 나오는 기운이 들어오는데, 이 기운이 니를 묶는 규칙 쪽을 치거든.","그래서 하고 싶은 말이 늘고 선생 말에 토를 달게 된다.","말하기 전에 한 번 삼키고, 할 말은 정리해서 해라"],"재성":["엄마하고 부딪치기 쉽고 시험 걱정이 큰 해다.","그해엔 결과를 따지는 기운이 들어오는데, 이 기운이 배우는 자리, 엄마 자리를 치거든.","그래서 성적 걱정이 커지고 엄마 잔소리가 늘어난다.","엄마한테 먼저 말을 걸고, 성적 얘기는 날 잡아서 차분히 해라"],"관성":["친구나 형제 일로 속 끓는 해다.","그해엔 규칙하고 평가 기운이 들어오는데, 이 기운이 니 자신하고 친구 자리를 누르거든.","그래서 친구 일에 휘말리고 니 자신을 몰아붙이게 된다.","친구 일엔 한 발 물러서고, 남 탓 말고 니 마음부터 봐라"],"인성":["몸이 처지고 움직이기 싫어지는 해다.","그해엔 받쳐 주는 기운이 들어오는데, 이 기운이 꺼내고 움직이는 자리를 누르거든.","그래서 앉아 있는 시간만 늘고 몸이 무거워진다.","운동 하나를 붙들고, 하루 한 번은 밖에 나가라"]},"TEEN_PEOPLE_YH":"앞으로 해마다 사람 쪽은 이렇다.","TEEN_PG_DAD":{"clash":"아버지 쪽은 아이하고 부딪치기 쉬운 자리다. 아버지는 지시보다 질문으로 말해라.","bind":"아버지 쪽은 아이하고 붙어 가는 자리다. 아버지가 보여 주는 모습을 아이가 그대로 닮는다.","calm":"아버지 쪽은 크게 부딪치지 않는 자리다."},"TEEN_PG_END":"부모가 할 일은 길을 대신 걷는 게 아니라 옆에서 같이 걷는 거다. 아이는 그걸 다 기억한다.","TEEN_PG_FIELD":"이 아이 분야는 **{field}** 쪽이다. 학원이나 체험을 고를 땐 이쪽으로 골라라. {out}","TEEN_PG_HEAD":"이 편은 보호자 몫이다. 이 아이를 우째 키우면 좋은지, 팔자대로 짚어 준다.","TEEN_PG_MISS":{"비겁":"이 아이 팔자엔 **또래 기운이 없다.** 친구 사귈 판을 부모가 깔아 줘라. 운동 클럽이나 동아리처럼 같이 땀 흘리는 데가 좋다.","식상":"이 아이 팔자엔 **꺼내는 기운이 없다.** 말로 꺼낼 기회를 만들어 줘라. 저녁 먹을 때 오늘 있었던 일 하나씩 말하기 같은 거.","재성":"이 아이 팔자엔 **결과 챙기는 기운이 없다.** 용돈 기입장으로 돈 관리를 일찍 가르쳐라.","관성":"이 아이 팔자엔 **묶는 기운이 없다.** 자는 시간, 폰 끄는 시간 같은 생활 규칙 세 개만 같이 정해라.","인성":"이 아이 팔자엔 **받쳐 주는 기운이 없다.** 기댈 어른 하나를 부모가 찾아 줘라. 담임이든 학원 선생이든 친척이든."},"TEEN_PG_MISS_NONE":"이 아이 팔자엔 **다섯 기운이 고르게 있다.** 하나를 깊이 파게 도와라. 이것저것 다 시키면 어중간해진다.","TEEN_PG_MOM":{"clash":"엄마 자리하고 아이 자리가 **부딪치는 자리**다. 엄마 말이 잔소리로 들리기 쉽다. 잔소리는 한 번에 하나만, 날 잡아서 해라.","bind":"엄마 자리하고 아이 자리가 **붙어 있는 자리**다. 엄마 말이 아이한테 크게 들어간다. 그만큼 말 한마디를 골라서 해라.","calm":"엄마 자리하고 아이 자리는 **크게 부딪치지 않는 자리**다. 지금처럼 편하게 대해도 된다."},"TEEN_PG_POWER":{"강":"이 아이는 **생각이 많아 힘들면 방으로 들어가는 아이**다. 그럴 때 캐묻지 말고 같이 걷거나 뭘 같이 만들어라. 손을 쓰게 하면 풀린다. 이렇게 말해 줘라. \"생각은 나중에 하고 나가서 한 바퀴 걷자.\"","왕":"이 아이는 **기운이 넘쳐 가만두면 짜증이 되는 아이**다. 운동 하나는 꼭 시켜라. 힘들 땐 대신 해 주지 말고 직접 하게 둬라. 이렇게 말해 줘라. \"니가 직접 해 봐라. 막히면 그때 불러라.\"","쇠":"이 아이는 **내놓느라 지치는 아이**다. 일정을 더 넣기 전에 빼 줘라. 학원 수를 줄이고 잠을 지켜 주는 게 부모 몫이다. 이렇게 말해 줘라. \"이번 주는 하나 쉬자. 쉬는 것도 공부다.\"","약":"이 아이는 **눌리면 혼자 참는 아이**다. 힘들면 말하라는 한마디보다 하루 10분 같이 있는 시간이 낫다. 부모가 그 말할 사람이 돼 줘라. 이렇게 말해 줘라. \"요즘 제일 힘든 거 하나만 말해 봐라.\""},"TEEN_PG_WAY":{"gyeok":"이 아이는 **깔린 길을 가는 아이**다. 부모가 길을 깔아 주는 게 맞다. 학교, 학원, 일정을 같이 정해 주고 꾸준히 가게 옆에서 받쳐라. 이렇게 말해 줘라. \"정한 건 끝까지 해 보자. 엄마 아빠가 옆에 있다.\"","eokbu":"이 아이는 **스스로 길을 찾는 아이**다. 부모가 정해 준 길은 오래 못 간다. 고르는 건 아이가 하게 두고, 부모는 해 보게 해 주는 쪽으로 서라. 새 공부를 하겠다고 하면 그게 진로가 바뀌는 신호다. 이렇게 말해 줘라. \"니가 골라 봐라. 해 보고 아니면 바꾸면 된다.\""},"TEEN_PG_YEARS":"**{yrs}년**은 아이 자리가 흔들리는 해다. 그해엔 전학이나 학원 바꾸기 같은 큰 결정은 미루고, 하던 걸 지키게 도와라.","TEEN_PG_YEARS_NONE":"앞 5년 안엔 아이 자리가 크게 흔들리는 해는 없다. 그러니 계획을 세웠으면 밀고 가도 된다.","TEEN_POS_NAME":{"년":"해","월":"달","일":"날","시":"시"},"TEEN_POS_TXT":" 태어난 {pos}에 앉아 있다.","TEEN_REL":{"clash":"그라고 {who} 자리하고 니 자리가 부딪친다. {who}하고는 자주 부딪칠 수 있다. 미워서가 아니라 자리가 그런 기라. 한 발 떨어져 있는 게 서로 편하다.","bind":"그라고 {who} 자리하고 니 자리가 붙어 있다. {who}하고는 싫든 좋든 떨어지기 어렵다. 그만큼 영향도 크다.","calm":"{who}하고는 크게 부딪칠 자리는 아니다."},"TEEN_REST":{"강":"니는 **머리에 든 게 많은 아이**다. 받쳐 주는 기운이 많아서 힘이 생각하고 배우는 쪽으로 쏠린다. 그래서 힘들면 방에 들어가 생각만 더 한다. 걱정이 걱정을 낳는다. 그럴 땐 머리 말고 손을 써라. 일기 쓰기, 친구한테 털어놓기, 그림이든 운동이든 뭐라도 밖으로 꺼내면 풀린다.","왕":"니는 **니 힘으로 서는 아이**다. 니랑 같은 기운이 받쳐 줘서 기운이 넘친다. 그래서 힘들 때 가만히 있으면 그 힘이 짜증이 되고 옆 사람한테 튄다. 그럴 땐 몸을 써라. 뛰고, 운동하고, 직접 부딪쳐서 풀어라. 누가 대신 해 주길 기다리면 더 답답해진다.","쇠":"니는 **내놓느라 지치는 아이**다. 팔자에 재주하고 말 기운이 많아서 힘이 자꾸 밖으로 나간다. 말하고, 만들고, 남 챙기고, 노는 데 다 쓴다. 쓰는 만큼 채우질 못하니 어느 날 갑자기 방전된다. 신호는 이거다. 말수가 줄고, 아침에 못 일어나고, 좋아하던 것도 귀찮아진다. 그럴 땐 일정을 더 넣지 말고 빼라. 학원 하나는 쉬고, 9시간은 자고, 밥은 거르지 말고, 일주일에 하루는 아무것도 안 하는 날로 비워 둬라. 채워야 또 내놓는다.","약":"니는 **눌리면 혼자 버티는 아이**다. 팔자에 규칙하고 평가 기운이 많아서 늘 뭔가에 눌려 있다. 그래서 힘들어도 티를 안 내고 혼자 참다가 한 번에 무너진다. 그럴 땐 사람을 세워라. 담임이든 엄마든 친한 선배든, 「요즘 이게 힘들다」고 말할 사람 하나를 정해 둬라. 혼자 해결하려 하지 마라."},"TEEN_REVIVE":"바닥을 찍으면 올라간다. **{yy}년**엔 다시 살아난다.","TEEN_RX_FMT":"{i}. **{head}.** 와 그렇노? {why} 우짜면 되노? {do} {gain}","TEEN_RX_HEAD":"처방은 세 개다. 니 팔자에 맞춘 거라 남한테는 안 맞는다.","TEEN_RX_MANY":{"관성":"**다 잘하려 하지 마라.** 니는 맡은 걸 다 지고 간다. 하나는 내려놔도 된다.","비겁":"**엄마한테 잘해라.** 니 같은 기운이 많은 팔자는 엄마가 고생한다. 그라고 친구는 한 명만 깊게.","식상":"**니 몸부터 챙겨라.** 내놓는 기운이 많아서 니가 먼저 지친다. 잠이 첫째다.","재성":"**장치를 만들어라.** 니 의지보다 폰 끄는 시간, 용돈 나누는 통장이 세다.","인성":"**생각보다 손을 먼저 움직여라.** 계획은 한 줄이면 된다. 오늘 할 거 하나만 해라."},"TEEN_RX_MANY2":{"비겁":["친구는 한 명만 깊게 사귀어라","니 팔자 {tot} 글자 중에 니 같은 기운이 {n} 자다. 경쟁하고 나눠 쓰느라 니 몫이 샌다.","무리 단톡방 알림은 끄고, 진짜 친한 친구 한 명하고 주말을 보내라. 엄마한테는 하루 한 번 먼저 말을 걸어라.","그라모 친구 때문에 흔들리는 일이 줄고 니 시간이 생긴다."],"식상":["니 몸부터 챙겨라","니 팔자 {tot} 글자 중에 꺼내고 내놓는 기운이 {n} 자다. 힘이 자꾸 밖으로 빠진다.","학원은 하나 줄이고, 9시간은 자고, 일주일에 하루는 아무것도 안 하는 날로 비워 둬라.","그라모 재주가 오래 간다. 지쳐서 접는 일이 없어진다."],"재성":["폰하고 용돈에 장치를 걸어라","니 팔자 {tot} 글자 중에 바깥 재미하고 결과 챙기는 기운이 {n} 자다. 의지보다 눈앞 재미가 세다.","공부할 땐 폰을 다른 방에 두고, 용돈은 받는 날 반을 저금 통장으로 옮겨라.","그라모 공부 시간이 지켜지고 돈 버릇이 일찍 잡힌다."],"관성":["다 잘하려 하지 마라","니 팔자 {tot} 글자 중에 니를 누르는 기운이 {n} 자다. 맡은 걸 다 지고 가는 팔자란 말이다.","숙제든 학원이든 셋 중 하나는 「이번엔 못 한다」고 말해라. 거절도 연습이다.","그라모 잠이 돌아오고 하는 것마다 더 잘된다."],"인성":["생각보다 손을 먼저 움직여라","니 팔자 {tot} 글자 중에 받쳐 주는 기운이 {n} 자다. 머리에 넣는 건 잘하는데 꺼내는 게 늦다.","계획표는 한 줄만 쓰고, 오늘 할 거 하나를 저녁 먹기 전에 끝내라. 배운 건 동생이나 친구한테 설명해 봐라.","그라모 아는 게 성적으로 나온다."]},"TEEN_RX_MISS":{"목":"**새로 시작하는 걸 겁내지 마라.** 첫발이 무거운 팔자다. 작게라도 오늘 시작해라.","화":"**니 생각을 밖으로 꺼내라.** 속에만 두는 팔자다. 발표든 글이든 한 번씩 보여 줘라.","토":"**한 군데 붙어 있어라.** 자꾸 뜨는 팔자다. 학원이든 동아리든 한 곳은 끝까지 가라.","금":"**끊을 건 끊어라.** 못 끊는 팔자다. 안 맞는 친구, 안 되는 공부법은 정리해라.","수":"**물어볼 사람을 정해라.** 받쳐 줄 데가 없는 팔자다. 선생 하나, 선배 하나를 정해 놓고 막힐 때 물어라."},"TEEN_RX_MISS2":{"비겁":["마음 터놓을 친구 하나를 만들어라","니 팔자엔 니 같은 기운이 한 자도 없다. 그래서 혼자 오래 고민하고 잘 삐진다.","동아리든 운동이든 같이 하는 걸 하나 해라. 같이 땀 흘리면 친구가 생긴다.","그라모 혼자 끙끙대던 게 반으로 준다."],"식상":["꺼내는 연습을 해라","니 팔자엔 꺼내는 기운이 한 자도 없다. 아는데 말로 안 나온다.","하루 세 줄 일기 쓰기, 수업 시간에 한 번 손들고 말하기, 이런 작은 거부터 해라.","그라모 니가 아는 만큼 남이 알아준다."],"재성":["없는 건 없다고 말해라","니 팔자엔 결과 챙기는 기운이 한 자도 없다. 그래서 있는 척하고 싶어진다.","친구들 따라 비싼 거 사지 말고, 용돈 기입장을 써라.","그라모 돈 때문에 속 끓일 일이 없어진다."],"관성":["니 규칙을 니가 만들어라","니 팔자엔 니를 묶는 기운이 한 자도 없다. 틀이 없으니 하루가 흐트러진다.","자는 시간, 일어나는 시간, 폰 끄는 시간 세 개만 정해서 냉장고에 붙여라.","그라모 자유는 그대로인데 할 건 다 된다."],"인성":["물어볼 사람을 정해라","니 팔자엔 받쳐 주는 기운이 한 자도 없다. 기댈 데가 없으니 혼자 다 하려 든다.","모르는 게 생기면 바로 물어볼 사람 하나를 정해라. 담임이든 학원 선생이든 친척 형·누나든.","그라모 혼자 끙끙대는 시간이 확 준다."]},"TEEN_RX_MISS_G":{"비겁":"**마음 터놓을 친구 하나를 정해라.** 혼자 오래 끌어안는 팔자다.","식상":"**같이 꺼내 줄 사람을 둬라.** 혼자 하면 생각만 하다 끝난다.","재성":"**없는 건 없다고 말해라.** 있는 척하다 돈 샌다.","관성":"**울타리에 매달리지 마라.** 시험 하나에 몇 년 걸지 말고 길을 넓게 봐라.","인성":"**하나를 써먹어라.** 자격증 더 따기보다 아는 걸 꺼내 써라."},"TEEN_RX_NONE":"**니 기본값을 믿어라.** 다섯 기운이 다 있는 팔자다. 어디 가도 적응한다. 대신 하나를 골라 깊이 파라.","TEEN_RX_NONE2":["하나를 골라 깊이 파라","니 팔자엔 다섯 기운이 고르게 다 있다. 어디 가도 적응하는 대신 딱 하나 튀는 게 없다.","올해 안에 하나만 정해서 끝까지 해 봐라. 운동이든 악기든 공부 한 과목이든.","그라모 니만의 무기가 하나 생긴다."],"TEEN_RX_SEASON":"**이번 10년엔 이래 살아라.** {expl}","TEEN_RX_SEASON2":{"인성":["이번 10년은 기초를 쌓아라","지금 10년({y1}~{y2}년)은 배우는 10년이다. 받쳐 주는 기운이 길게 들어온다.","기초 과목 하나를 정해서 이 10년 동안 놓지 마라. 하루 30분 책 읽기도 좋다.","그라모 이때 쌓은 게 평생 밑천이 된다."],"관성":["이번 10년은 틀 안에서 성실하게 가라","지금 10년({y1}~{y2}년)은 틀 안에서 크는 10년이다. 규칙하고 평가가 많이 따라온다.","학교 일정, 시험 일정 안에서 성실하게 가되, 쉬는 날은 꼭 박아 둬라.","그라모 눌린 만큼 이름이 선다."],"식상":["이번 10년은 재주 하나를 결과물로 남겨라","지금 10년({y1}~{y2}년)은 재주가 터지는 10년이다. 하고 싶은 게 많아진다.","좋아하는 거 하나를 정해서 작품이든 기록이든 남겨라. 이것저것 손대면 다 어중간해진다.","그라모 그 결과물이 니 진로 명함이 된다."],"재성":["이번 10년은 공부 시간을 먼저 정하고 놀아라","지금 10년({y1}~{y2}년)은 바깥으로 뻗는 10년이다. 노는 물이 넓어진다.","공부 시간을 먼저 정하고 나머지로 놀아라. 바깥 경험은 진로 체험으로 써먹어라.","그라모 공부도 놓치지 않고 세상 보는 눈도 넓어진다."],"비겁":["이번 10년은 어울릴 친구를 골라라","지금 10년({y1}~{y2}년)은 친구하고 부대끼는 10년이다. 누구랑 어울리냐가 니 길을 바꾼다.","같이 공부하고 같이 운동할 친구를 곁에 둬라.","그라모 친구가 짐이 아니라 힘이 된다."]},"TEEN_S10_END":"여기까지다. 그 집 어른이 본 니 팔자. 맞는 건 맞고, 안 맞는 건 니 옆 사람 얘기다. 처방 세 개만 기억하고 가라. 해 바뀌면 또 온나.","TEEN_S10_HEAD":"마지막이다. 니 팔자에서 넘치는 거, 없는 거, 그라고 지금 10년에 맞춘 처방 세 개다. 남한테는 안 맞는다.","TEEN_S11_END":"제일 많은 기운이 니 무기고, 없는 기운은 니가 자유로운 자리다. 없는 걸 채우려 애쓰지 말고 많은 걸 써라.","TEEN_S11_HEAD":"다섯 기운이 사람한테 들어오면 성격이 된다. 많은 기운은 니 기본값이고, 없는 기운은 오히려 그쪽에 집착하게 만든다. 하나씩 보자.","TEEN_S13_END":"운하고 맞짱 뜨지 마라. 받아서 넘기는 놈이 오래 간다.","TEEN_S13_HEAD":"누구는 쉬어야 살고 누구는 뛰어야 산다. 니는 어느 쪽이고? 그것부터 보자.","TEEN_S13_TIP":"힘든 게 오래 가면 혼자 들고 있지 마라. 부모든 선생이든 상담 선생이든 한 사람한테는 말해라. 그게 지는 게 아이다.","TEEN_S15_END":"장기는 쓰는 놈 거다. 셋 중에 지금 제일 재밌는 거부터 써 봐라.","TEEN_S15_HEAD":"**공부 얘기부터 하자.** 요새 와 이런지, 언제 풀리는지.","TEEN_S15_PAST":"**{lab}**, {name}였다. 맞제?","TEEN_S15_ROW":"**{lab}**, {name}다. {why} **{do}.**","TEEN_S15_SUM":"정리하면 **니 장기는 셋이다.** {a}, {b}, 그라고 다섯 기운에서 나온 {c}.","TEEN_S16_END":"행동은 고치는 게 아니라 쓰는 거다. 니가 이런 아이인 줄 알면 친구하고도 선생하고도 덜 부딪친다. 버릇을 알면 그게 무기가 된다.","TEEN_S16_HEAD":"니는 {img}. 그게 학교하고 집에서 어떤 행동으로 나오나 보자.","TEEN_S2_HEAD":"진로 얘기다. 니 분야는 **{field}** 쪽이다.","TEEN_S3_END":"세 해를 나란히 놓으면 결이 보인다. 손님은 다 달랐는데 니가 받는 방식은 늘 같았을 기라.","TEEN_S3_HEAD":"지나온 몇 해를 짚어 보자. 맞나 안 맞나 니가 봐라.","TEEN_S3_ROW":"**{lab}**, {name}였다. {ev}","TEEN_S3_SEASON":"그라고 니 첫 10년 시즌은 **{yy}년, {age}세**에 시작됐다. {expl}","TEEN_S4_END":"10년 시즌은 니 거고 올해는 손님이다. 손님한테 안방 내주지 마라.","TEEN_S4_HEAD":"지금 10년하고 올해를 보자.","TEEN_S5_END":"앞날은 달력이지 판결이 아이다. 어느 해에 뭐가 오는지 알면 미리 준비할 수 있다. 그게 이 편 쓸모다.","TEEN_S5_HEAD":"인자 앞일 보자. 니 분야는 **{field}** 쪽이다. 그 분야를 준비하려면 해마다 뭘 키우면 되는지, 그해 운에 맞춰 나이별로 짚어 준다.","TEEN_S5_ROW":"**{yy}년, {age}세.** {name}다. {why} {dev}","TEEN_S5_SPAN":"**{y1}~{y2}년, {a1}~{a2}세.** {name}가 두 해 이어진다. {why} {y1}년엔 {act} {more}","TEEN_S6_END":"몸 얘기는 겁주려는 게 아이다. 신호를 알고 미리 챙기라는 거다.","TEEN_S6_HEAD":"몸 얘기다. 팔자에서 약한 기운이 몸에서 먼저 지치는 자리다. 병 이름이 아니라 신호다. 이상하면 병원 가서 확인해라.","TEEN_S9_END":"무너지는 데를 알면 안 무너진다. 니 버릇 하나만 기억해라.","TEEN_S9_HEAD":"와 잘하다 무너지노? 보자. 무너지는 애는 늘 같은 데서 무너진다.","TEEN_SCENE":{"비견":"니 팔자엔 **나란히 서는 기운**이 제일 많다. 반에 니랑 같은 걸 잘하는 애가 있으면 은근히 신경 쓴다. 같이 하면 오르고 혼자 두면 심심해한다.","겁재":"니 팔자엔 **숨은 승부 기운**이 제일 많다. 평소엔 조용한데 체육대회나 퀴즈만 붙으면 눈빛이 바뀐다.","식신":"니 팔자엔 **넉넉한 기운**이 제일 많다. 먹고 놀고 만드는 걸 좋아하고 옆 사람을 편하게 한다. 편해지면 늘어지는 게 흠이다.","상관":"니 팔자엔 **토 다는 기운**이 제일 많다. 대놓고 반항은 안 해도 속으로 「와 그래야 되는데?」를 단다. 머리 회전이 빠르다.","편재":"니 팔자엔 **판 키우는 기운**이 제일 많다. 모둠 과제를 하면 일을 크게 벌이고 친구들을 끌고 다닌다.","정재":"니 팔자엔 **꼬박꼬박 기운**이 제일 많다. 정해진 시간에 정해진 걸 한다. 계획이 틀어지면 불안해한다.","편관":"니 팔자엔 **센 기운**이 제일 많다. 무서운 선생이나 빡센 훈련 앞에서 오히려 버틴다. 대신 눌리면 속으로 쌓아 둔다.","정관":"니 팔자엔 **울타리 기운**이 제일 많다. 어딘가 속해 있어야 마음이 놓인다. 반장이든 팀이든 이름이 있는 자리가 편하다.","편인":"니 팔자엔 **혼자 파는 기운**이 제일 많다. 무슨 생각 하는지 남들이 잘 모른다. 혼자 꽂힌 거에 깊이 들어간다.","정인":"니 팔자엔 **배운 대로 하는 기운**이 제일 많다. 정해진 답을 좋아한다. 틀을 벗어나면 당황한다."},"TEEN_SEASON":{"인성":"배우는 10년이다. 받쳐 주는 어른이 붙고 공부가 몸에 붙는다. 이때 쌓은 게 평생 밑천이 된다.","관성":"틀 안에서 크는 10년이다. 규칙, 시험, 평가가 많다. 눌리는 만큼 버티는 힘이 생긴다.","식상":"재주가 터지는 10년이다. 하고 싶은 게 많고 틀에 갇히기 싫다. 그 재주를 하나로 모으는 게 숙제다.","재성":"바깥으로 뻗는 10년이다. 노는 물이 넓고 해 보고 싶은 게 많다. 공부하고 바깥 사이 줄타기가 숙제다.","비겁":"친구하고 부대끼는 10년이다. 친구가 힘도 되고 짐도 된다. 누구랑 어울리냐가 니 길을 바꾼다."},"TEEN_SEASON_NONE":"니는 아직 첫 10년 시즌이 안 왔다. {yy}년에 시작된다. 그 전엔 집안 기운을 타고 간다.","TEEN_SEASON_ROW":"지금 10년은 {y1}년부터 {y2}년까지다. {expl}","TEEN_SEASON_TURN":" 그라고 이 해에 10년 시즌이 바뀐다. 사람이 확 달라진다.","TEEN_SEASON_TURN_Y":" 그라고 {yy}년에 10년 시즌이 바뀐다. 사람이 확 달라진다.","TEEN_SEUN_EVENT":{"chung":"**{year}년에 자리가 흔들렸제.** 이사, 전학, 반 바뀜, 친구랑 갈라선 일. 그해 손님이 니 집 기둥을 정면으로 들이받았다.","편관":"**{year}년에 눌렸제.** 해야 할 거, 혼나는 일, 몸 고생. 빡센 놈이 집에 들어온 해다.","겁재":"**{year}년에 뭘 잃었거나 친구한테 서운했제.** 니 몫 가져가는 놈이 집에 온 해다.","상관":"**{year}년에 말로 사고 쳤거나 뭔가 때려치웠제.** 참던 게 터지는 해다.","식신":"**{year}년엔 먹고 만들고 노는 쪽으로 판이 갔제.** 살이 붙거나 새로 빠진 게 있거나.","편재":"**{year}년에 노는 물이 넓어졌제.** 아는 사람도 쓸 데도 많아진 해다.","정재":"**{year}년엔 생활에 틀이 잡혔제.** 꼬박꼬박 하는 게 생긴 대신 답답했던 해다.","편인":"**{year}년엔 혼자 파고들었제.** 엉뚱한 취미, 특이한 친구.","정인":"**{year}년엔 누가 받쳐 줬제.** 도와주는 어른, 상 받은 일, 붙은 시험이 있던 해다.","정관":"**{year}년에 자리나 이름이 생겼제.** 반이든 팀이든 울타리가 씌워진 해다.","비견":"**{year}년에 니 같은 놈이 붙었제.** 경쟁이든 친구든."},"TEEN_STAGE":{"중1":"중학교 첫해다. 공부 버릇이 여기서 굳는다.","중2":"제일 흔들리는 해다. 친구하고 마음이 공부보다 크다.","중3":"고등학교 고르는 해다. 어디로 갈지 니 손으로 정해라.","고1":"고등학교 첫해다. 내신 틀이 이 해에 잡힌다.","고2":"진로를 좁히는 해다. 과목 고르는 게 곧 길 고르는 거다.","고3":"입시 해다. 이 한 해는 딴 데 보지 마라.","스무 살":"스무 살, 첫 선택의 해다. 학교든 일이든 니가 고른 데서 첫발을 뗀다.","etc":"니 나이에 맞는 숙제를 하는 해다."},"TEEN_STRESS":{"비겁":"친구 일 때문에","식상":"하고 싶은 걸 못 꺼내서","재성":"성적하고 결과 걱정 때문에","관성":"규칙하고 평가에 눌려서","인성":"공부하고 엄마 일 때문에"},"TEEN_STRUCT":{"jeong":"그라고 니는 **정해진 길에서 크는 사람**이다. 교과, 자격, 시험처럼 줄 선 공부가 맞다.","pyeon":"그라고 니는 **니 식대로 파야 크는 사람**이다. 실기, 작품, 프로젝트처럼 니가 정한 공부가 맞다.","mix":"그라고 니는 **틀 안에서도 밖에서도 되는 사람**이다. 학교 공부 붙들고, 옆에 니가 좋아하는 거 하나를 파라."},"TEEN_STUDY_END":"공부는 머리보다 맞는 판이 먼저다. 맞는 판에 앉으면 머리는 따라온다.","TEEN_STUDY_HEAD":"니한테 맞는 공부 보자. 니 팔자 간판엔 **{gp}**이 떠 있다.","TEEN_STUDY_RESULT":" 니 결과 나오는 해는 {res}년이다.","TEEN_STUDY_Y":{"인성":["배우고 채우는 해","받쳐 주는 기운이 들어오는 해다. 뛰기보다 머리에 담는 때거든.","새 과목, 기초, 책을 이 해에 넣어 둬라. 넣어 둔 게 다음 재주 해에 결과로 나온다"],"식상":["배운 걸 꺼내는 해","재주가 밖으로 달리는 해다. 앉아서 외우는 시험공부는 이 해엔 잘 안 붙는다.","실기, 발표, 작품, 대회처럼 꺼내 보이는 쪽에 힘을 줘라"],"재성":["시험 걱정이 커지는 해","결과를 따지는 기운이 배우는 자리를 누르는 해다. 성적 걱정, 엄마하고 부딪칠 일이 같이 온다.","점수보다 일정 관리부터 해라. 엄마하고는 말을 아껴라"],"관성":["준비한 만큼 드러나는 해","평가하는 기운이 들어와 땀범벅으로 뛰는 해다. 해 온 사람은 확 뜨고 안 해 온 사람은 들통난다.","시험 일정에 맞춰 몰아서 해라. 이 해 성적이 남는다"],"비겁":["새로 출발하는 해","니랑 같은 기운이 들어와 출발선에 서는 해다. 또래하고 경쟁도 같이 붙는다.","마음 다잡고 새로 시작해라. 같이 갈 친구 하나를 골라라"]},"TEEN_STUDY_YEARS":"배우고 채우는 해는 **{yrs}년**이다. 그해에 넣어 둔 게 그다음 재주 해에 결과로 나온다.","TEEN_STUDY_YEARS_NONE":"앞 5년 안엔 받쳐 주는 기운이 들어오는 해가 없다. 운이 채워 주지 않으니 정해 둔 시간에 니가 채워라.","TEEN_SUHWA":"그라고 니 팔자엔 물하고 불이 같이 있다. 아는 것(지혜)하고 드러내는 것(예의)이 서로 부딪친다. 마음은 있는데 행동이 안 나오는 때가 있다. 아는 걸 하나씩 실천해라.","TEEN_TALENT_G":{"비견":"그 위에 자란 재능은 **니가 대장 노릇 하는 것**이다. 니 판을 짜면 펄펄 난다.","겁재":"그 위에 자란 재능은 **니가 대장 노릇 하는 것**이다. 니 판을 짜면 펄펄 난다.","식신":"그 위에 자란 재능은 **말하고 가르치고 만드는 것**이다. 사람하고 잘 섞인다.","상관":"그 위에 자란 재능은 **니 맛대로 표현하는 것**이다. 남한테 맞추지 않을 때 빛난다.","편재":"그 위에 자란 재능은 **판을 크게 굴리는 것**이다. 사람과 물건을 움직일 줄 안다.","정재":"그 위에 자란 재능은 **꼼꼼하게 챙기는 것**이다. 맡기면 틀림없다.","편관":"그 위에 자란 재능은 **센 일을 버텨 내는 것**이다. 남들 힘들어하는 데서 큰다.","정관":"그 위에 자란 재능은 **틀 안에서 인정받는 것**이다. 규칙이 있는 데서 잘한다.","정인":"그 위에 자란 재능은 **사회가 알아주는 공부**다. 시험, 자격, 학위 쪽에 강하다.","편인":"그 위에 자란 재능은 **남이 못 보는 걸 보는 눈**이다. 전문 분야, 특수한 쪽에 강하다."},"TEEN_TALENT_SHORT":{"비견":"니가 대장 노릇 하는 것","겁재":"니가 대장 노릇 하는 것","식신":"말하고 가르치고 만드는 것","상관":"니 맛대로 표현하는 것","편재":"판을 크게 굴리는 것","정재":"꼼꼼하게 챙기는 것","편관":"센 일을 버텨 내는 것","정관":"틀 안에서 인정받는 것","정인":"사회가 알아주는 공부","편인":"남이 못 보는 걸 보는 눈"},"TEEN_TEACHER":{"0":"받쳐 주는 기운이 없다. 그러니 니한테 투자해라. 책이든 수업이든. 모르면 「잘 모르니 알려 달라」고 먼저 부탁해라. 니는 그 말을 잘 못 해서 괜히 거만하다는 오해를 받는다.","1":"받쳐 주는 기운이 있다. 기댈 어른이 있는 팔자다. 잘 맞는 선생이 있으면 그 선생한테 자주 물어라.","3":"받쳐 주는 기운이 많다. 기댈 데가 많은 팔자다. 대신 듣기만 하지 말고 배운 걸 꺼내 써라."},"TEEN_TEASE1":"{ord}, 다섯 기운으로 보면 니는 **{adj} 아이**다. 그게 학교에서 우째 나오는지는 二편에 있다.","TEEN_TEASE2":"{ord}, 니 장기는 **{short}**이다. 그게 뭘로 꽃피는지는 三편에 있다.","TEEN_TEASE3":{"yes":"{ord}, 진로로 보면 **{yy}년에 갈 길이 한 번 크게 잡힌다.** 와 그해인지는 六편에 있다.","no":"{ord}, 진로로 보면 앞 7년 안엔 길이 확 정해지는 해가 없다. 그라모 우째 고르노? 그건 六편에 있다."},"TEEN_TEASE_PATH":{"yes":"{ord}, 진로로 보면 **{yy}년에 갈 길이 한 번 크게 잡힌다.** 와 그해인지는 바로 다음 장에 있다.","no":"{ord}, 진로로 보면 앞 7년 안엔 길이 확 정해지는 해가 없다. 그라모 우째 고르노? 그건 바로 다음 장에 있다."},"TEEN_TEASE_STUDY
