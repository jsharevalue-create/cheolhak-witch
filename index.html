<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<title>철학마녀</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="독설을 품은 언니가 읽어 주는 내 사주 — 커리어부터, 마음 다스리는 법까지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#f2eef7; --sheet:#fcfaff; --ink:#1f1a2b; --ink2:#5d556e; --rule:#ddd5e8;
  --seal:#6b2fa3; --seal-soft:#e9dcf7; --note:#ebe5f2; --sting:#a8204f; --err:#b3261e;
  --f-title:"Noto Serif KR","Nanum Myeongjo",serif; --f-body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15111c; --sheet:#1e1828; --ink:#ece6f5; --ink2:#a99ebd; --rule:#352c44; --seal:#c49bff; --seal-soft:#3a2a52; --note:#261f33; --sting:#ff7aa8; --err:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#15111c; --sheet:#1e1828; --ink:#ece6f5; --ink2:#a99ebd; --rule:#352c44; --seal:#c49bff; --seal-soft:#3a2a52; --note:#261f33; --sting:#ff7aa8; --err:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.85; padding-inline:16px; padding-block:24px 72px; -webkit-text-size-adjust:100%}
.wrap{max-width:680px; margin:0 auto; display:grid; gap:24px}
h1,h2,h3{font-family:var(--f-title); text-wrap:balance; margin:0}
[hidden]{display:none!important}
.brand{display:grid; gap:6px; text-align:center; padding-block:12px 4px}
.brand .mark{font-family:var(--f-title); font-weight:900; font-size:34px; letter-spacing:.04em}
.brand .mark span{color:var(--seal)}
.brand p{margin:0; color:var(--ink2); font-size:15px}
.card{background:var(--sheet); border:1px solid var(--rule); border-radius:12px; padding:20px 18px; display:grid; gap:16px}
fieldset{border:0; margin:0; padding:0; display:grid; gap:8px; min-width:0}
legend{font-weight:700; font-size:15px; padding:0; margin-bottom:8px}
legend small{font-weight:400; color:var(--ink2)}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg label{position:relative}
.seg input{position:absolute; opacity:0; inset:0; margin:0}
.seg span{display:inline-block; border:1px solid var(--rule); background:var(--paper); border-radius:999px; padding:7px 14px; font-size:14.5px; cursor:pointer; line-height:1.4}
.seg input:checked+span{background:var(--seal); border-color:var(--seal); color:var(--sheet); font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--seal); outline-offset:2px}
.row3{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:8px}
.fld{display:grid; gap:4px; font-size:13px; color:var(--ink2); min-width:0}
.fld input,.fld select{font:inherit; font-size:16px; color:var(--ink); background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:10px 12px; width:100%; min-width:0}
.row2{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:end}
.chk{display:flex; gap:6px; align-items:center; font-size:14.5px; padding-bottom:10px}
.cta{font:inherit; font-family:var(--f-title); font-weight:900; font-size:18px; background:var(--seal); color:var(--sheet); border:0; border-radius:10px; padding:14px; cursor:pointer; width:100%}
.cta:focus-visible{outline:3px solid var(--sting); outline-offset:2px}
.fine{font-size:13.5px; color:var(--ink2); margin:0}
.msg{color:var(--err); font-weight:700; margin:0; min-height:1.2em}
.bad span{border-color:var(--err)!important}
.bad input,.bad select{border-color:var(--err)!important}
.head{background:var(--seal); color:var(--sheet); border-radius:12px; padding:20px; display:grid; gap:6px}
.head .lb{font-size:12.5px; letter-spacing:.08em; opacity:.85}
.head h2{font-size:22px}
.head .pl{font-family:var(--f-title); font-size:15px; opacity:.92}
.toc{background:var(--sheet); border:1px solid var(--rule); border-radius:10px; padding:4px 18px}
.toc a{display:grid; grid-template-columns:40px 1fr; gap:10px; padding:11px 0; border-bottom:1px solid var(--rule); color:inherit; text-decoration:none}
.toc a:last-child{border-bottom:0}
.toc .n{font-family:var(--f-title); color:var(--seal); font-variant-numeric:tabular-nums}
.toc .t{font-family:var(--f-title); font-weight:700; min-width:0}
.toc .d{display:block; font-family:var(--f-body); font-weight:400; font-size:13.5px; color:var(--ink2)}
.badge{display:inline-block; font-family:var(--f-body); font-size:11.5px; font-weight:700; background:var(--seal); color:var(--sheet); border-radius:5px; padding:1px 7px; margin-left:6px; vertical-align:2px}
.part{font-family:var(--f-title); font-weight:900; color:var(--seal); font-size:15px; letter-spacing:.12em; text-align:center; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:8px 0}
.pay{border:2px dashed var(--seal); border-radius:10px; padding:14px 16px; text-align:center; display:grid; gap:2px}
.pay strong{font-family:var(--f-title); font-size:18px}
.pay span{color:var(--ink2); font-size:14px}
.ch{background:var(--sheet); border:1px solid var(--rule); border-radius:10px; padding:22px 20px; display:grid; gap:14px; scroll-margin-top:12px; min-width:0}
.ch header{display:grid; grid-template-columns:40px 1fr; gap:10px; align-items:baseline}
.ch header .n{font-family:var(--f-title); color:var(--seal); font-size:19px; font-variant-numeric:tabular-nums}
.ch h2{font-size:21px; font-weight:900; line-height:1.4}
.ch .sub{display:block; font-family:var(--f-body); font-size:14px; font-weight:400; color:var(--ink2); margin-top:2px}
.ch p{margin:0; max-width:62ch}
.ch b{font-weight:700; background:linear-gradient(transparent 62%, var(--seal-soft) 62%)}
.ch h3{font-size:16.5px; font-weight:700; color:var(--seal); margin-top:4px}
.sting{font-family:var(--f-title); font-weight:900; font-size:18px; line-height:1.55; color:var(--sting)}
.yr{display:grid; gap:12px}
.yr .y{display:grid; grid-template-columns:62px 1fr; gap:12px; border-top:1px solid var(--rule); padding-top:12px}
.yr .y:first-child{border-top:0; padding-top:0}
.yr .yy{font-family:var(--f-title); font-weight:900; color:var(--seal); font-variant-numeric:tabular-nums}
.yr .yb{min-width:0}
.yr .nm{font-weight:700}
.mind{font-size:14.5px; color:var(--ink2)}
.rank{display:grid; gap:8px}
.rank div{display:grid; grid-template-columns:30px 1fr; gap:10px; border-top:1px solid var(--rule); padding-top:8px}
.rank div:first-child{border-top:0; padding-top:0}
.rank .mk{font-family:var(--f-title); font-weight:900; font-size:18px; color:var(--seal); text-align:center}
.bars{display:grid; gap:10px}
.bar{display:grid; grid-template-columns:90px 1fr; gap:10px; align-items:center; font-size:14px}
.bar .lab{font-variant-numeric:tabular-nums; color:var(--ink2); line-height:1.35}
.bar .lab b{background:none; color:var(--ink)}
.bar .track{background:var(--note); border-radius:6px; height:30px; min-width:0; position:relative; overflow:hidden}
.bar .fill{background:var(--rule); border-radius:6px; height:100%}
.bar .bl{position:absolute; left:10px; right:6px; top:50%; transform:translateY(-50%); font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar.top .fill{background:var(--seal)}
.bar.top .bl{color:var(--sheet)}
.bar.now .lab::after{content:" ◀ 지금"; color:var(--seal); font-weight:700}
.tbl{overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:560px; font-size:13.5px; line-height:1.55}
th,td{border-bottom:1px solid var(--rule); padding:8px 6px; text-align:left; vertical-align:top}
th{font-family:var(--f-title); color:var(--seal); font-weight:700; white-space:nowrap}
td:first-child{font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
.again{font:inherit; background:none; border:1px solid var(--seal); color:var(--seal); border-radius:10px; padding:12px; font-weight:700; cursor:pointer}
.foot{font-size:12.5px; color:var(--ink2); text-align:center}
@media (max-width:420px){ .toc a,.ch header{grid-template-columns:32px 1fr} .yr .y{grid-template-columns:52px 1fr} .bar{grid-template-columns:76px 1fr} .bar .bl{font-size:12px} .brand .mark{font-size:30px} }
</style>

</head><body>
<div class="wrap">
  <header class="brand">
    <div class="mark">철학<span>마녀</span></div>
    <p>듣기 싫은 말을 먼저 하고, 끝까지 당신 편인 언니</p>
  </header>

  <main id="formView" class="card" aria-label="생년월일 입력">
    <p class="fine">생년월일을 넣으면 팔자를 펴 드릴게요. 입력한 정보는 이 화면에서 계산에만 쓰고 어디에도 저장하지 않아요. <b>테스트판</b>이라 결제 없이 전부 보여 드려요.</p>
    <fieldset id="f-sex"><legend>성별</legend><div class="seg" data-name="sex"></div></fieldset>
    <fieldset id="f-love"><legend>연애는요</legend><div class="seg" data-name="love"></div></fieldset>
    <fieldset id="f-worry"><legend>제일 궁금한 것 <small>(하나만)</small></legend><div class="seg" data-name="worry"></div></fieldset>
    <fieldset id="f-cal"><legend>생일은</legend><div class="seg" data-name="cal"></div>
      <label class="chk" id="leapwrap" hidden><input type="checkbox" id="leap"> 윤달이에요</label></fieldset>
    <fieldset id="f-date"><legend>태어난 날</legend><div class="row3">
      <label class="fld">년<input id="y" inputmode="numeric" maxlength="4" placeholder="1995"></label>
      <label class="fld">월<input id="m" inputmode="numeric" maxlength="2" placeholder="4"></label>
      <label class="fld">일<input id="d" inputmode="numeric" maxlength="2" placeholder="20"></label></div>
      <p class="fine" id="lunarNote"></p></fieldset>
    <fieldset id="f-hour"><legend>태어난 시</legend><div class="row2">
      <label class="fld"><select id="h" aria-label="태어난 시"></select></label>
      <label class="chk"><input type="checkbox" id="unk"> 몰라요</label></div></fieldset>
    <fieldset id="f-jk"><legend>지금 일은요</legend><div class="seg" data-name="jk"></div></fieldset>
    <label class="fld" id="f-job">무슨 일인지 (안 적어도 돼요)<input id="job" placeholder="예: 회사 기획, 카페, 간호사" autocomplete="off"></label>
    <button type="button" class="cta" id="go">팔자 펴기</button>
    <p class="msg" id="err" role="alert" aria-live="assertive"></p>
  </main>

  <div id="resultView" hidden></div>
  <p class="foot">철학마녀 테스트판 · 사주는 참고예요. 결정은 당신이 해요.</p>
</div>

<script>var BANKS={"B1":{"DAEUN_CLOSE":["그 전엔 없던 일이다. 맞제?","시즌이 바뀌면 사람이 바뀐다. 니도 그때부터 달라졌을 기라.","맞제? 안 맞으면 니 옆 사람 얘기다. 시즌은 집 전체를 흔든다."],"DAEUN_EVENT":{"비견":"어깨 견줄 사람이 나타났다. 동료든 경쟁자든 동업자든. 혼자 하던 일에 사람이 붙었거나 니 자리에 누가 들어왔거나.","겁재":"돈이 나갔거나 누가 니 걸 가져갔다. 믿었던 사람한테 뺏겼거나 나눠 가질 일이 생겼거나. 평소 안 하던 승부도 걸었을 기라.","식신":"만들고 먹고 노는 쪽으로 판이 바뀌었다. 살이 붙었거나 새로 배우기 시작했거나, 아나 아랫사람 일이 커졌거나.","상관":"말이 많아지고 반항심이 올라왔다. 윗사람하고 부딪쳤거나, 하던 일 때려치우고 싶었거나, 새로 하고 싶은 말이 생겼거나.","편재":"큰돈이 움직였다. 들어왔든 나갔든. 투자, 사업, 이사, 큰 거래. 판이 커졌제.","정재":"꼬박꼬박 들어오는 게 생겼다. 취직, 안정, 살림 자리 잡기. 대신 답답해졌고.","편관":"어깨가 무거워졌다. 책임이 갑자기 늘었거나 윗사람이 바뀌었거나, 아프거나 눌리는 일. 빡센 시즌이다.","정관":"자리가 생겼다. 소속, 직함, 이름. 울타리 안으로 들어갔다. 대신 니 맘대로는 못 하게 됐고.","편인":"혼자 파고드는 시간이 늘었다. 엉뚱한 공부, 특이한 사람, 종교나 역술 같은 거. 별난 시즌이다.","정인":"받쳐 주는 게 생겼다. 도와주는 사람, 자격, 문서, 엄마 쪽 일. 혼자 버티던 게 밑에서 받쳐지기 시작했다."},"DAEUN_FRAME":["**{year}년에 10년 시즌이 바뀌었다.** {expl}","하나 더. **{year}년.** 니 10년 시즌이 넘어갔다. 시즌은 팔자가 10년마다 갈아입는 옷이다. {expl}"],"EL_ADJ":{"목":"일을 자꾸 새로 벌이는","화":"일단 드러내고 보는","토":"한번 쥔 걸 안 놓는","금":"맞다 틀리다를 끝까지 가리는","수":"생각이 많아 결정을 미루는"},"EL_COP":{"목":"다","화":"이다","토":"이다","금":"다","수":"이다"},"EL_MEAN":{"목":{"name":"나무(木)","mean":"나무는 위로 뻗는 기운이다. 새로 시작하고 키우고 계획 세우는 쪽.","habit":"일을 자꾸 새로 벌이는 거"},"화":{"name":"불(火)","mean":"불은 드러내는 기운이다. 말하고 보여 주고 사람 앞에 서는 쪽.","habit":"일단 드러내고 보는 거"},"토":{"name":"흙(土)","mean":"흙은 붙드는 기운이다. 쌓고 지키고 사이에서 중재하는 쪽.","habit":"한번 쥔 걸 안 놓는 거"},"금":{"name":"쇠(金)","mean":"쇠는 자르는 기운이다. 따지고 정리하고 선 긋는 쪽.","habit":"맞다 틀리다를 끝까지 가리는 거"},"수":{"name":"물(水)","mean":"물은 스며드는 기운이다. 궁리하고 알아보고 상황 따라 모양을 바꾸는 쪽.","habit":"생각이 많아서 결정을 미루는 거"}},"END":["그게 니 팔자다. 여기까지는 공짜다. 니가 와 그때 그랬는지, 앞으로 어떤 손님이 오는지, 돈은 어디로 흐르는지. 나머지는 앉아서 들어라.","여기까지가 {화자}가 공짜로 봐 주는 거다. 나머지는 돈 받고 본다. 열여섯 편 중 열다섯 편, 니 얘기만 골라서."],"END2":{"q":"여기까지가 공짜다. 니가 물은 거, **{label}** 그 답은 바로 다음 장에 결론부터 있다. 나머지도 니 얘기만 골라서 한다.","none":"여기까지가 공짜다. 나머지는 니 얘기만 골라서 한다. 올해하고 내년, 바로 다음 장부터 간다."},"FORMULA":{"both":"니 팔자 {tot} 글자 중에 {n} 자가 {name}{cop}. 그런데 {mname}은 한 자도 없다. 한마디로 니는 **{adj} 사람인데, {madj} 사람**이다. 니 인생이 늘 같은 데서 막히는 게 그래서다.","many":"니 팔자 {tot} 글자 중에 {n} 자가 {name}{cop}. 한마디로 니는 **{adj} 사람**이다. 잘될 때도 이걸로 되고, 탈 날 때도 이것 때문이다.","miss":"니 팔자엔 {mname}이 한 자도 없다. 한마디로 니는 **{madj} 사람**이다. 니 인생이 늘 같은 데서 막히는 게 그래서다.","none":"니 팔자엔 다섯 기운이 고르게 다 있다. 한마디로 니는 **어디 가도 적응하는 사람**이다. 대신 딱 한 군데 미치지 못해서 늘 어중간하다는 소리를 듣는다."},"JOB":{"식신":{"guess":"니, 뭘 만들어서 내놓는 일 하제? 요리든 물건이든 글이든, 손으로 모양을 만드는 쪽.","why":"와 아냐고? 니 팔자에 **손에서 뭐가 나오는 기운**이 간판으로 떠 있거든. 빵이든 글이든 영상이든, 눈에 보이는 걸 만들어 내놓는 재주다.","jobs":"요리, 제조, 공예, 콘텐츠 만드는 일, 손님 받는 일. 이런 데서 편했을 기라.","src":"kmZdzxsC_ZU"},"상관":{"guess":"니, 말로 먹고사는 일 하제? 기획이든 강의든 영업이든, 입이 밥벌이인 쪽.","why":"와 아냐고? 니 팔자에 **말로 사람을 움직이는 기운**이 간판으로 떠 있거든. 손에 잡히는 건 없는데 듣는 사람 마음이 바뀐다. 말, 글, 아이디어.","jobs":"기획, 마케팅, 강의, 방송, 영업, 창작. 시키는 대로만 하는 자리에선 숨 막혔을 기라.","src":"3ogDqj7GAA4"},"편재":{"guess":"니, 돈 굴리는 일 하제? 장사든 영업이든 투자든, 판 벌여서 돌리는 쪽.","why":"와 아냐고? 니 팔자에 **통 큰 돈 기운**이 간판으로 떠 있거든. 만 원 아끼려고 한 정거장 걸어가면서 천만 원짜리 계약엔 그 자리서 도장 찍는 기운이다.","jobs":"사업, 유통, 영업, 부동산, 투자. 정해진 월급 받는 자리는 답답했을 기라.","src":"lg8dRHOk6uc"},"정재":{"guess":"니, 꼬박꼬박 버는 일 하제? 월급이든 단골 장사든, 시계 보면서 성실하게 쌓는 쪽.","why":"와 아냐고? 니 팔자에 **꼬박꼬박 버는 기운**이 간판으로 떠 있거든. 달력에 월급날 동그라미 쳐 놓고 적금 자동이체 몇 개씩 걸어 둔 사람 기운이다.","jobs":"회계, 관리, 안정된 직장, 전문 기술, 꾸준한 장사. 한탕은 니 체질 아이다.","src":"M1sNyFw_rd0"},"편관":{"guess":"니, 빡센 일 하제? 현장이든 책임 자리든, 남들 힘들어서 안 하는 쪽.","why":"와 아냐고? 니 팔자에 **니를 몰아붙이는 기운**이 간판으로 떠 있거든. 마감 박아 놓고 매일 어데까지 했노 묻는 상사 같은 힘. 그게 니를 키운다.","jobs":"군인, 경찰, 현장 관리, 응급, 영업 최전선, 감독. 편한 자리 가면 오히려 병난다.","src":"OmhI56LBA5k"},"정관":{"guess":"니, 조직에서 자리 지키는 일 하제? 회사든 관공서든, 울타리 안에서 인정받는 쪽.","why":"와 아냐고? 니 팔자에 **소속 기운**이 간판으로 떠 있거든. 명함에 회사 이름 박혀 있어야 마음 놓이는 사람이다. 니는 울타리가 있어야 산다.","jobs":"공무원, 대기업, 관리직, 법, 품질, 행정. 혼자 판 벌이는 건 니한테 안 맞는다.","src":"5CIzqiHxzow"},"편인":{"guess":"니, 남들 안 하는 걸 파는 일 하제? 특수 기술이든 종교든 예술이든, 좀 별난 쪽.","why":"와 아냐고? 니 팔자에 **옆길로 배운 기운**이 간판으로 떠 있거든. 학원 안 다니고 혼자 파서 남보다 잘하게 된 재주. 정해진 길 말고 니 식으로 익힌 기라.","jobs":"특수 기술, 연구, 예술, 상담, 종교, 역술. 짧게는 센데 길게는 끈기가 딸린다. 그거 알고 골라라.","src":"J8L7hBJEsBo"},"정인":{"guess":"니, 배운 걸 남한테 넘기는 일 하제? 가르치거나 문서 다루거나 자격으로 먹고사는 쪽.","why":"와 아냐고? 니 팔자에 **배워서 넘기는 기운**이 간판으로 떠 있거든. 교과서대로 차근차근 가르치는 담임 선생 같은 기운. 배우고 정리해서 다음 사람한테 넘긴다.","jobs":"교사, 연구, 문서, 자격증 직종, 행정, 편집. 배움이 곧 밥이다.","src":"b0oHwvEf8xg"},"비견":{"guess":"니, 사람하고 어깨 부딪히는 일 하제? 팀이든 현장이든 동업이든, 혼자보다 여럿인 쪽.","why":"와 아냐고? 니 팔자에 **니랑 똑같은 놈 기운**이 간판으로 떠 있거든. 한 반에 니랑 같은 과목 잘하는 애가 있는 거랑 같다. 경쟁이고 동료다.","jobs":"팀장, 현장, 체육, 영업 조직, 동업. 혼자 방에서 하는 일은 금방 질린다.","src":"AsqB7aXMo3Q"},"겁재":{"guess":"니, 승부 붙는 일 하제? 평소엔 얌전한데 판만 벌어지면 사람이 달라지는 쪽.","why":"와 아냐고? 니 팔자에 **승부 기운**이 간판으로 떠 있거든. 평소엔 순한데 내기만 걸리면 눈빛이 바뀌는 사람. 니 안에 딴 놈이 산다.","jobs":"승부, 투자, 영업, 스포츠, 자영업. 남 밑에서 얌전히 있으면 그놈이 답답해한다.","src":"Y9SvHF2b0zk"}},"JOB_BACK":["아니라꼬? 그라모 그 일이 하고 싶어서 근질근질했을 기라. 안 했으면 후회했고.","아이가? 그라모 지금 하는 일에서 그 부분만 유독 잘했을 기라. 남들이 니한테 그걸 시켰고.","아니면 말고. 근데 니 주변에 그런 일 하는 사람이 니한테 자꾸 물어봤을 기라."],"JOB_BACK_G":{"재성":"아니라꼬? 월급 받는 자리였어도 재테크며 부업 머리는 늘 돌아갔을 기라. 통장 쪼개 놓고 굴렸제.","관성":"아니라꼬? 그라모 일 밖에서도 늘 니가 총대 멨을 기라. 모임이든 집안이든 결국 니한테 맡겨졌제.","인성":"아니라꼬? 그라모 자격증이든 공부든 계속 붙들고 있었을 기라. 사 놓고 안 읽은 책이 몇 권이고.","식상":"아니라꼬? 그라모 일 말고 취미로라도 뭘 만들거나 떠들고 있었을 기라. 가만있으면 좀이 쑤시제.","비겁":"아니라꼬? 그라모 혼자 하는 일이라도 경쟁만 붙으면 눈빛이 달라졌을 기라. 지는 건 못 참제."},"JOB_FIT":{"employee":["정관","정재","정인","편관","비견"],"public":["정관","정인","정재","편관"],"self":["편재","정재","겁재","식신","상관","비견"],"freelance":["상관","식신","편인","편재"]},"JOB_FIT_NO":"근데 하는 일하고 간판이 다르다. 그래서 그 일 하면서도 마음 한쪽은 딴 데 가 있었을 기라. {back}","JOB_FIT_YES":"그 일이 니 몸에 맞는 기라. {desc}","JOB_GANPAN":"니 팔자 간판엔 **{gp}**이 떠 있다.","JOB_KNOWN":{"employee":"니, 회사 다닌다 캤제.","public":"니, 공무원이나 선생 쪽 일 한다 캤제.","self":"니, 장사한다 캤제.","freelance":"니, 프리랜서로 일감 받아 한다 캤제.","jobseeker":"니, 일 찾는 중이라 캤제.","student":"니, 아직 학생이라 캤제.","homemaker":"니, 살림한다 캤제.","retired":"니, 은퇴했다 캤제.","rest":"니, 지금 쉬는 중이라 캤제.","preretire":"니, 퇴직 준비한다 캤제."},"JOB_OTHER":"{desc} {back}","JOB_PERSONAL":"니 같으면 {jobs} 같은 이름으로도 나온다.","JOB_YOUNG":"{desc} 그래서 길을 고른다면 {jobs} 쪽이 편하다.","KNUM":{"1":"한","2":"두","3":"세","4":"네","5":"다섯","6":"여섯","7":"일곱","8":"여덟"},"MANY":"니 팔자 {tot} 글자 중에 {n} 자가 {name}이다. {mean} 한 가지가 {n} 자면 그게 니 **타고난 기본값**이다. 잘될 때도 그걸로 되고 탈 날 때도 그것 때문이다. 니 같으면 {habit}, 그게 밥이자 병이다.","MISSING":{"목":"근데 **나무(木)가 없다.** 시작하는 기운, 뻗어 나가는 기운이 없단 말이다. 그래서 니는 시작에 집착한다. 새로 벌이고 싶어 안달인데 정작 첫발이 무겁다.","화":"근데 **불(火)이 없다.** 드러내는 기운, 표현하는 기운이 없다. 그래서 니는 오히려 튀고 싶어 한다. 없는 놈이 더 집착하는 법이다.","토":"근데 **흙(土)이 없다.** 중심 잡는 기운이 없다. 그래서 니는 안정에 집착한다. 자리 잡고 싶은데 자꾸 뜬다.","금":"근데 **쇠(金)가 없다.** 자르는 기운이 없단 말이다. 남이 니를 못 자르는데, 니도 니를 못 자른다. 끊을 때 못 끊는 거, 그거다.","수":"근데 **물(水)이 없다.** 흐르는 기운, 궁리하는 기운이 없다. 그래서 니는 배우는 데 집착한다. 공부에 목마른데 정작 유연한 게 약하다."},"MISSING_CLOSE":["없는 게 흠이 아이다. 팔자에 없는 건 복이다. 그 얘기는 뒤에서 한다.","없다고 채우려 들지 마라. 없는 걸 좇으면 있는 것까지 흔들린다. 그건 뒤에서."],"MISSING_NONE":"그라고 다섯 기운이 다 있다. 없는 게 없으니 집착도 없다. 대신 딱히 목마른 것도 없어서 뭘 좇아야 할지 모를 때가 있다.","MISS_ADJ":{"목":"새로 시작하는 첫발이 늘 무거운","화":"속을 잘 못 드러내는","토":"자리를 못 잡고 자꾸 뜨는","금":"끊을 때 못 끊는","수":"생각을 유연하게 못 돌리는"},"OPEN":["앉아라. 니 팔자 보기 전에 두 개만 맞혀 보자.","앉아라. 팔자 펴기 전에 내가 먼저 두 마디 하꾸마.","앉아 봐라. 사주 보러 왔제? 보기 전에 내가 먼저 찍는다."],"ORD":["하나","둘","셋"],"SEUN_CLOSE":["해마다 오는 기운은 손님이다. 왔다 간다. 근데 그 손님이 뭘 두고 갔는지는 니가 안다.","아니라꼬? 그라모 그해 니 옆 사람한테 그 일이 있었다. 손님은 집에 오지, 니한테만 오는 게 아이다."],"SEUN_EVENT":{"chung":"**{year}년에 자리가 흔들렸제.** 이사, 일 바뀜, 이별, 뭔가 갈라진 일. 그해 손님이 니 집 기둥을 정면으로 들이받았다.","편관":"**{year}년에 눌렸제.** 책임, 압박, 윗사람, 몸 고생. 빡센 놈이 집에 들어온 해다.","겁재":"**{year}년에 돈이 새거나 누가 가져갔제.** 니 몫 가져가는 놈이 집에 온 해다.","상관":"**{year}년에 말로 사고 쳤거나 뭔가 때려치웠제.** 참던 게 터지는 해다.","식신":"**{year}년엔 먹고 만들고 노는 쪽으로 판이 갔제.** 살이 붙거나 새로 배운 게 있거나.","편재":"**{year}년에 돈이 크게 움직였제.** 들어왔든 나갔든 판이 커진 해다.","정재":"**{year}년엔 꼬박꼬박이 생겼제.** 자리 잡고 안정된 대신 답답했던 해다.","편인":"**{year}년엔 혼자 파고들었제.** 엉뚱한 공부, 특이한 인연.","정인":"**{year}년엔 누가 받쳐 줬제.** 도움, 문서, 자격이 들어온 해다.","정관":"**{year}년에 자리나 이름이 생겼제.** 울타리가 씌워진 해다.","비견":"**{year}년에 니 같은 놈이 붙었제.** 경쟁이든 동료든."},"STEM_IMG":{"0":"**큰 나무(甲)**다. 위로만 자란다. 굽힐 줄 몰라서 부러지면 부러지지 안 휜다.","1":"**화초, 덩굴(乙)**이다. 감고 올라간다. 기댈 데만 잘 고르면 어디까지든 올라가는 사람.","2":"**한낮의 해(丙)**다. 안 비추는 데가 없다. 눈에는 확 띄는데 꾸준한 게 약하다.","3":"**촛불(丁)**이다. 작게 오래 탄다. 예민한 게 아니라 눈치가 빠른 기라.","4":"**큰 산(戊)**이다. 안 움직인다. 믿음직한데 속을 안 보여 준다.","5":"**논밭(己)**이다. 뭐든 심으면 기른다. 실속파인데, 남 일에 니 땅을 다 내준다.","6":"**무쇠, 도끼(庚)**다.
